sarva"]],["तत्","tat","that","तद्","tad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["tad"]],["उ","u","indeed","उ","u","अव्यय","avyaya","indeclinable",["u"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["अत्येति","atyeti","goes beyond","अति-इ","ati-i","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["atī"]],["कश्चन","kaścana","anyone","कश्चन","kaścana","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["kaścana"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["etad"]],["वै","vai","indeed","वै","vai","अव्यय","avyaya","indeclinable",["vai"]],["तत्","tat","is that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]]],"t":"“This is the ancient fig tree, with its root above and its branches below. That root alone is the pure, that is Brahman, that alone is called the immortal. In it all the worlds rest, and no one goes beyond it. This indeed is that.”","notes":["Śaṅkara: the tree is the tree of worldly existence, reaching from the unmanifest down to unmoving things. Its root, above, is the highest state of Viṣṇu. It is called a tree (vṛkṣa) because it can be cut down, and aśvattha because, like that tree, it is always trembling, shaken by the wind of desire and action. Its branches are heaven, hell, and the states of animals and departed spirits. It is ‘ancient’ because it has no beginning. It is felled by the weapon of non-attachment that comes from seeing Brahman as the Self."],"by":null,"var":[],"x":false},{"n":"2.3.2","label":null,"d":"यदिदं किंच जगत्सर्वं प्राण एजति निःसृतम् ।\nमहद्भयं वज्रमुद्यतं य एतद्विदुरमृतास्ते भवन्ति ॥ २ ॥","i":"yad idaṃ kiṃca jagat sarvaṃ prāṇa ejati niḥsṛtam |\nmahad bhayaṃ vajram udyataṃ ya etad vidur amṛtās te bhavanti || 2 ||","pd":"यत् इदम् किंच जगत् सर्वम् प्राणे एजति निःसृतम् महत् भयम् वज्रम् उद्यतम् ये एतत् विदुः अमृताः ते भवन्ति","pi":"yat idam kiṃca jagat sarvam prāṇe ejati niḥsṛtam mahat bhayam vajram udyatam ye etat viduḥ amṛtāḥ te bhavanti","w":[["यत्","yat","whatever","यद्","yad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["yad"]],["इदम्","idam","this","इदम्","idam","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["idam"]],["किंच","kiṃca","at all","किंच","kiṃca","अव्यय","avyaya","indeclinable",["kiñca"]],["जगत्","jagat","world","जगत्","jagat","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["jagat"]],["सर्वम्","sarvam","whole","सर्व","sarva","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["sarva"]],["प्राणे","prāṇe","in the life-breath (Brahman)","प्राण","prāṇa","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["prāṇa"]],["एजति","ejati","moves","एज्","ej","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["ej"]],["निःसृतम्","niḥsṛtam","having come forth","निस्-सृ","nis-sṛ","क्त, प्रथमा, नपुं, एक","kta, prathamā, napuṃ, eka","past passive participle n. nom. sg.",["niḥsṛ"]],["महत्","mahat","a great","महत्","mahat","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["mahat"]],["भयम्","bhayam","terror","भय","bhaya","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["bhaya"]],["वज्रम्","vajram","a thunderbolt","वज्र","vajra","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["vajra"]],["उद्यतम्","udyatam","raised","उत्-यम्","ut-yam","क्त, प्रथमा, नपुं, एक","kta, prathamā, napuṃ, eka","past passive participle n. nom. sg.",["udyam"]],["ये","ye","who","यद्","yad","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["yad"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["etad"]],["विदुः","viduḥ","know","विद्","vid","लिट्, प्रथम, बहु","liṭ, prathama, bahu","perfect 3rd pl.",["vid"]],["अमृताः","amṛtāḥ","immortal","अमृत","amṛta","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["amṛta"]],["ते","te","they","तद्","tad","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["tad"]],["भवन्ति","bhavanti","become","भू","bhū","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["bhū"]]],"t":"“This whole world, whatever there is, has come forth from Brahman, the life-breath, and moves in it. It is a great terror, a thunderbolt raised. Those who know this become immortal.”","notes":["Śaṅkara: this answers the view that the world arose from nothing. prāṇa is the supreme Brahman. As servants keep to their master's command on seeing him before them with thunderbolt raised, so this world of sun, moon, planets and stars keeps to its order without a moment's rest."],"by":null,"var":[],"x":false},{"n":"2.3.3","label":null,"d":"भयादस्याग्निस्तपति भयात्तपति सूर्यः ।\nभयादिन्द्रश्च वायुश्च मृत्युर्धावति पञ्चमः ॥ ३ ॥","i":"bhayād asyāgnis tapati bhayāt tapati sūryaḥ |\nbhayād indraś ca vāyuś ca mṛtyur dhāvati pañcamaḥ || 3 ||","pd":"भयात् अस्य अग्निः तपति भयात् तपति सूर्यः भयात् इन्द्रः च वायुः च मृत्युः धावति पञ्चमः","pi":"bhayāt asya agniḥ tapati bhayāt tapati sūryaḥ bhayāt indraḥ ca vāyuḥ ca mṛtyuḥ dhāvati pañcamaḥ","w":[["भयात्","bhayāt","from fear","भय","bhaya","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["bhaya"]],["अस्य","asya","of him","इदम्","idam","सर्वनाम, षष्ठी, पुं, एक","sarvanāma, ṣaṣṭhī, puṃ, eka","pronoun m. gen. sg.",["idam"]],["अग्निः","agniḥ","fire","अग्नि","agni","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["agni"]],["तपति","tapati","burns","तप्","tap","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["tap"]],["भयात्","bhayāt","from fear","भय","bhaya","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["bhaya"]],["तपति","tapati","gives heat","तप्","tap","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["tap"]],["सूर्यः","sūryaḥ","the sun","सूर्य","sūrya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["sūrya"]],["भयात्","bhayāt","from fear","भय","bhaya","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["bhaya"]],["इन्द्रः","indraḥ","Indra","इन्द्र","indra","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["indra"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["वायुः","vāyuḥ","the wind","वायु","vāyu","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vāyu"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["मृत्युः","mṛtyuḥ","Death","मृत्यु","mṛtyu","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["mṛtyu"]],["धावति","dhāvati","runs","धाव्","dhāv","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["dhāv"]],["पञ्चमः","pañcamaḥ","the fifth","पञ्चम","pañcama","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["pañcama"]]],"t":"“From fear of him fire burns; from fear of him the sun gives heat; from fear of him Indra, the wind, and Death, the fifth, run to their tasks.”","notes":["Śaṅkara: ‘him’ is the supreme Lord. Were there no ruler over these mighty guardians of the world, their regular activity, like that of servants in fear of their master, could not be explained."],"by":null,"var":[],"x":false},{"n":"2.3.4","label":null,"d":"इह चेदशकद्बोद्धुं प्राक्शरीरस्य विस्रसः ।\nततः सर्गेषु लोकेषु शरीरत्वाय कल्पते ॥ ४ ॥","i":"iha ced aśakad boddhuṃ prākśarīrasya visrasaḥ |\ntataḥ sargeṣu lokeṣu śarīratvāya kalpate || 4 ||","pd":"इह चेत् अशकत् बोद्धुम् प्राक् शरीरस्य विस्रसः ततः सर्गेषु लोकेषु शरीर-त्वाय कल्पते","pi":"iha cet aśakat boddhum prāk śarīrasya visrasaḥ tataḥ sargeṣu lokeṣu śarīra-tvāya kalpate","w":[["इह","iha","here","इह","iha","अव्यय","avyaya","indeclinable",["iha"]],["चेत्","cet","if","चेद्","ced","अव्यय","avyaya","indeclinable",["ced"]],["अशकत्","aśakat","one has been able","शक्","śak","लुङ्, प्रथम, एक","luṅ, prathama, eka","aorist 3rd sg.",["śak"]],["बोद्धुम्","boddhum","to know","बुध्","budh","तुमुन्","tumun","infinitive",["budh"]],["प्राक्","prāk","before","प्राक्","prāk","अव्यय","avyaya","indeclinable",["prāk"]],["शरीरस्य","śarīrasya","of the body","शरीर","śarīra","षष्ठी, नपुं, एक","ṣaṣṭhī, napuṃ, eka","n. gen. sg.",["śarīra"]],["विस्रसः","visrasaḥ","the falling away","विस्रस्","visras","पञ्चमी, स्त्री, एक","pañcamī, strī, eka","f. abl. sg.",["visras"]],["ततः","tataḥ","then, otherwise","ततस्","tatas","अव्यय","avyaya","indeclinable",["tatas"]],["सर्गेषु","sargeṣu","in the created","सर्ग","sarga","सप्तमी, पुं, बहु","saptamī, puṃ, bahu","m. loc. pl.",["sarga"]],["लोकेषु","lokeṣu","worlds","लोक","loka","सप्तमी, पुं, बहु","saptamī, puṃ, bahu","m. loc. pl.",["loka"]],["शरीर-त्वाय","śarīra-tvāya","for taking a body","शरीरत्व","śarīratva","चतुर्थी, नपुं, एक","caturthī, napuṃ, eka","n. dat. sg.",["śarīratva"]],["कल्पते","kalpate","one becomes fit","कॢप्","kḷp","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["kḷp"]]],"t":"“If one has been able to know it here, before the body falls away, one is freed; if not, one becomes fit to take a body in the worlds of creation.”","notes":["Śaṅkara supplies what is left unsaid: one who knows Brahman, the cause of that fear, while still living is released from the bondage of worldly existence; one who has not is embodied again. So the effort to know the Self must be made before the body falls, for only here is the Self seen clearly, like a face in a mirror."],"by":null,"var":[],"x":false},{"n":"2.3.5","label":null,"d":"यथादर्शे तथात्मनि यथा स्वप्ने तथा पितृलोके ।\nयथाप्सु परीव ददृशे तथा गन्धर्वलोके छायातपयोरिव ब्रह्मलोके ॥ ५ ॥","i":"yathādarśe tathātmani yathā svapne tathā pitṛloke |\nyathāpsu parīva dadṛśe tathā gandharvaloke chāyātapayor iva brahmaloke || 5 ||","pd":"यथा आदर्शे तथा आत्मनि यथा स्वप्ने तथा पितृ-लोके यथा अप्सु परि इव ददृशे तथा गन्धर्व-लोके छाया-आतपयोः इव ब्रह्म-लोके","pi":"yathā ādarśe tathā ātmani yathā svapne tathā pitṛ-loke yathā apsu pari iva dadṛśe tathā gandharva-loke chāyā-ātapayoḥ iva brahma-loke","w":[["यथा","yathā","as","यथा","yathā","अव्यय","avyaya","indeclinable",["yathā"]],["आदर्शे","ādarśe","in a mirror","आदर्श","ādarśa","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["ādarśa"]],["तथा","tathā","so","तथा","tathā","अव्यय","avyaya","indeclinable",["tathā"]],["आत्मनि","ātmani","in oneself","आत्मन्","ātman","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["ātman"]],["यथा","yathā","as","यथा","yathā","अव्यय","avyaya","indeclinable",["yathā"]],["स्वप्ने","svapne","in a dream","स्वप्न","svapna","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["svapna"]],["तथा","tathā","so","तथा","tathā","अव्यय","avyaya","indeclinable",["tathā"]],["पितृ-लोके","pitṛ-loke","in the world of the ancestors","पितृलोक","pitṛloka","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["pitṛloka"]],["यथा","yathā","as","यथा","yathā","अव्यय","avyaya","indeclinable",["yathā"]],["अप्सु","apsu","in water","अप्","ap","सप्तमी, स्त्री, बहु","saptamī, strī, bahu","f. loc. pl.",["ap"]],["परि","pari","(with dadṛśe)","परि","pari","अव्यय","avyaya","indeclinable",["pari"]],["इव","iva","as it were","इव","iva","अव्यय","avyaya","indeclinable",["iva"]],["ददृशे","dadṛśe","it is seen","दृश्","dṛś","लिट्, प्रथम, एक","liṭ, prathama, eka","perfect 3rd sg.",["dṛś"]],["तथा","tathā","so","तथा","tathā","अव्यय","avyaya","indeclinable",["tathā"]],["गन्धर्व-लोके","gandharva-loke","in the world of the gandharvas","गन्धर्वलोक","gandharvaloka","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["gandharvaloka"]],["छाया-आतपयोः","chāyā-ātapayoḥ","in shade and light","छायातप","chāyātapa","सप्तमी, पुं, द्वि","saptamī, puṃ, dvi","m. loc. du.",["chāyā","ātapa"]],["इव","iva","as","इव","iva","अव्यय","avyaya","indeclinable",["iva"]],["ब्रह्म-लोके","brahma-loke","in the world of Brahmā","ब्रह्मलोक","brahmaloka","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["brahmaloka"]]],"t":"“As in a mirror, so it is seen in oneself; as in a dream, so in the world of the ancestors; as it is seen, so to speak, in water, so in the world of the gandharvas; as shade and light, so in the world of Brahmā.”","notes":["pari … dadṛśe is one verb (paridadṛśe), its parts separated in the verse.","Śaṅkara: in one's own intellect, when it is clear as a mirror, the Self is seen quite distinctly. In the world of the ancestors the sight is blurred, as in a dream, and likewise in the world of the gandharvas, as a reflection in water. Only in the world of Brahmā is it as distinct as shade from light, and that world is hard to reach. Therefore the effort must be made here."],"by":null,"var":[],"x":false},{"n":"2.3.6","label":null,"d":"इन्द्रियाणां पृथग्भावमुदयास्तमयौ च यत् ।\nपृथगुत्पद्यमानानां मत्वा धीरो न शोचति ॥ ६ ॥","i":"indriyāṇāṃ pṛthagbhāvam udayāstamayau ca yat |\npṛthag utpadyamānānāṃ matvā dhīro na śocati || 6 ||","pd":"इन्द्रियाणाम् पृथग्भावम् उदय-अस्तमयौ च यत् पृथक् उत्पद्यमानानाम् मत्वा धीरः न शोचति","pi":"indriyāṇām pṛthagbhāvam udaya-astamayau ca yat pṛthak utpadyamānānām matvā dhīraḥ na śocati","w":[["इन्द्रियाणाम्","indriyāṇām","of the senses","इन्द्रिय","indriya","षष्ठी, नपुं, बहु","ṣaṣṭhī, napuṃ, bahu","n. gen. pl.",["indriya"]],["पृथग्भावम्","pṛthagbhāvam","the separate nature","पृथग्भाव","pṛthagbhāva","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["pṛthagbhāva"]],["उदय-अस्तमयौ","udaya-astamayau","rising and setting","उदयास्तमय","udayāstamaya","द्वितीया, पुं, द्वि","dvitīyā, puṃ, dvi","m. acc. du.",["udayāstamaya"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["यत्","yat","which","यद्","yad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["yad"]],["पृथक्","pṛthak","separately","पृथक्","pṛthak","अव्यय","avyaya","indeclinable",["pṛthak"]],["उत्पद्यमानानाम्","utpadyamānānām","which arise","उत्-पद्","ut-pad","शतृ।शानच्, षष्ठी, नपुं, बहु","śatṛ/śānac, ṣaṣṭhī, napuṃ, bahu","present participle n. gen. pl.",["utpad"]],["मत्वा","matvā","having known","मन्","man","क्त्वा","ktvā","absolutive",["man"]],["धीरः","dhīraḥ","the wise one","धीर","dhīra","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["dhīra"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["शोचति","śocati","grieves","शुच्","śuc","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["śuc"]]],"t":"“Knowing that the senses, which arise separately, are different in nature, and that the rising and setting are theirs, the wise man does not grieve.”","notes":["Śaṅkara: the senses arise separately from their causes, space and the rest, each to grasp its own object, and are wholly unlike the Self, which is pure consciousness alone. Their rising and setting, in waking and sleep, do not belong to the Self."],"by":null,"var":[],"x":false},{"n":"2.3.7","label":null,"d":"इन्द्रियेभ्यः परं मनो मनसः सत्त्वमुत्तमम् ।\nसत्त्वादधि महानात्मा महतोऽव्यक्तमुत्तमम् ॥ ७ ॥","i":"indriyebhyaḥ paraṃ mano manasaḥ sattvam uttamam |\nsattvād adhi mahānātmā mahato 'vyaktam uttamam || 7 ||","pd":"इन्द्रियेभ्यः परम् मनः मनसः सत्त्वम् उत्तमम् सत्त्वात् अधि महान् आत्मा महतः अव्यक्तम् उत्तमम्","pi":"indriyebhyaḥ param manaḥ manasaḥ sattvam uttamam sattvāt adhi mahān ātmā mahataḥ avyaktam uttamam","w":[["इन्द्रियेभ्यः","indriyebhyaḥ","than the senses","इन्द्रिय","indriya","पञ्चमी, नपुं, बहु","pañcamī, napuṃ, bahu","n. abl. pl.",["indriya"]],["परम्","param","higher","पर","para","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["para"]],["मनः","manaḥ","the mind","मनस्","manas","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["manas"]],["मनसः","manasaḥ","than the mind","मनस्","manas","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["manas"]],["सत्त्वम्","sattvam","the intellect","सत्त्व","sattva","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["sattva"]],["उत्तमम्","uttamam","higher","उत्तम","uttama","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["uttama"]],["सत्त्वात्","sattvāt","than the intellect","सत्त्व","sattva","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["sattva"]],["अधि","adhi","above","अधि","adhi","अव्यय","avyaya","indeclinable",["adhi"]],["महान्","mahān","the great","महत्","mahat","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["mahat"]],["आत्मा","ātmā","self","आत्मन्","ātman","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["ātman"]],["महतः","mahataḥ","than the great","महत्","mahat","पञ्चमी, पुं, एक","pañcamī, puṃ, eka","m. abl. sg.",["mahat"]],["अव्यक्तम्","avyaktam","the unmanifest","अव्यक्त","avyakta","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["avyakta"]],["उत्तमम्","uttamam","higher","उत्तम","uttama","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["uttama"]]],"t":"“Higher than the senses is the mind; higher than the mind is the intellect; above the intellect is the great self; higher than the great is the unmanifest.”","notes":["Śaṅkara: the Self is not to be sought outside, for it is the inmost of all; this is how. The objects are here included with the senses, being of the same kind. sattva means the intellect. The rest is as at 1.3.10–11."],"by":null,"var":[],"x":false},{"n":"2.3.8","label":null,"d":"अव्यक्तात्तु परः पुरुषो व्यापकोऽलिङ्ग एव च ।\nयं ज्ञात्वा मुच्यते जन्तुरमृतत्वं च गच्छति ॥ ८ ॥","i":"avyaktāt tu paraḥ puruṣo vyāpako 'liṅga eva ca |\nyaṃ jñātvā mucyate jantur amṛtatvaṃ ca gacchati || 8 ||","pd":"अव्यक्तात् तु परः पुरुषः व्यापकः अलिङ्गः एव च यम् ज्ञात्वा मुच्यते जन्तुः अमृत-त्वम् च गच्छति","pi":"avyaktāt tu paraḥ puruṣaḥ vyāpakaḥ aliṅgaḥ eva ca yam jñātvā mucyate jantuḥ amṛta-tvam ca gacchati","w":[["अव्यक्तात्","avyaktāt","than the unmanifest","अव्यक्त","avyakta","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["avyakta"]],["तु","tu","but","तु","tu","अव्यय","avyaya","indeclinable",["tu"]],["परः","paraḥ","higher","पर","para","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["para"]],["पुरुषः","puruṣaḥ","the Person","पुरुष","puruṣa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["puruṣa"]],["व्यापकः","vyāpakaḥ","all-pervading","व्यापक","vyāpaka","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vyāpaka"]],["अलिङ्गः","aliṅgaḥ","without any mark","अलिङ्ग","aliṅga","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["aliṅga"]],["एव","eva","indeed","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["यम्","yam","whom","यद्","yad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["yad"]],["ज्ञात्वा","jñātvā","having known","ज्ञा","jñā","क्त्वा","ktvā","absolutive",["jñā"]],["मुच्यते","mucyate","is freed","मुच्","muc","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["muc"]],["जन्तुः","jantuḥ","a creature","जन्तु","jantu","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["jantu"]],["अमृत-त्वम्","amṛta-tvam","immortality","अमृतत्व","amṛtatva","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["amṛtatva"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["गच्छति","gacchati","attains","गम्","gam","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["gam"]]],"t":"“But higher than the unmanifest is the Person, all-pervading and without any mark. Knowing him, a creature is freed and attains immortality.”","notes":["Śaṅkara: a mark (liṅga) is that by which a thing is inferred, such as the intellect; he has none, being free of every property of worldly existence. Knowing him from teacher and scripture, one is freed while still living from the knots of the heart, such as ignorance, and attains immortality when the body falls."],"by":null,"var":[],"x":false},{"n":"2.3.9","label":null,"d":"न संदृशे तिष्ठति रूपमस्य न चक्षुषा पश्यति कश्चनैनम् ।\nहृदा मनीषा मनसाभिकॢप्तो य एतद्विदुरमृतास्ते भवन्ति ॥ ९ ॥","i":"na saṃdṛśe tiṣṭhati rūpam asya na cakṣuṣā paśyati kaścanainam |\nhṛdā manīṣā manasābhikḷpto ya etad vidur amṛtās te bhavanti || 9 ||","pd":"न संदृशे तिष्ठति रूपम् अस्य न चक्षुषा पश्यति कश्चन एनम् हृदा मनीषा मनसा अभिकॢप्तः ये एतत् विदुः अमृताः ते भवन्ति","pi":"na saṃdṛśe tiṣṭhati rūpam asya na cakṣuṣā paśyati kaścana enam hṛdā manīṣā manasā abhikḷptaḥ ye etat viduḥ amṛtāḥ te bhavanti","w":[["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["संदृशे","saṃdṛśe","within sight","संदृश्","saṃdṛś","सप्तमी, स्त्री, एक","saptamī, strī, eka","f. loc. sg.",["sandṛś"]],["तिष्ठति","tiṣṭhati","stands","स्था","sthā","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["sthā"]],["रूपम्","rūpam","the form","रूप","rūpa","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["rūpa"]],["अस्य","asya","of him","इदम्","idam","सर्वनाम, षष्ठी, पुं, एक","sarvanāma, ṣaṣṭhī, puṃ, eka","pronoun m. gen. sg.",["idam"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["चक्षुषा","cakṣuṣā","with the eye","चक्षुस्","cakṣus","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["cakṣus"]],["पश्यति","paśyati","sees","दृश्","dṛś","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["dṛś"]],["कश्चन","kaścana","anyone","कश्चन","kaścana","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["kaścana"]],["एनम्","enam","him","एनद्","enad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",[]],["हृदा","hṛdā","by the heart","हृद्","hṛd","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["hṛd"]],["मनीषा","manīṣā","by the ruler of the mind","मनीष्","manīṣ","तृतीया, स्त्री, एक","tṛtīyā, strī, eka","f. ins. sg.",[]],["मनसा","manasā","by reflection","मनस्","manas","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["manas"]],["अभिकॢप्तः","abhikḷptaḥ","is revealed","अभि-कॢप्","abhi-kḷp","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg.",["abhikḷp"]],["ये","ye","who","यद्","yad","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["yad"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["etad"]],["विदुः","viduḥ","know","विद्","vid","लिट्, प्रथम, बहु","liṭ, prathama, bahu","perfect 3rd pl.",["vid"]],["अमृताः","amṛtāḥ","immortal","अमृत","amṛta","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["amṛta"]],["ते","te","they","तद्","tad","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["tad"]],["भवन्ति","bhavanti","become","भू","bhū","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["bhū"]]],"t":"“His form does not stand within sight; no one sees him with the eye. He is revealed by the intellect that dwells in the heart and rules the mind, through reflection. Those who know this become immortal.”","notes":["Śaṅkara: the eye stands for all the senses. hṛdā: by the intellect seated in the heart. manīṣā is taken as the instrumental of manīṣ, ‘that which rules (īṣṭe) the mind’, again the intellect, free of wavering. manasā: by right seeing in the form of reflection. abhikḷpta: made clear; ‘the Self can be known’ is to be supplied.","The DCS data has a damaged character where ḷ should stand in abhikḷpto; it is corrected here."],"by":null,"var":[],"x":false},{"n":"2.3.10","label":null,"d":"यदा पञ्चावतिष्ठन्ते ज्ञानानि मनसा सह ।\nबुद्धिश्च न विचेष्टति तामाहुः परमां गतिम् ॥ १० ॥","i":"yadā pañcāvatiṣṭhante jñānāni manasā saha |\nbuddhiś ca na viceṣṭati tām āhuḥ paramāṃ gatim || 10 ||","pd":"यदा पञ्च अवतिष्ठन्ते ज्ञानानि मनसा सह बुद्धिः च न विचेष्टति ताम् आहुः परमाम् गतिम्","pi":"yadā pañca avatiṣṭhante jñānāni manasā saha buddhiḥ ca na viceṣṭati tām āhuḥ paramām gatim","w":[["यदा","yadā","when","यदा","yadā","अव्यय","avyaya","indeclinable",["yadā"]],["पञ्च","pañca","the five","पञ्चन्","pañcan","प्रथमा, नपुं, बहु","prathamā, napuṃ, bahu","n. nom. pl.",["pañcan"]],["अवतिष्ठन्ते","avatiṣṭhante","stand still","अव-स्था","ava-sthā","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["avasthā"]],["ज्ञानानि","jñānāni","organs of knowledge","ज्ञान","jñāna","प्रथमा, नपुं, बहु","prathamā, napuṃ, bahu","n. nom. pl.",["jñāna"]],["मनसा","manasā","the mind","मनस्","manas","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["manas"]],["सह","saha","together with","सह","saha","अव्यय","avyaya","indeclinable",["saha"]],["बुद्धिः","buddhiḥ","the intellect","बुद्धि","buddhi","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg.",["buddhi"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["विचेष्टति","viceṣṭati","stirs","वि-चेष्ट्","vi-ceṣṭ","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["viceṣṭ"]],["ताम्","tām","that","तद्","tad","सर्वनाम, द्वितीया, स्त्री, एक","sarvanāma, dvitīyā, strī, eka","pronoun f. acc. sg.",["tad"]],["आहुः","āhuḥ","they call","अह्","ah","लिट्, प्रथम, बहु","liṭ, prathama, bahu","perfect 3rd pl.",["ah"]],["परमाम्","paramām","the highest","परम","parama","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["parama"]],["गतिम्","gatim","state","गति","gati","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["gati"]]],"t":"“When the five senses of knowledge, together with the mind, stand still, and the intellect does not stir, that, they say, is the highest state.”","notes":["Śaṅkara: this teaches the yoga by which that intellect is gained. The senses are called ‘knowledges’ because they serve knowledge; they are withdrawn from their objects and rest in the Self, together with the mind turned back from intention and the like."],"by":null,"var":[],"x":false},{"n":"2.3.11","label":null,"d":"तां योगमिति मन्यन्ते स्थिरामिन्द्रियधारणाम् ।\nअप्रमत्तस्तदा भवति योगो हि प्रभवाप्ययौ ॥ ११ ॥","i":"tāṃ yogam iti manyante sthirām indriyadhāraṇām |\napramattas tadā bhavati yogo hi prabhavāpyayau || 11 ||","pd":"ताम् योगम् इति मन्यन्ते स्थिराम् इन्द्रिय-धारणाम् अप्रमत्तः तदा भवति योगः हि प्रभव-अप्ययौ","pi":"tām yogam iti manyante sthirām indriya-dhāraṇām apramattaḥ tadā bhavati yogaḥ hi prabhava-apyayau","w":[["ताम्","tām","that","तद्","tad","सर्वनाम, द्वितीया, स्त्री, एक","sarvanāma, dvitīyā, strī, eka","pronoun f. acc. sg.",["tad"]],["योगम्","yogam","yoga","योग","yoga","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["yoga"]],["इति","iti","as","इति","iti","अव्यय","avyaya","indeclinable",["iti"]],["मन्यन्ते","manyante","they regard","मन्","man","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["man"]],["स्थिराम्","sthirām","steady","स्थिर","sthira","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["sthira"]],["इन्द्रिय-धारणाम्","indriya-dhāraṇām","holding of the senses","इन्द्रियधारणा","indriyadhāraṇā","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["indriya","dhāraṇā"]],["अप्रमत्तः","apramattaḥ","vigilant","अप्रमत्त","apramatta","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["apramatta"]],["तदा","tadā","then","तदा","tadā","अव्यय","avyaya","indeclinable",["tadā"]],["भवति","bhavati","one becomes","भू","bhū","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["bhū"]],["योगः","yogaḥ","yoga","योग","yoga","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["yoga"]],["हि","hi","for","हि","hi","अव्यय","avyaya","indeclinable",["hi"]],["प्रभव-अप्ययौ","prabhava-apyayau","arising and passing away","प्रभवाप्यय","prabhavāpyaya","प्रथमा, पुं, द्वि","prathamā, puṃ, dvi","m. nom. du.",["prabhava","apyaya"]]],"t":"“That steady holding of the senses they regard as yoga. One must then be vigilant, for yoga comes and goes.”","notes":["Śaṅkara: though called yoga, ‘union’, this state is really disunion, a separation from contact with every evil; in it the Self stands in its own nature, free of what ignorance lays upon it. Vigilance is enjoined from the time one begins yoga, for yoga is subject to arising and passing away."],"by":null,"var":[],"x":false},{"n":"2.3.12","label":null,"d":"नैव वाचा न मनसा प्राप्तुं शक्यो न चक्षुषा ।\nअस्तीति ब्रुवतोऽन्यत्र कथं तदुपलभ्यते ॥ १२ ॥","i":"naiva vācā na manasā prāptuṃ śakyo na cakṣuṣā |\nastīti bruvato 'nyatra kathaṃ tad upalabhyate || 12 ||","pd":"न एव वाचा न मनसा प्राप्तुम् शक्यः न चक्षुषा अस्ति इति ब्रुवतः अन्यत्र कथम् तत् उपलभ्यते","pi":"na eva vācā na manasā prāptum śakyaḥ na cakṣuṣā asti iti bruvataḥ anyatra katham tat upalabhyate","w":[["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["एव","eva","indeed","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["वाचा","vācā","by speech","वाच्","vāc","तृतीया, स्त्री, एक","tṛtīyā, strī, eka","f. ins. sg.",["vāc"]],["न","na","nor","न","na","अव्यय","avyaya","indeclinable",["na"]],["मनसा","manasā","by the mind","मनस्","manas","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["manas"]],["प्राप्तुम्","prāptum","to be reached","प्र-आप्","pra-āp","तुमुन्","tumun","infinitive",["prāp"]],["शक्यः","śakyaḥ","possible","शक्","śak","कृत्य, प्रथमा, पुं, एक","kṛtya, prathamā, puṃ, eka","gerundive m. nom. sg.",["śak"]],["न","na","nor","न","na","अव्यय","avyaya","indeclinable",["na"]],["चक्षुषा","cakṣuṣā","by the eye","चक्षुस्","cakṣus","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["cakṣus"]],["अस्ति","asti","it is","अस्","as","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["as"]],["इति","iti","thus","इति","iti","अव्यय","avyaya","indeclinable",["iti"]],["ब्रुवतः","bruvataḥ","than one who says","ब्रू","brū","शतृ।शानच्, पञ्चमी, पुं, एक","śatṛ/śānac, pañcamī, puṃ, eka","present participle m. abl. sg.",["brū"]],["अन्यत्र","anyatra","in anyone other","अन्यत्र","anyatra","अव्यय","avyaya","indeclinable",["anyatra"]],["कथम्","katham","how","कथम्","katham","अव्यय","avyaya","indeclinable",["katham"]],["तत्","tat","that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]],["उपलभ्यते","upalabhyate","is perceived","उप-लभ्","upa-labh","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["upalabh"]]],"t":"“It cannot be reached by speech, nor by the mind, nor by the eye. How can it be perceived by anyone other than one who says ‘it is’?”","notes":["Śaṅkara: this meets the objection that what no organ grasps does not exist. Though free of every distinction, the Self certainly exists, being known as the root of the world: an effect traced back ends in being, as a pot is always found joined to clay. One who says ‘it is’ is the believer who follows scripture; the denier, for whom the world ends in nothing, cannot perceive Brahman at all."],"by":null,"var":[],"x":false},{"n":"2.3.13","label":null,"d":"अस्तीत्येवोपलब्धव्यस्तत्त्वभावेन चोभयोः ।\nअस्तीत्येवोपलब्धस्य तत्त्वभावः प्रसीदति ॥ १३ ॥","i":"astīty evopalabdhavyas tattvabhāvena cobhayoḥ |\nastīty evopalabdhasya tattvabhāvaḥ prasīdati || 13 ||","pd":"अस्ति इति एव उपलब्धव्यः तत्त्व-भावेन च उभयोः अस्ति इति एव उपलब्धस्य तत्त्व-भावः प्रसीदति","pi":"asti iti eva upalabdhavyaḥ tattva-bhāvena ca ubhayoḥ asti iti eva upalabdhasya tattva-bhāvaḥ prasīdati","w":[["अस्ति","asti","it is","अस्","as","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["as"]],["इति","iti","thus","इति","iti","अव्यय","avyaya","indeclinable",["iti"]],["एव","eva","indeed","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["उपलब्धव्यः","upalabdhavyaḥ","it is to be perceived","उप-लभ्","upa-labh","कृत्य, प्रथमा, पुं, एक","kṛtya, prathamā, puṃ, eka","gerundive m. nom. sg.",["upalabh"]],["तत्त्व-भावेन","tattva-bhāvena","in its true nature","तत्त्वभाव","tattvabhāva","तृतीया, पुं, एक","tṛtīyā, puṃ, eka","m. ins. sg.",["tattvabhāva"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["उभयोः","ubhayoḥ","of the two","उभय","ubhaya","षष्ठी, पुं, द्वि","ṣaṣṭhī, puṃ, dvi","m. gen. du.",["ubhaya"]],["अस्ति","asti","it is","अस्","as","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["as"]],["इति","iti","thus","इति","iti","अव्यय","avyaya","indeclinable",["iti"]],["एव","eva","indeed","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["उपलब्धस्य","upalabdhasya","to one who has perceived it","उप-लभ्","upa-labh","क्त, षष्ठी, पुं, एक","kta, ṣaṣṭhī, puṃ, eka","past passive participle m. gen. sg.",["upalabh"]],["तत्त्व-भावः","tattva-bhāvaḥ","its true nature","तत्त्वभाव","tattvabhāva","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["tattvabhāva"]],["प्रसीदति","prasīdati","becomes clear","प्र-सद्","pra-sad","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["prasad"]]],"t":"“It is to be perceived first as ‘it is’, and then in its true nature. Of these two, when it has been perceived as ‘it is’, its true nature becomes clear.”","notes":["Śaṅkara: first the Self is to be perceived as existing, through its adjuncts, the intellect and other effects that are real. Its true nature is the Self without adjuncts, beyond the ideas of being and non-being, described as ‘not this, not this’. ubhayoḥ is a genitive of selection, ‘of these two’. The true nature turns towards one who has first perceived the Self as existing."],"by":null,"var":[],"x":false},{"n":"2.3.14","label":null,"d":"यदा सर्वे प्रमुच्यन्ते कामा येऽस्य हृदि श्रिताः ।\nअथ मर्त्योऽमृतो भवत्यत्र ब्रह्म समश्नुते ॥ १४ ॥","i":"yadā sarve pramucyante kāmā ye 'sya hṛdi śritāḥ |\natha martyo 'mṛto bhavaty atra brahma samaśnute || 14 ||","pd":"यदा सर्वे प्रमुच्यन्ते कामाः ये अस्य हृदि श्रिताः अथ मर्त्यः अमृतः भवति अत्र ब्रह्म समश्नुते","pi":"yadā sarve pramucyante kāmāḥ ye asya hṛdi śritāḥ atha martyaḥ amṛtaḥ bhavati atra brahma samaśnute","w":[["यदा","yadā","when","यदा","yadā","अव्यय","avyaya","indeclinable",["yadā"]],["सर्वे","sarve","all","सर्व","sarva","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["sarva"]],["प्रमुच्यन्ते","pramucyante","fall away","प्र-मुच्","pra-muc","लट्, प्रथम, बहु, कर्मणि","laṭ, prathama, bahu, karmaṇi","present 3rd pl. passive",["pramuc"]],["कामाः","kāmāḥ","the desires","काम","kāma","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["kāma"]],["ये","ye","which","यद्","yad","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["yad"]],["अस्य","asya","his","इदम्","idam","सर्वनाम, षष्ठी, पुं, एक","sarvanāma, ṣaṣṭhī, puṃ, eka","pronoun m. gen. sg.",["idam"]],["हृदि","hṛdi","in the heart","हृद्","hṛd","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg.",["hṛd"]],["श्रिताः","śritāḥ","lodged","श्रि","śri","क्त, प्रथमा, पुं, बहु","kta, prathamā, puṃ, bahu","past passive participle m. nom. pl.",["śri"]],["अथ","atha","then","अथ","atha","अव्यय","avyaya","indeclinable",["atha"]],["मर्त्यः","martyaḥ","the mortal","मर्त्य","martya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["martya"]],["अमृतः","amṛtaḥ","immortal","अमृत","amṛta","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["amṛta"]],["भवति","bhavati","becomes","भू","bhū","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["bhū"]],["अत्र","atra","here","अत्र","atra","अव्यय","avyaya","indeclinable",["atra"]],["ब्रह्म","brahma","Brahman","ब्रह्मन्","brahman","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["brahman"]],["समश्नुते","samaśnute","he attains","सम्-अश्","sam-aś","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["samaś"]]],"t":"“When all the desires lodged in his heart fall away, then the mortal becomes immortal; here he attains Brahman.”","notes":["Śaṅkara: for one who sees the true Self there is nothing else left to desire. The heart is the intellect, which, and not the Self, is the seat of desires. With death in the form of ignorance, desire and action destroyed, there is no going anywhere: here itself, like a lamp gone out, every bond is stilled and he becomes Brahman."],"by":null,"var":[],"x":false},{"n":"2.3.15","label":null,"d":"यदा सर्वे प्रभिद्यन्ते हृदयस्येह ग्रन्थयः ।\nअथ मर्त्योऽमृतो भवत्येतावद्ध्यनुशासनम् ॥ १५ ॥","i":"yadā sarve prabhidyante hṛdayasyeha granthayaḥ |\natha martyo 'mṛto bhavaty etāvaddhyanuśāsanam || 15 ||","pd":"यदा सर्वे प्रभिद्यन्ते हृदयस्य इह ग्रन्थयः अथ मर्त्यः अमृतः भवति एतावत् हि अनुशासनम्","pi":"yadā sarve prabhidyante hṛdayasya iha granthayaḥ atha martyaḥ amṛtaḥ bhavati etāvat hi anuśāsanam","w":[["यदा","yadā","when","यदा","yadā","अव्यय","avyaya","indeclinable",["yadā"]],["सर्वे","sarve","all","सर्व","sarva","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["sarva"]],["प्रभिद्यन्ते","prabhidyante","are cut through","प्र-भिद्","pra-bhid","लट्, प्रथम, बहु, कर्मणि","laṭ, prathama, bahu, karmaṇi","present 3rd pl. passive",["prabhid"]],["हृदयस्य","hṛdayasya","of the heart","हृदय","hṛdaya","षष्ठी, नपुं, एक","ṣaṣṭhī, napuṃ, eka","n. gen. sg.",["hṛdaya"]],["इह","iha","here","इह","iha","अव्यय","avyaya","indeclinable",["iha"]],["ग्रन्थयः","granthayaḥ","the knots","ग्रन्थि","granthi","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["granthi"]],["अथ","atha","then","अथ","atha","अव्यय","avyaya","indeclinable",["atha"]],["मर्त्यः","martyaḥ","the mortal","मर्त्य","martya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["martya"]],["अमृतः","amṛtaḥ","immortal","अमृत","amṛta","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["amṛta"]],["भवति","bhavati","becomes","भू","bhū","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["bhū"]],["एतावत्","etāvat","this much","एतावत्","etāvat","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["etāvat"]],["हि","hi","indeed","हि","hi","अव्यय","avyaya","indeclinable",["hi"]],["अनुशासनम्","anuśāsanam","the teaching","अनुशासन","anuśāsana","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["anuśāsana"]]],"t":"“When all the knots of the heart are cut through here, then the mortal becomes immortal. This much alone is the teaching.”","notes":["Śaṅkara: the knots are the notions born of ignorance that bind fast, such as ‘I am this body’, ‘this wealth is mine’, ‘I am happy, I am unhappy’. They are destroyed, while one still lives, by the opposite knowledge, ‘I am Brahman and am not bound to birth and death’; the desires that spring from them then perish at the root. ‘This much’: this and no more is the teaching of all the Upaniṣads."],"by":null,"var":[],"x":false},{"n":"2.3.16","label":null,"d":"शतं चैका च हृदयस्य नाड्यस्तासां मूर्धानमभिनिःसृतैका ।\nतयोर्ध्वमायन्नमृतत्वमेति विष्वङ्ङन्या उत्क्रमणे भवति ॥ १६ ॥","i":"śataṃ caikā ca hṛdayasya nāḍyas tāsāṃ mūrdhānam abhiniḥsṛtaikā |\ntayordhvam āyann amṛtatvam eti viṣvaṅṅ anyā utkramaṇe bhavati || 16 ||","pd":"शतम् च एका च हृदयस्य नाड्यः तासाम् मूर्धानम् अभिनिःसृता एका तया ऊर्ध्वम् आयन् अमृत-त्वम् एति विष्वङ् अन्याः उत्क्रमणे भवति","pi":"śatam ca ekā ca hṛdayasya nāḍyaḥ tāsām mūrdhānam abhiniḥsṛtā ekā tayā ūrdhvam āyan amṛta-tvam eti viṣvaṅ anyāḥ utkramaṇe bhavati","w":[["शतम्","śatam","a hundred","शत","śata","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["śata"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["एका","ekā","one","एक","eka","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg.",["eka"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["हृदयस्य","hṛdayasya","of the heart","हृदय","hṛdaya","षष्ठी, नपुं, एक","ṣaṣṭhī, napuṃ, eka","n. gen. sg.",["hṛdaya"]],["नाड्यः","nāḍyaḥ","channels","नाडी","nāḍī","प्रथमा, स्त्री, बहु","prathamā, strī, bahu","f. nom. pl.",["nāḍī"]],["तासाम्","tāsām","of them","तद्","tad","सर्वनाम, षष्ठी, स्त्री, बहु","sarvanāma, ṣaṣṭhī, strī, bahu","pronoun f. gen. pl.",["tad"]],["मूर्धानम्","mūrdhānam","to the crown of the head","मूर्धन्","mūrdhan","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["mūrdhan"]],["अभिनिःसृता","abhiniḥsṛtā","goes out","अभि-निस्-सृ","abhi-nis-sṛ","क्त, प्रथमा, स्त्री, एक","kta, prathamā, strī, eka","past passive participle f. nom. sg.",["abhiniḥsṛ"]],["एका","ekā","one","एक","eka","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg.",["eka"]],["तया","tayā","by it","तद्","tad","सर्वनाम, तृतीया, स्त्री, एक","sarvanāma, tṛtīyā, strī, eka","pronoun f. ins. sg.",["tad"]],["ऊर्ध्वम्","ūrdhvam","upward","ऊर्ध्वम्","ūrdhvam","अव्यय","avyaya","indeclinable",["ūrdhvam"]],["आयन्","āyan","going","आ-इ","ā-i","शतृ।शानच्, प्रथमा, पुं, एक","śatṛ/śānac, prathamā, puṃ, eka","present participle m. nom. sg.",["e"]],["अमृत-त्वम्","amṛta-tvam","immortality","अमृतत्व","amṛtatva","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["amṛtatva"]],["एति","eti","one reaches","इ","i","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["i"]],["विष्वङ्","viṣvaṅ","in every direction","विष्वञ्च्","viṣvañc","अव्यय","avyaya","indeclinable",["viṣvañc"]],["अन्याः","anyāḥ","the others","अन्य","anya","सर्वनाम, प्रथमा, स्त्री, बहु","sarvanāma, prathamā, strī, bahu","pronoun f. nom. pl.",["anya"]],["उत्क्रमणे","utkramaṇe","for departing","उत्क्रमण","utkramaṇa","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg.",["utkramaṇa"]],["भवति","bhavati","serve","भू","bhū","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["bhū"]]],"t":"“There are a hundred and one channels of the heart. One of them goes out to the crown of the head; going upward by it, one reaches immortality. The others, leading in every direction, serve for departing.”","notes":["Śaṅkara: for the knower who has become Brahman in this life there is no going at all. This verse is about those who know Brahman less perfectly, or follow other meditations, and go to the world of Brahmā; and it tells the fruit of the fire-teaching asked for earlier. The one channel is the suṣumnā. The immortality reached by it is relative, lasting to the dissolution of the elements, or it is the final immortality gained in time together with Brahmā. The other channels lead back to birth and death.","The text reads bhavati, a singular; Śaṅkara glosses it with the plural bhavanti, which the sense requires with anyāḥ."],"by":null,"var":[],"x":false},{"n":"2.3.17","label":null,"d":"अङ्गुष्ठमात्रः पुरुषोऽन्तरात्मा सदा जनानां हृदये संनिविष्टः ।\nतं स्वाच्छरीरात्प्रवृहेन्मुञ्जादिवेषीकां धैर्येण ।\nतं विद्याच्छुक्रममृतं तं विद्याच्छुक्रममृतमिति ॥ १७ ॥","i":"aṅguṣṭhamātraḥ puruṣo 'ntarātmā sadā janānāṃ hṛdaye saṃniviṣṭaḥ |\ntaṃ svāccharīrāt pravṛhen muñjād iveṣīkāṃ dhairyeṇa |\ntaṃ vidyācchukram amṛtaṃ taṃ vidyācchukram amṛtam iti || 17 ||","pd":"अङ्गुष्ठ-मात्रः पुरुषः अन्तरात्मा सदा जनानाम् हृदये संनिविष्टः तम् स्वात् शरीरात् प्रवृहेत् मुञ्जात् इव इषीकाम् धैर्येण तम् विद्यात् शुक्रम् अमृतम् तम् विद्यात् शुक्रम् अमृतम् इति","pi":"aṅguṣṭha-mātraḥ puruṣaḥ antarātmā sadā janānām hṛdaye saṃniviṣṭaḥ tam proktām naciketaḥ atha labdhvā vidyām etām yoga-vidhim ca kṛtsnam brahma-prāptaḥ virajaḥ abhūt vimṛtyuḥ anyaḥ api evam yaḥ vit adhyātmam eva","w":[["मृत्यु-प्रोक्ताम्","mṛtyu-proktām","taught by Death","मृत्युप्रोक्त","mṛtyuprokta","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["mṛtyu","prokta"]],["नचिकेतः","naciketaḥ","Naciketas","नचिकेतस्","naciketas","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["naciketas"]],["अथ","atha","then","अथ","atha","अव्यय","avyaya","indeclinable",["atha"]],["लब्ध्वा","labdhvā","having received","लभ्","labh","क्त्वा","ktvā","absolutive",["labh"]],["विद्याम्","vidyām","knowledge","विद्या","vidyā","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["vidyā"]],["एताम्","etām","this","एतद्","etad","सर्वनाम, द्वितीया, स्त्री, एक","sarvanāma, dvitīyā, strī, eka","pronoun f. acc. sg.",["etad"]],["योग-विधिम्","yoga-vidhim","the method of yoga","योगविधि","yogavidhi","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["yoga","vidhi"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["कृत्स्नम्","kṛtsnam","the whole","कृत्स्न","kṛtsna","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["kṛtsna"]],["ब्रह्म-प्राप्तः","brahma-prāptaḥ","having attained Brahman","ब्रह्मप्राप्त","brahmaprāpta","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["brahmaprāpta"]],["विरजः","virajaḥ","free from stain","विरज","viraja","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["viraja"]],["अभूत्","abhūt","became","भू","bhū","लुङ्, प्रथम, एक","luṅ, prathama, eka","aorist 3rd sg.",["bhū"]],["विमृत्युः","vimṛtyuḥ","free from death","विमृत्यु","vimṛtyu","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vimṛtyu"]],["अन्यः","anyaḥ","another","अन्य","anya","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["anya"]],["अपि","api","too","अपि","api","अव्यय","avyaya","indeclinable",["api"]],["एवम्","evam","thus","एवम्","evam","अव्यय","avyaya","indeclinable",["evam"]],["यः","yaḥ","who","यद्", aya","indeclinable",["saha"]],["नौ","nau","us two","अस्मद्","asmad","सर्वनाम, द्वितीया, द्वि","sarvanāma, dvitīyā, dvi","pronoun acc. du.",["asmad"]],["भुनक्तु","bhunaktu","may He nourish","भुज्","bhuj","लोट्, प्रथम, एक","loṭ, prathama, eka","imperative 3rd sg.",["bhuj"]],["सह","saha","together","सह","saha","अव्यय","avyaya","indeclinable",["saha"]],["वीर्यम्","vīryam","vigour, effort","वीर्य","vīrya","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["vīrya"]],["करवावहै","karavāvahai","may we two put forth","कृ","kṛ","लोट्, उत्तम, द्वि","loṭ, uttama, dvi","imperative 1st du.",["kṛ"]],["तेजस्वि","tejasvi","full of light","तेजस्विन्","tejasvin","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["tejasvin"]],["नौ","nau","of us two","अस्मद्","asmad","सर्वनाम, षष्ठी, द्वि","sarvanāma, ṣaṣṭhī, dvi","pronoun gen. du.",["asmad"]],["अधीतम्","adhītam","what has been studied","अधि-इ","adhi-i","क्त, प्रथमा, नपुं, एक","kta, prathamā, napuṃ, eka","past passive participle n. nom. sg.",["adhī"]],["अस्तु","astu","may it be","अस्","as","लोट्, प्रथम, एक","loṭ, prathama, eka","imperative 3rd sg.",["as"]],["मा","mā","not","मा","mā","अव्यय","avyaya","indeclinable",["mā"]],["विद्विषावहै","vidviṣāvahai","may we two bear ill will","वि-द्विष्","vi-dviṣ","लोट्, उत्तम, द्वि","loṭ, uttama, dvi","imperative 1st du.",["vidviṣ"]],["ॐ","oṃ","Om","ॐ","om","अव्यय","avyaya","indeclinable",["om"]],["शान्तिः","śāntiḥ","peace","शान्ति","śānti","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg.",["śānti"]],["शान्तिः","śāntiḥ","peace","शान्ति","śānti","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg.",["śānti"]],["शान्तिः","śāntiḥ","peace","शान्ति","śānti","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg.",["śānti"]]],"t":"Om. May He protect us both together. May He nourish us both together. May we work together with vigour. May what we study be full of light. May we never bear ill will towards each other. Om. Peace, peace, peace.","notes":["The peace invocation of teacher and <script>
(function(){
  var D = JSON.parse(document.getElementById("data").textContent);
  var KEY = "vs-grantha-reader";
  var defaults = {iast:true, pd:false, wbw:false, lg:true, script:"deva"};
  var prefs = Object.assign({}, defaults);
  try { var s = JSON.parse(localStorage.getItem(KEY) || "{}"); Object.assign(prefs, s); } catch(e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch(e) {} }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function el(id){ return document.getElementById(id); }

  el("t-deva").textContent = D.title.deva;
  el("t-iast").textContent = D.title.iast;
  el("t-en").textContent = D.title.en !== D.title.iast ? D.title.en : "";
  el("t-author").textContent = D.author;
  el("about").textContent = (D.about || []).join(" ");
  document.title = D.title.iast + " · Vedic Space";

  var LEX = D.lex || {};          // entries inside the page (self-contained copy) …
  var LEXF = D.lexf || {};        // … or headword → shared file under lex/, fetched on click
  var HAS_LEX = Object.keys(LEX).length > 0 || Object.keys(LEXF).length > 0;
  var chunks = {};                // file name → promise, so each file is fetched once
  function loadHeads(heads){
    var names = [];
    heads.forEach(function(k){ if (!LEX[k] && LEXF[k] && names.indexOf(LEXF[k]) < 0) names.push(LEXF[k]); });
    return Promise.all(names.map(function(n){
      if (!chunks[n]) chunks[n] = fetch("lex/" + n + ".json").then(function(r){
        if (!r.ok) throw new Error(r.status); return r.json();
      }).then(function(data){ Object.keys(data).forEach(function(k){ LEX[k] = data[k]; }); })
        .catch(function(e){ delete chunks[n]; throw e; });
      return chunks[n];
    }));
  }

  var sections = {};
  (D.sections || []).forEach(function(s){ sections[s.before] = s; });

  var html = [];
  D.verses.forEach(function(v){
    var s = sections[v.n];
    if (s) html.push('<div class="section"' + (s.short ? ' data-short="' + esc(s.short) + '"' : '') + '><div class="sd">' + esc(s.deva) + '</div><div class="si">' +
                     esc(s.iast) + ' · ' + esc(s.en) + '</div></div>');
    var tags = [];
    if (v.by) tags.push('<span class="tag">attributed to ' + esc(v.by) + '</span>');
    if (v.x) tags.push('<span class="tag">in some editions</span>');
    if (v.label) tags.push('<span class="tag">' + esc(v.label) + '</span>');     // unnumbered: śānti mantra
    else if (/[a-z]$/.test(v.n)) tags.push('<span class="tag">colophon</span>');
    var wi = 0;
    var words = v.w.map(function(w){
      var g = w[5] || w[6] ? '<div class="wg"><span class="gd">' + esc(w[3]) + ' · ' + esc(w[5]) + '</span>' +
              '<span class="gi">' + esc(w[4]) + ' · ' + esc(w[6]) + '</span>' +
              (w[7] ? '<br>' + esc(w[7]) : '') + '</div>' : '';
      var dict = HAS_LEX ? ' has-dict" tabindex="0" role="button" data-w="' + esc(v.n) + ':' + (wi++) : '';
      return '<div class="w' + dict + '"><div class="wd">' + esc(w[0]) + '</div><div class="wi">' + esc(w[1]) + '</div>' +
             '<div class="wm">' + esc(w[2]) + '</div>' + g + '</div>';
    }).join("");
    var notes = [];
    v.var.forEach(function(r){ notes.push('<p><b>Variant</b> ' + esc(r) + '</p>'); });
    v.notes.forEach(function(n){ notes.push('<p><b>Note</b> ' + esc(n) + '</p>'); });
    html.push(
      '<article class="verse" id="v' + esc(v.n) + '"' + (v.label ? ' data-label="' + esc(v.label) + '"' : '') + '>' +
        '<div class="vhead">' + tags.join("") + '</div>' +
        '<div class="sa">' + esc(v.d) + '</div>' +
        '<div class="iast">' + esc(v.i) + '</div>' +
        '<div class="blk pd"><div class="lbl"><span>Padaccheda</span></div>' +
          '<div class="pd-d">' + esc(v.pd) + '</div><div class="pd-i">' + esc(v.pi) + '</div></div>' +
        '<div class="blk wbw"><div class="lbl"><span>Word by word</span><span class="ctl">' +
          '<button class="sw mini" data-pref="lg" aria-pressed="false"><span class="k"></span>Lemma &amp; grammar</button>' +
          '<span class="seg" role="group" aria-label="Script for lemma and grammar">' +
            '<button class="dv" data-script="deva" aria-pressed="false">देव</button>' +
            '<button data-script="iast" aria-pressed="false">IAST</button></span>' +
        '</span></div><div class="words">' + words + '</div></div>' +
        (v.t ? '<div class="tr">' + esc(v.t) + '</div>' : '') +
        (notes.length ? '<div class="notes">' + notes.join("") + '</div>' : '') +
      '</article>');
  });
  el("verses").innerHTML = html.join("");

  // Gratitude panel: written for sanskritdocuments.org texts. D.src_base is that text's address there
  // (without .itx); D.thanks is [[name, what they did], …]. Without src_base the panel and its links hide.
  var SD = "https://sanskritdocuments.org/", SDP = D.src_base || "";
  if (!SDP) document.body.classList.add("no-thanks");
  var THANKS = (D.thanks || []).map(function(t){
    return '<span class="cr-names">' + esc(t[0]) + '</span>' + esc(t[1]); }).join(', and ') ||
    'the volunteers who encoded and proofread this text';
  var NAMASTE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8c-2 1.5-3.4 4.4-3.4 7.4v3.5L5.2 17l3.6 3.4L12 17.2M12 2.8c2 1.5 3.4 4.4 3.4 7.4v3.5l3.4 3.3-3.6 3.4-3.2-3.2M12 2.8v14.4M3.6 18.6l3.6 3.4M20.4 18.6 16.8 22"/></svg>';
  var CORNER = '<svg viewBox="0 0 22 22" aria-hidden="true"><path d="M1 21V7a6 6 0 0 1 6-6h14M5 16V9a4 4 0 0 1 4-4h7"/><circle cx="9" cy="9" r="1.3" fill="currentColor" stroke="none"/></svg>';
  el("credits").innerHTML = (!SDP ? '' :
    '<section class="cr-frame" aria-labelledby="cr-title">' +
    ['tl','tr','bl','br'].map(function(c){ return '<span class="cr-corner ' + c + '">' + CORNER + '</span>'; }).join('') +
    '<span class="cr-medal">' + NAMASTE + '</span>' +
    '<div class="cr-head"><div class="cr-inv" lang="sa">॥ श्रीगुरुभ्यो नमः ॥</div>' +
      '<div class="cr-k">Citations</div><h2 id="cr-title">Built on Pioneering Shoulders</h2></div>' +
    '<div class="cr-orn" aria-hidden="true"><i></i></div>' +
    '<div class="cr-thanks">' +
      '<p>The Sanskrit text on this page comes from <a href="' + SD + '" target="_blank" rel="noopener">sanskritdocuments.org</a>, ' +
        'where, for decades, volunteers have quietly typed, encoded and proofread thousands of stotras and ' +
        'scriptures and offered them freely to the world. Pages like this one would not be possible without that herculean, ' +
        'unpaid labour of love.</p>' +
      '<p>With folded hands we thank ' + THANKS + ', along with each ' +
        'and every volunteer who contributed to the sanskritdocuments.org community, like the rishis of the lore. 🙏</p>' +
      '<ul class="cr-links">' +
        '<li><a href="' + SDP + '.html" target="_blank" rel="noopener">Source page: ' + esc(D.title.iast) + '</a></li>' +
        '<li><a href="' + SDP + '.pdf" target="_blank" rel="noopener">Devanagari PDF</a></li>' +
        '<li><a href="' + SDP + '.itx" target="_blank" rel="noopener">ITX source</a></li>' +
        '<li><a href="' + SD + 'contrib_list/" target="_blank" rel="noopener">Contributors</a></li>' +
        '<li><a href="' + SD + 'doc_projects/volunteering.php" target="_blank" rel="noopener">Volunteer with them</a></li>' +
      '</ul>' +
    '</div>' +
    '</section>') +
    '<div class="cr-list">' +
    '<p><b>Sanskrit text:</b> ' + (SDP ? '<a href="' + SDP + '.html" target="_blank" rel="noopener">' + esc(D.source) + '</a>' : esc(D.source)) + ' (' + esc(D.source_ref) + '). ' + esc(D.credits) + '.</p>' +
    (D.credit_lines || []).map(function(c){ return '<p><b>' + esc(c[0]) + ':</b> ' + esc(c[1]) + '</p>'; }).join('') +
    '<p><b>Word analysis, meanings and translation:</b> Vedic Space, draft prepared with Claude; awaiting review.</p>' +
    '<p><b>Fonts:</b> Tiro Devanagari Sanskrit, Noto Serif Devanagari and Noto Serif (SIL Open Font License).</p>' +
    (HAS_LEX ? '<p><b>Dictionary entries</b> (shown when a word is clicked): Monier-Williams, <i>A Sanskrit-English ' +
      'Dictionary</i>, 1899, and V. S. Apte, <i>The Practical Sanskrit-English Dictionary</i>, 1890; Cologne Digital ' +
      'Sanskrit Dictionaries, © 2014 The Sanskrit Library and Thomas Malten, CC BY-NC-SA 3.0.</p>' : '') +
    '</div>';

  // ---- dictionary pop-up: click a word in the word-by-word section
  var back = el("dict-back"), lastFocus = null, showing = null;
  function openDict(card){
    var ref = card.dataset.w.split(":"), verse = null;
    D.verses.forEach(function(v){ if (v.n === ref[0]) verse = v; });
    var w = verse.w[+ref[1]], heads = w[8] || [];
    el("dict-w").textContent = w[0];
    el("dict-i").textContent = w[1] + (w[4] && w[4] !== w[1] ? "  ·  " + w[4] : "");
    el("dict-m").textContent = w[2];
    el("dict-body").innerHTML = '<p class="none">Loading…</p>';
    el("dict-body").scrollTop = 0;
    lastFocus = card;
    showing = card;
    back.classList.add("open");
    el("dict-x").focus();
    loadHeads(heads).then(function(){ if (showing === card) fill(heads); }, function(){
      if (showing === card) el("dict-body").innerHTML = '<p class="none">The dictionary could not be loaded. ' +
        (location.protocol === "file:" ? 'Pop-ups need the page to be opened from the website, not from a folder.'
                                       : 'Please check the connection and click the word again.') + '</p>';
    });
  }
  function fill(heads){
    var out = [];
    if (!heads.length) out.push('<p class="none">No entry in Monier-Williams or Apte for this form.</p>');
    heads.forEach(function(k){
      var e = LEX[k]; if (!e) return;
      out.push('<h3>' + esc(e.d) + '<i>' + esc(k) + '</i></h3>');
      out.push('<h4>Monier-Williams</h4>');
      if (e.m.length) e.m.forEach(function(r){
        out.push('<p>' + (r[0] ? '<span class="lx">' + esc(r[0]) + '</span>' : '') + esc(r[1]) + '</p>'); });
      else out.push('<p class="none">No entry.</p>');
      out.push('<h4>Apte</h4>');
      if (e.a.length) e.a.forEach(function(t){ out.push('<p>' + esc(t) + '</p>'); });
      else out.push('<p class="none">No entry.</p>');
      if (e.more) out.push('<p class="more">Long entry, shortened here.</p>');
    });
    el("dict-body").innerHTML = out.join("");
    el("dict-body").scrollTop = 0;
  }
  function closeDict(){
    if (!back.classList.contains("open")) return;
    back.classList.remove("open");
    showing = null;
    if (lastFocus) lastFocus.focus();
  }
  back.addEventListener("click", function(e){ if (e.target === back || e.target.closest("#dict-x")) closeDict(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") closeDict();
    else if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("has-dict")) {
      e.preventDefault(); openDict(e.target); }
  });
  el("verses").addEventListener("click", function(e){
    var card = e.target.closest(".w.has-dict");
    if (card && !window.getSelection().toString()) openDict(card);
  });

  function apply(){
    document.body.classList.toggle("show-iast", !!prefs.iast);
    document.body.classList.toggle("show-pd", !!prefs.pd);
    document.body.classList.toggle("show-wbw", !!prefs.wbw);
    document.body.classList.toggle("show-lg", !!prefs.lg);
    document.body.classList.toggle("lg-iast", prefs.script === "iast");
    document.querySelectorAll("[data-pref]").forEach(function(b){
      b.setAttribute("aria-pressed", prefs[b.dataset.pref] ? "true" : "false"); });
    document.querySelectorAll("[data-script]").forEach(function(b){
      b.setAttribute("aria-pressed", prefs.script === b.dataset.script ? "true" : "false");
      b.closest(".seg").style.opacity = prefs.lg ? "1" : ".4"; });
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-pref]");
    if (b) { prefs[b.dataset.pref] = !prefs[b.dataset.pref]; save(); apply(); return; }
    var s = e.target.closest("[data-script]");
    if (s) { prefs.script = s.dataset.script; if (!prefs.lg) prefs.lg = true; save(); apply(); }
  });
  apply();
})();
</script>
<nav class="focus-nav" aria-label="Verse navigation">
  <button class="fn-btn" id="fn-prev" type="button" aria-label="Previous verse">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11.5 5.5 5 12l6.5 6.5"/></svg>
  </button>
  <span class="fn-mid"><span class="fn-count" id="fn-count"></span><span class="fn-hint" aria-hidden="true"><span class="h-touch">Swipe</span><span class="h-keys">← → keys</span></span></span>
  <button class="fn-btn" id="fn-next" type="button" aria-label="Next verse">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12.5 5.5 19 12l-6.5 6.5"/></svg>
  </button>
</nav>
<button class="to-top" id="to-top" type="button" aria-label="Back to top" tabindex="-1">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
</button>
<script>
// Sticky toolbar: once the display toggles scroll under it, a copy of them merges into the
// toolbar (the "Vedic Space" name folds away, the lotus stays). The copies share data-pref,
// so the page's own click handler and apply() keep both sets in sync.
(function(){
  var topbar = document.getElementById("topbar"), slot = document.getElementById("tb-slot");
  var bar = document.querySelector(".bar"), toTop = document.getElementById("to-top");
  bar.querySelectorAll(".sw, .theme-btn").forEach(function(b){ slot.appendChild(b.cloneNode(true)); });

  // Light/dark switch: follows the device until the reader picks one, then remembers it.
  var root = document.documentElement, dark = window.matchMedia("(prefers-color-scheme: dark)");
  function effective(){ return root.getAttribute("data-theme") || (dark.matches ? "dark" : "light"); }
  function paintThemeButtons(){
    var mode = effective(), label = mode === "dark" ? "Switch to light mode" : "Switch to dark mode";
    document.querySelectorAll("[data-theme-toggle]").forEach(function(b){
      b.setAttribute("data-mode", mode); b.setAttribute("aria-label", label); b.title = label; });
  }
  document.addEventListener("click", function(e){
    if (!e.target.closest("[data-theme-toggle]")) return;
    var next = effective() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("vs-theme", next); } catch(err) {}
    paintThemeButtons();
  });
  if (dark.addEventListener) dark.addEventListener("change", paintThemeButtons);
  paintThemeButtons();

  // ---- Focus mode: one verse at a time; swipe, arrow keys or the soft arrows to move.
  var main = document.getElementById("verses");
  var verses = Array.prototype.slice.call(main.querySelectorAll(":scope > .verse"));
  var secOf = [], lastSec = null;
  Array.prototype.forEach.call(main.children, function(c){
    if (c.classList.contains("section")) lastSec = c;
    else if (c.classList.contains("verse")) secOf.push(lastSec);
  });
  var FKEY = "vs-grantha-focus", focusOn = false, idx = 0;
  var prevB = document.getElementById("fn-prev"), nextB = document.getElementById("fn-next");
  function saveFocus(){ try { localStorage.setItem(FKEY, JSON.stringify({on: focusOn, v: verses[idx] && verses[idx].id})); } catch(e) {} }
  function show(i, dir){
    if (!verses.length) return;
    i = Math.max(0, Math.min(verses.length - 1, i));
    if (verses[idx]) verses[idx].classList.remove("cur", "in-next", "in-prev");
    idx = i;
    var v = verses[idx];
    v.classList.add("cur");
    if (dir) { void v.offsetWidth; v.classList.add(dir > 0 ? "in-next" : "in-prev"); }
    var s = secOf[idx];
    document.getElementById("fm-sec").textContent = s ? s.querySelector(".sd").textContent : "";
    document.getElementById("fm-n").textContent = v.dataset.label || ("Verse " + v.id.slice(1));
    document.getElementById("fn-count").textContent = (idx + 1) + " / " + verses.length;
    prevB.disabled = idx === 0;
    nextB.disabled = idx === verses.length - 1;
    try { history.replaceState(null, "", "#" + v.id); } catch(e) {}
    window.scrollTo(0, 0);
    saveFocus();
    updateSec();
  }
  function nearestVerse(){
    var top = topbar.offsetHeight + 10, best = 0;
    verses.forEach(function(v, i){ if (v.getBoundingClientRect().top <= top + 80) best = i; });
    return best;
  }
  function setFocus(on, startAt){
    if (on && startAt == null) startAt = nearestVerse();   // measure before the other verses hide
    focusOn = on;
    document.body.classList.toggle("focus-mode", on);
    var label = on ? "Show full text" : "Focus: one verse at a time";
    document.querySelectorAll("[data-focus-toggle]").forEach(function(b){
      b.setAttribute("aria-pressed", on ? "true" : "false"); b.setAttribute("aria-label", label); b.title = label; });
    if (on) {
      show(startAt);
    } else {
      verses.forEach(function(v){ v.classList.remove("cur", "in-next", "in-prev"); });
      try { history.replaceState(null, "", location.pathname + location.search); } catch(e) {}
      var v = verses[idx];
      if (v) window.scrollTo(0, v.getBoundingClientRect().top + window.scrollY - topbar.offsetHeight - 8);
      saveFocus();
    }
    onScroll();
  }
  function go(d){ if (focusOn) { var n = idx + d; if (n >= 0 && n < verses.length) show(n, d); } }
  prevB.addEventListener("click", function(){ go(-1); });
  nextB.addEventListener("click", function(){ go(1); });
  document.addEventListener("click", function(e){
    if (e.target.closest("[data-focus-toggle]")) setFocus(!focusOn);
    var th = e.target.closest("[data-thanks]");
    if (th) {                                   // namaste: open the citations, leaving focus mode if needed
      e.preventDefault();
      if (focusOn) setFocus(false);
      var c = document.getElementById("credits");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({top: c.getBoundingClientRect().top + window.scrollY - topbar.offsetHeight - 8,
                       behavior: reduce || focusOn ? "auto" : "smooth"});
      th.blur();
    }
  });
  function dictOpen(){ return document.getElementById("dict-back").classList.contains("open"); }
  document.addEventListener("keydown", function(e){
    if (!focusOn || dictOpen() || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  });
  var sx = 0, sy = 0, tracking = false;
  document.addEventListener("touchstart", function(e){
    tracking = focusOn && !dictOpen() && e.touches.length === 1 && !e.target.closest(".topbar, .focus-nav");
    if (tracking) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
  }, {passive: true});
  document.addEventListener("touchend", function(e){
    if (!tracking) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  }, {passive: true});

  // start in focus mode if the reader left it on, or if the link points at a verse (#v5)
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(FKEY) || "{}"); } catch(e) {}
  var hashI = -1;
  verses.forEach(function(v, i){ if ("#" + v.id === location.hash) hashI = i; });
  if (saved.on) {
    var si = hashI;
    if (si < 0) verses.forEach(function(v, i){ if (v.id === saved.v) si = i; });
    setFocus(true, si < 0 ? 0 : si);
  }

  // ---- Section picker: shown when the text has more than one section. The name in the toolbar is the
  // section being read (it changes with the scroll, or with the verse in focus mode); it opens a list.
  var secNav = document.getElementById("sec-nav"), secCur = document.getElementById("sec-cur");
  var secName = document.getElementById("sec-name"), secMenu = document.getElementById("sec-menu");
  var secs = Array.prototype.slice.call(main.querySelectorAll(":scope > .section")), shownSec = null;
  if (secs.length > 1) {
    secs.forEach(function(s, i){
      var b = document.createElement("button");
      b.className = "sec-item"; b.type = "button"; b.setAttribute("role", "menuitem"); b.dataset.sec = i;
      var sn = document.createElement("span"); sn.className = "sn"; sn.lang = "sa";
      if (s.dataset.short) { var sh = document.createElement("span"); sh.className = "sec-short"; sh.textContent = s.dataset.short; sn.appendChild(sh); }
      sn.appendChild(document.createTextNode(s.querySelector(".sd").textContent));
      var se = document.createElement("span"); se.className = "se"; se.textContent = s.querySelector(".si").textContent;
      b.appendChild(sn); b.appendChild(se); secMenu.appendChild(b);
    });
  }
  function currentSec(){
    if (focusOn) return secOf[idx] || null;
    var line = topbar.offsetHeight + 14, cur = null;
    secs.forEach(function(s){ if (s.getBoundingClientRect().top <= line) cur = s; });
    return cur;
  }
  function updateSec(){
    if (!secs || secs.length < 2) return;       // also when called before the picker is set up
    var cur = currentSec();
    if (cur === shownSec) return;
    shownSec = cur;
    if (!cur) { openSec(false); secNav.hidden = true; return; }
    secNav.hidden = false;
    secName.textContent = cur.querySelector(".sd").textContent;
    var secShort = document.getElementById("sec-short");
    secShort.textContent = cur.dataset.short || "";
    secShort.hidden = !cur.dataset.short;
    secCur.title = cur.querySelector(".si").textContent + " · go to another section";
    Array.prototype.forEach.call(secMenu.children, function(b){
      b.setAttribute("aria-current", secs[+b.dataset.sec] === cur ? "true" : "false"); });
  }
  function openSec(on){
    secNav.classList.toggle("open", on);
    secCur.setAttribute("aria-expanded", on ? "true" : "false");
    if (on) { var c = secMenu.querySelector('[aria-current="true"]'); if (c) c.scrollIntoView({block: "nearest"}); }
  }
  secCur.addEventListener("click", function(){ openSec(!secNav.classList.contains("open")); });
  secMenu.addEventListener("click", function(e){
    var b = e.target.closest(".sec-item"); if (!b) return;
    var s = secs[+b.dataset.sec];
    openSec(false);
    if (focusOn) {                                  // go to the first verse of that section
      var first = secOf.indexOf(s);
      if (first >= 0 && first !== idx) show(first, first > idx ? 1 : -1);
    } else {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({top: s.getBoundingClientRect().top + window.scrollY - topbar.offsetHeight - 2,
                       behavior: reduce ? "auto" : "smooth"});
    }
    secCur.blur();
  });
  document.addEventListener("click", function(e){ if (!e.target.closest("#sec-nav")) openSec(false); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && secNav.classList.contains("open")) { openSec(false); secCur.focus(); } });

  var pageHead = document.querySelector(".wrap > header");
  document.getElementById("tb-title").textContent = document.getElementById("t-deva").textContent;

  var merged = false;
  function setMerged(on){
    if (on === merged) return;
    merged = on;
    topbar.classList.toggle("merged", on);
    if (on) slot.removeAttribute("inert"); else slot.setAttribute("inert", "");
  }
  function onScroll(){
    var y = window.scrollY || document.documentElement.scrollTop;
    topbar.classList.toggle("scrolled", y > 4 || document.body.classList.contains("focus-mode"));
    setMerged(bar.getBoundingClientRect().bottom <= topbar.offsetHeight);
    var show = y > Math.max(600, window.innerHeight * 0.8);
    toTop.classList.toggle("show", show);
    toTop.tabIndex = show ? 0 : -1;
    updateSec();
    // the text's name appears at the right once the title above has scrolled away (or in focus mode)
    topbar.classList.toggle("past-title", pageHead.getBoundingClientRect().bottom <= topbar.offsetHeight);
  }
  var ticking = false;
  window.addEventListener("scroll", function(){
    if (!ticking) { ticking = true; requestAnimationFrame(function(){ ticking = false; onScroll(); }); }
  }, {passive: true});
  window.addEventListener("resize", onScroll);
  onScroll();

  toTop.addEventListener("click", function(){
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({top: 0, behavior: reduce ? "auto" : "smooth"});
    toTop.blur();
  });
})();
</script>
</body>
</html>
