an the great is the unmanifest, and higher than the unmanifest is the Person. Higher than the Person there is nothing: that is the limit, that is the highest goal.”","notes":["Śaṅkara: the unmanifest is the seed of the whole world, with name and form not yet unfolded, resting in the supreme Self as the power of a banyan tree rests in its seed. The Person is so called because he fills all (pūraṇāt). He is the limit at which subtlety, greatness and inwardness end, and the highest goal of all who travel in the cycle of birth and death."],"by":null,"var":[],"x":false},{"n":"1.3.12","label":null,"d":"एष सर्वेषु भूतेषु गूढोऽत्मा न प्रकाशते ।\nदृश्यते त्वग्र्यया बुद्ध्या सूक्ष्मया सूक्ष्मदर्शिभिः ॥ १२ ॥","i":"eṣa sarveṣu bhūteṣu gūḍho 'tmā na prakāśate |\ndṛśyate tv agryayā buddhyā sūkṣmayā sūkṣmadarśibhiḥ || 12 ||","pd":"एषः सर्वेषु भूतेषु गूढः आत्मा न प्रकाशते दृश्यते तु अग्र्यया बुद्ध्या सूक्ष्मया सूक्ष्म-दर्शिभिः","pi":"eṣaḥ sarveṣu bhūteṣu gūḍhaḥ ātmā na prakāśate dṛśyate tu agryayā buddhyā sūkṣmayā sūkṣma-darśibhiḥ","w":[["एषः","eṣaḥ","this","एतद्","etad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["etad"]],["सर्वेषु","sarveṣu","in all","सर्व","sarva","सर्वनाम, सप्तमी, नपुं, बहु","sarvanāma, saptamī, napuṃ, bahu","pronoun n. loc. pl.",["sarva"]],["भूतेषु","bhūteṣu","beings","भूत","bhūta","सप्तमी, नपुं, बहु","saptamī, napuṃ, bahu","n. loc. pl.",["bhūta"]],["गूढः","gūḍhaḥ","hidden","गुह्","guh","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg.",["guh"]],["आत्मा","ātmā","Self","आत्मन्","ātman","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["ātman"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["प्रकाशते","prakāśate","shines forth","प्र-काश्","pra-kāś","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["prakāś"]],["दृश्यते","dṛśyate","is seen","दृश्","dṛś","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["dṛś"]],["तु","tu","but","तु","tu","अव्यय","avyaya","indeclinable",["tu"]],["अग्र्यया","agryayā","by a pointed","अग्र्य","agrya","तृतीया, स्त्री, एक","tṛtīyā, strī, eka","f. ins. sg.",["agrya"]],["बुद्ध्या","buddhyā","intellect","बुद्धि","buddhi","तृतीया, स्त्री, एक","tṛtīyā, strī, eka","f. ins. sg.",["buddhi"]],["सूक्ष्मया","sūkṣmayā","subtle","सूक्ष्म","sūkṣma","तृतीया, स्त्री, एक","tṛtīyā, strī, eka","f. ins. sg.",["sūkṣma"]],["सूक्ष्म-दर्शिभिः","sūkṣma-darśibhiḥ","by those who see what is subtle","सूक्ष्मदर्शिन्","sūkṣmadarśin","तृतीया, पुं, बहु","tṛtīyā, puṃ, bahu","m. ins. pl.",["sūkṣmadarśin"]]],"t":"“This Self, hidden in all beings, does not shine forth. But it is seen by those who see what is subtle, through a pointed and subtle intellect.”","notes":["Śaṅkara: it is hidden in all beings, from Brahmā down to a tuft of grass, covered by ignorance and illusion in the form of seeing, hearing and other acts; so it does not show itself to anyone as the Self. Reaching it is called a ‘going’ only by a figure of speech: since it is the inmost Self of all, knowing it is the reaching. agryā: one-pointed, like the tip of a thing."],"by":null,"var":[],"x":false},{"n":"1.3.13","label":null,"d":"यच्छेद्वाङ्मनसी प्राज्ञस्तद्यच्छेज्ज्ञान आत्मनि ।\nज्ञानमात्मनि महति नियच्छेत्तद्यच्छेच्छान्त आत्मनि ॥ १३ ॥","i":"yacched vāṅmanasī prājñas tad yacchej jñāna ātmani |\njñānam ātmani mahati niyacchet tad yacchecchānta ātmani || 13 ||","pd":"यच्छेत् वाक् मनसी प्राज्ञः तत् यच्छेत् ज्ञाने आत्मनि ज्ञानम् आत्मनि महति नियच्छेत् तत् यच्छेत् शान्ते आत्मनि","pi":"yacchet vāk manasī prājñaḥ tat yacchet jñāne ātmani jñānam ātmani mahati niyacchet tat yacchet śānte ātmani","w":[["यच्छेत्","yacchet","should merge","यम्","yam","विधिलिङ्, प्रथम, एक","vidhiliṅ, prathama, eka","optative 3rd sg.",["yam"]],["वाक्","vāk","speech","वाच्","vāc","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["vāc"]],["मनसी","manasī","in the mind","मनस्","manas","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg.",["manas"]],["प्राज्ञः","prājñaḥ","the wise one","प्राज्ञ","prājña","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["prājña"]],["तत्","tat","that","तद्","tad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["tad"]],["यच्छेत्","yacchet","should merge","यम्","yam","विधिलिङ्, प्रथम, एक","vidhiliṅ, prathama, eka","optative 3rd sg.",["yam"]],["ज्ञाने","jñāne","in the knowing","ज्ञान","jñāna","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg.",["jñāna"]],["आत्मनि","ātmani","self","आत्मन्","ātman","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["ātman"]],["ज्ञानम्","jñānam","the knowing self","ज्ञान","jñāna","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["jñāna"]],["आत्मनि","ātmani","in the self","आत्मन्","ātman","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["ātman"]],["महति","mahati","great","महत्","mahat","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["mahat"]],["नियच्छेत्","niyacchet","should merge","नि-यम्","ni-yam","विधिलिङ्, प्रथम, एक","vidhiliṅ, prathama, eka","optative 3rd sg.",["niyam"]],["तत्","tat","that","तद्","tad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["tad"]],["यच्छेत्","yacchet","should merge","यम्","yam","विधिलिङ्, प्रथम, एक","vidhiliṅ, prathama, eka","optative 3rd sg.",["yam"]],["शान्ते","śānte","in the peaceful","शान्त","śānta","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["śānta"]],["आत्मनि","ātmani","Self","आत्मन्","ātman","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["ātman"]]],"t":"“The wise one should merge speech in the mind, and the mind in the knowing self, the intellect. He should merge the intellect in the great self, and that in the peaceful Self.”","notes":["Śaṅkara: speech stands for all the senses. vāk is the accusative vācam with its ending dropped, and manasī is manasi with a Vedic long vowel. The ‘knowing self’ is the intellect, luminous by nature. The great self is the first-born. The peaceful Self is the principal Self, in which every distinction has ceased: changeless, inmost in all, witness of every thought.","The DCS takes vāṅmanasī as a compound, ‘speech and mind’; the analysis here follows Śaṅkara."],"by":null,"var":[],"x":false},{"n":"1.3.14","label":null,"d":"उत्तिष्ठत जाग्रत प्राप्य वरान्निबोधत ।\nक्षुरस्य धारा निशिता दुरत्यया दुर्गं पथस्तत्कवयो वदन्ति ॥ १४ ॥","i":"uttiṣṭhata jāgrata prāpya varān nibodhata |\nkṣurasya dhārā niśitā duratyayā durgaṃ pathas tat kavayo vadanti || 14 ||","pd":"उत्तिष्ठत जाग्रत प्राप्य वरान् निबोधत क्षुरस्य धारा निशिता दुरत्यया दुर्गम् पथः तत् कवयः वदन्ति","pi":"uttiṣṭhata jāgrata prāpya varān nibodhata kṣurasya dhārā niśitā duratyayā durgam pathaḥ tat kavayaḥ vadanti","w":[["उत्तिष्ठत","uttiṣṭhata","arise","उत्-स्था","ut-sthā","लोट्, मध्यम, बहु","loṭ, madhyama, bahu","imperative 2nd pl.",[]],["जाग्रत","jāgrata","awake","जागृ","jāgṛ","लोट्, मध्यम, बहु","loṭ, madhyama, bahu","imperative 2nd pl.",["jāgṛ"]],["प्राप्य","prāpya","having approached","प्र-आप्","pra-āp","ल्यप्","lyap","absolutive",["prāp"]],["वरान्","varān","the best (teachers)","वर","vara","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["vara"]],["निबोधत","nibodhata","understand","नि-बुध्","ni-budh","लोट्, मध्यम, बहु","loṭ, madhyama, bahu","imperative 2nd pl.",["nibudh"]],["क्षुरस्य","kṣurasya","of a razor","क्षुर","kṣura","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["kṣura"]],["धारा","dhārā","the edge","धारा","dhārā","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg.",["dhārā"]],["निशिता","niśitā","sharpened","नि-शि","ni-śi","क्त, प्रथमा, स्त्री, एक","kta, prathamā, strī, eka","past passive participle f. nom. sg.",["niśi"]],["दुरत्यया","duratyayā","hard to pass over","दुरत्यय","duratyaya","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg.",["duratyaya"]],["दुर्गम्","durgam","hard to travel","दुर्ग","durga","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["durga"]],["पथः","pathaḥ","the path","पथिन्","pathin","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["pathin"]],["तत्","tat","that","तद्","tad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["tad"]],["कवयः","kavayaḥ","the sages","कवि","kavi","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["kavi"]],["वदन्ति","vadanti","declare","वद्","vad","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["vad"]]],"t":"“Arise! Awake! Approach the best of teachers and understand. Like the sharpened edge of a razor, hard to pass over: so hard to travel, the sages declare, is that path.”","notes":["Śaṅkara: the Upaniṣad speaks out of compassion, like a mother: awake from the dreadful sleep of ignorance, the seed of every evil. ‘Understand’: know the inmost Self taught by them as ‘I am this’. pathaḥ is to be taken as panthānam, ‘the path’ of knowledge, which is hard to gain because what is to be known is so subtle.","The DCS reads varāt, an ablative; the text and Śaṅkara have varān, ‘the best’, which is followed here."],"by":null,"var":[],"x":false},{"n":"1.3.15","label":null,"d":"अशब्दमस्पर्शमरूपमव्ययं तथारसं नित्यमगन्धवच्च यत् ।\nअनाद्यनन्तं महतः परं ध्रुवं निचाय्य तन्मृत्युमुखात्प्रमुच्यते ॥ १५ ॥","i":"aśabdam asparśam arūpam avyayaṃ tathārasaṃ nityam agandhavacca yat |\nanādy anantaṃ mahataḥ paraṃ dhruvaṃ nicāyya tan mṛtyumukhāt pramucyate || 15 ||","pd":"अशब्दम् अस्पर्शम् अरूपम् अव्ययम् तथा अरसम् नित्यम् अ-गन्धवत् च यत् अनादि अनन्तम् महतः परम् ध्रुवम् निचाय्य तत् मृत्यु-मुखात् प्रमुच्यते","pi":"aśabdam asparśam arūpam avyayam tathā arasam nityam a-gandhavat ca yat anādi anantam mahataḥ param dhruvam nicāyya tat mṛtyu-mukhāt pramucyate","w":[["अशब्दम्","aśabdam","without sound","अशब्द","aśabda","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["aśabda"]],["अस्पर्शम्","asparśam","without touch","अस्पर्श","asparśa","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["asparśa"]],["अरूपम्","arūpam","without form","अरूप","arūpa","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["arūpa"]],["अव्ययम्","avyayam","undecaying","अव्यय","avyaya","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["avyaya"]],["तथा","tathā","likewise","तथा","tathā","अव्यय","avyaya","indeclinable",["tathā"]],["अरसम्","arasam","without taste","अरस","arasa","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["arasa"]],["नित्यम्","nityam","eternal","नित्य","nitya","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["nitya"]],["अ-गन्धवत्","a-gandhavat","without smell","अगन्धवत्","agandhavat","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["a","gandhavat"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["यत्","yat","which","यद्","yad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["yad"]],["अनादि","anādi","without beginning","अनादि","anādi","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["anādi"]],["अनन्तम्","anantam","without end","अनन्त","ananta","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["ananta"]],["महतः","mahataḥ","than the great","महत्","mahat","पञ्चमी, पुं, एक","pañcamī, puṃ, eka","m. abl. sg.",["mahat"]],["परम्","param","higher","पर","para","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["para"]],["ध्रुवम्","dhruvam","unchanging","ध्रुव","dhruva","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["dhruva"]],["निचाय्य","nicāyya","having realised","नि-चि","ni-ci","ल्यप्","lyap","absolutive",["nici"]],["तत्","tat","that","तद्","tad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["tad"]],["मृत्यु-मुखात्","mṛtyu-mukhāt","from the jaws of death","मृत्युमुख","mṛtyumukha","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["mṛtyu","mukha"]],["प्रमुच्यते","pramucyate","is released","प्र-मुच्","pra-muc","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["pramuc"]]],"t":"“That which is without sound, touch, form, taste or smell, undecaying and eternal, without beginning or end, higher than the great, and unchanging: realising that, one is released from the jaws of death.”","notes":["Śaṅkara: whatever has sound and the other qualities decays; Brahman, having none, does not. Without beginning: it has no cause into which it could dissolve; without end: it has no effect by producing which it would perish. ‘The great’ here is the principle called intellect. The jaws of death are ignorance, desire and action."],"by":null,"var":[],"x":false},{"n":"1.3.16","label":null,"d":"नाचिकेतमुपाख्यानं मृत्युप्रोक्तं सनातनम् ।\nउक्त्वा श्रुत्वा च मेधावी ब्रह्मलोके महीयते ॥ १६ ॥","i":"nāciketam upākhyānaṃ mṛtyuproktaṃ sanātanam |\nuktvā śrutvā ca medhāvī brahmaloke mahīyate || 16 ||","pd":"नाचिकेतम् उपाख्यानम् मृत्यु-प्रोक्तम् सनातनम् उक्त्वा श्रुत्वा च मेधावी ब्रह्म-लोके महीयते","pi":"nāciketam upākhyānam mṛtyu-proktam sanātanam uktvā śrutvā ca medhāvī brahma-loke mahīyate","w":[["नाचिकेतम्","nāciketam","of Naciketas","नाचिकेत","nāciketa","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["nāciketa"]],["उपाख्यानम्","upākhyānam","the story","उपाख्यान","upākhyāna","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["upākhyāna"]],["मृत्यु-प्रोक्तम्","mṛtyu-proktam","told by Death","मृत्युप्रोक्त","mṛtyuprokta","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["mṛtyu","prokta"]],["सनातनम्","sanātanam","ancient","सनातन","sanātana","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["sanātana"]],["उक्त्वा","uktvā","having told","वच्","vac","क्त्वा","ktvā","absolutive",["vac"]],["श्रुत्वा","śrutvā","having heard","श्रु","śru","क्त्वा","ktvā","absolutive",["śru"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["मेधावी","medhāvī","a wise person","मेधाविन्","medhāvin","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["medhāvin"]],["ब्रह्म-लोके","brahma-loke","in the world that is Brahman","ब्रह्मलोक","brahmaloka","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["brahmaloka"]],["महीयते","mahīyate","is honoured","महीय्","mahīy","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",[]]],"t":"A wise person who tells, and who hears, this ancient story of Naciketas, told by Death, is honoured in the world that is Brahman.","notes":["Śaṅkara: the Upaniṣad says this in praise of the teaching. The story is the three vallīs; it is ‘ancient’ because it is Vedic. It is told to brahmins and heard from teachers. brahmaloka: the world which is Brahman itself."],"by":null,"var":[],"x":false},{"n":"1.3.17","label":null,"d":"य इमं परमं गुह्यं श्रावयेद्ब्रह्मसंसदि ।\nप्रयतः श्राद्धकाले वा तदानन्त्याय कल्पते ।\nतदानन्त्याय कल्पत इति ॥ १७ ॥","i":"ya imaṃ paramaṃ guhyaṃ śrāvayed brahmasaṃsadi |\nprayataḥ śrāddhakāle vā tad ānantyāya kalpate |\ntad ānantyāya kalpata iti || 17 ||","pd":"यः इमम् परमम् गुह्यम् श्रावयेत् ब्रह्म-संसदि प्रयतः श्राद्ध-काले वा तत् आनन्त्याय कल्पते तत् आनन्त्याय कल्पते इति","pi":"yaḥ imam paramam guhyam śrāvayet brahma-saṃsadi prayataḥ śrāddha-kāle vā tat ānantyāya kalpate tat ānantyāya kalpate iti","w":[["यः","yaḥ","who","यद्","yad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["yad"]],["इमम्","imam","this","इदम्","idam","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["idam"]],["परमम्","paramam","supreme","परम","parama","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["parama"]],["गुह्यम्","guhyam","secret","गुह्य","guhya","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["guhya"]],["श्रावयेत्","śrāvayet","should recite","श्रु","śru","विधिलिङ्, प्रथम, एक, णिजन्त","vidhiliṅ, prathama, eka, ṇijanta","optative 3rd sg. causative",["śru"]],["ब्रह्म-संसदि","brahma-saṃsadi","in an assembly of brahmins","ब्रह्मसंसद्","brahmasaṃsad","सप्तमी, स्त्री, एक","saptamī, strī, eka","f. loc. sg.",["brahmasaṃsad"]],["प्रयतः","prayataḥ","purified","प्र-यम्","pra-yam","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg.",["prayam"]],["श्राद्ध-काले","śrāddha-kāle","at the time of the rite for th "द्वितीया, नपुं, बहु","dvitīyā, napuṃ, bahu","n. acc. pl.",["parāñc"]],["खानि","khāni","the openings (senses)","ख","kha","द्वितीया, नपुं, बहु","dvitīyā, napuṃ, bahu","n. acc. pl.",["kha"]],["व्यतृणत्","vyatṛṇat","pierced","वि-तृद्","vi-tṛd","लङ्, प्रथम, एक","laṅ, prathama, eka","imperfect 3rd sg.",["vitṛd"]],["स्वयंभूः","svayaṃbhūḥ","the Self-existent","स्वयंभू","svayaṃbhū","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["svayambhū"]],["तस्मात्","tasmāt","therefore","तद्","tad","अव्यय","avyaya","indeclinable",["tad"]],["पराङ्","parāṅ","outward","पराञ्च्","parāñc","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["parāñc"]],["पश्यति","paśyati","one sees","दृश्","dṛś","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["dṛś"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["अन्तरात्मन्","antarātman","the Self within","अन्तरात्मन्","antarātman","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["antarātman"]],["कश्चित्","kaścit","some","कश्चित्","kaścit","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",[]],["धीरः","dhīraḥ","wise person","धीर","dhīra","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["dhīra"]],["प्रत्यक्","pratyak","inward","प्रत्यञ्च्","pratyañc","अव्यय","avyaya","indeclinable",["pratyañc"]],["आत्मानम्","ātmānam","the Self","आत्मन्","ātman","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["ātman"]],["ऐक्षत्","aikṣat","saw","ईक्ष्","īkṣ","लङ्, प्रथम, एक","laṅ, prathama, eka","imperfect 3rd sg.",["īkṣ"]],["आवृत्त-चक्षुः","āvṛtta-cakṣuḥ","with eyes turned back","आवृत्तचक्षुस्","āvṛttacakṣus","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["āvṛtta","cakṣus"]],["अमृत-त्वम्","amṛta-tvam","immortality","अमृतत्व","amṛtatva","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["amṛtatva"]],["इच्छन्","icchan","desiring","इष्","iṣ","शतृ।शानच्, प्रथमा, पुं, एक","śatṛ/śānac, prathamā, puṃ, eka","present participle m. nom. sg.",["iṣ"]]],"t":"“The Self-existent pierced the senses so that they turn outward; therefore one sees what is outside and not the Self within. Some wise person, desiring immortality, turned his eyes back and saw the inward Self.”","notes":["Śaṅkara: khāni, ‘openings’, stands for the ear and the other senses. ‘Pierced’ means ‘injured’: the Lord made them outward-going by nature. The wise one turns them back as one would turn a river against its current. antarātman stands for antarātmānam. aikṣat, a past form, has the sense ‘sees’, tense being free in the Veda. āvṛttacakṣuḥ: with eye, ear and all the senses withdrawn from every object."],"by":null,"var":[],"x":false},{"n":"2.1.2","label":null,"d":"पराचः कामाननुयन्ति बालास्ते मृत्योर्यन्ति विततस्य पाशम् ।\nअथ धीरा अमृतत्वं विदित्वा ध्रुवमध्रुवेष्विह न प्रार्थयन्ते ॥ २ ॥","i":"parācaḥ kāmān anuyanti bālās te mṛtyor yanti vitatasya pāśam |\natha dhīrā amṛtatvaṃ viditvā dhruvam adhruveṣv iha na prārthayante || 2 ||","pd":"पराचः कामान् अनुयन्ति बालाः ते मृत्योः यन्ति विततस्य पाशम् अथ धीराः अमृत-त्वम् विदित्वा ध्रुवम् अध्रुवेषु इह न प्रार्थयन्ते","pi":"parācaḥ kāmān anuyanti bālāḥ te mṛtyoḥ yanti vitatasya pāśam atha dhīrāḥ amṛta-tvam viditvā dhruvam adhruveṣu iha na prārthayante","w":[["पराचः","parācaḥ","outward","पराञ्च्","parāñc","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["parāñc"]],["कामान्","kāmān","objects of desire","काम","kāma","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["kāma"]],["अनुयन्ति","anuyanti","follow","अनु-इ","anu-i","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["anvi"]],["बालाः","bālāḥ","the childish","बाल","bāla","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["bāla"]],["ते","te","they","तद्","tad","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["tad"]],["मृत्योः","mṛtyoḥ","of death","मृत्यु","mṛtyu","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["mṛtyu"]],["यन्ति","yanti","go into","इ","i","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["i"]],["विततस्य","vitatasya","widespread","वि-तन्","vi-tan","क्त, षष्ठी, पुं, एक","kta, ṣaṣṭhī, puṃ, eka","past passive participle m. gen. sg.",["vitan"]],["पाशम्","pāśam","the snare","पाश","pāśa","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["pāśa"]],["अथ","atha","therefore","अथ","atha","अव्यय","avyaya","indeclinable",["atha"]],["धीराः","dhīrāḥ","the wise","धीर","dhīra","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["dhīra"]],["अमृत-त्वम्","amṛta-tvam","immortality","अमृतत्व","amṛtatva","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["amṛtatva"]],["विदित्वा","viditvā","having known","विद्","vid","क्त्वा","ktvā","absolutive",["vid"]],["ध्रुवम्","dhruvam","the stable","ध्रुव","dhruva","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["dhruva"]],["अध्रुवेषु","adhruveṣu","among unstable things","अध्रुव","adhruva","सप्तमी, पुं, बहु","saptamī, puṃ, bahu","m. loc. pl.",["adhruva"]],["इह","iha","here","इह","iha","अव्यय","avyaya","indeclinable",["iha"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["प्रार्थयन्ते","prārthayante","ask for anything","प्र-अर्थ्","pra-arth","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["prārth"]]],"t":"“The childish follow outward objects of desire, and they walk into the widespread snare of death. The wise, therefore, having known immortality as the one stable thing, ask for nothing here among things that are unstable.”","notes":["Śaṅkara: death here is the whole of ignorance, desire and action; its snare is union with body and senses, that is, the unbroken run of birth, death, old age and disease. The stable immortality is abiding in one's nature as the inward Self. The wise rise above the desire for sons, wealth and worlds."],"by":null,"var":[],"x":false},{"n":"2.1.3","label":null,"d":"येन रूपं रसं गन्धं शब्दान्स्पर्शांश्च मैथुनान् ।\nएतेनैव विजानाति किमत्र परिशिष्यते ।\nएतद्वै तत् ॥ ३ ॥","i":"yena rūpaṃ rasaṃ gandhaṃ śabdān sparśāṃśca maithunān |\netenaiva vijānāti kim atra pariśiṣyate |\netad vai tat || 3 ||","pd":"येन रूपम् रसम् गन्धम् शब्दान् स्पर्शान् च मैथुनान् एतेन एव विजानाति किम् अत्र परिशिष्यते एतत् वै तत्","pi":"yena rūpam rasam gandham śabdān sparśān ca maithunān etena eva vijānāti kim atra pariśiṣyate etat vai tat","w":[["येन","yena","by which","यद्","yad","सर्वनाम, तृतीया, पुं, एक","sarvanāma, tṛtīyā, puṃ, eka","pronoun m. ins. sg.",["yad"]],["रूपम्","rūpam","form","रूप","rūpa","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["rūpa"]],["रसम्","rasam","taste","रस","rasa","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["rasa"]],["गन्धम्","gandham","smell","गन्ध","gandha","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["gandha"]],["शब्दान्","śabdān","sounds","शब्द","śabda","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["śabda"]],["स्पर्शान्","sparśān","touches","स्पर्श","sparśa","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["sparśa"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["मैथुनान्","maithunān","the pleasures of union","मैथुन","maithuna","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["maithuna"]],["एतेन","etena","by this","एतद्","etad","सर्वनाम, तृतीया, पुं, एक","sarvanāma, tṛtīyā, puṃ, eka","pronoun m. ins. sg.",["etad"]],["एव","eva","alone","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["विजानाति","vijānāti","one knows","वि-ज्ञा","vi-jñā","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vijñā"]],["किम्","kim","what","किम्","kim","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["kim"]],["अत्र","atra","here","अत्र","atra","अव्यय","avyaya","indeclinable",["atra"]],["परिशिष्यते","pariśiṣyate","remains","परि-शिष्","pari-śiṣ","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["pariśiṣ"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["etad"]],["वै","vai","indeed","वै","vai","अव्यय","avyaya","indeclinable",["vai"]],["तत्","tat","is that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]]],"t":"“That by which one knows form, taste, smell, sounds, touches and the pleasures of union: by this alone one knows. What remains here unknown to it? This indeed is that.”","notes":["Śaṅkara: it is the Self, whose nature is consciousness. The body and the rest, being themselves made of form and the like and being objects of knowledge, cannot be the knower; one knows them through the Self that is distinct from them, as that by which iron burns is fire. Nothing is left that the Self does not know: it is all-knowing.","Śaṅkara: etad vai tat: this is that which Naciketas asked about, which even the gods doubted, which is other than righteousness and the rest: the highest state of Viṣṇu, beyond which there is nothing."],"by":null,"var":[],"x":false},{"n":"2.1.4","label":null,"d":"स्वप्नान्तं जागरितान्तं चोभौ येनानुपश्यति ।\nमहान्तं विभुमात्मानं मत्वा धीरो न शोचति ॥ ४ ॥","i":"svapnāntaṃ jāgaritāntaṃ cobhau yenānupaśyati |\nmahāntaṃ vibhum ātmānaṃ matvā dhīro na śocati || 4 ||","pd":"स्वप्न-अन्तम् जागरित-अन्तम् च उभौ येन अनुपश्यति महान्तम् विभुम् आत्मानम् मत्वा धीरः न शोचति","pi":"svapna-antam jāgarita-antam ca ubhau yena anupaśyati mahāntam vibhum ātmānam matvā dhīraḥ na śocati","w":[["स्वप्न-अन्तम्","svapna-antam","what is within dream","स्वप्नान्त","svapnānta","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["svapnānta"]],["जागरित-अन्तम्","jāgarita-antam","what is within waking","जागरितान्त","jāgaritānta","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["jāgaritānta"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["उभौ","ubhau","both","उभ","ubha","द्वितीया, पुं, द्वि","dvitīyā, puṃ, dvi","m. acc. du.",["ubha"]],["येन","yena","by which","यद्","yad","सर्वनाम, तृतीया, पुं, एक","sarvanāma, tṛtīyā, puṃ, eka","pronoun m. ins. sg.",["yad"]],["अनुपश्यति","anupaśyati","one perceives","अनु-दृश्","anu-dṛś","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["anudṛś"]],["महान्तम्","mahāntam","great","महत्","mahat","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["mahat"]],["विभुम्","vibhum","all-pervading","विभु","vibhu","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["vibhu"]],["आत्मानम्","ātmānam","the Self","आत्मन्","ātman","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["ātman"]],["मत्वा","matvā","having known","मन्","man","क्त्वा","ktvā","absolutive",["man"]],["धीरः","dhīraḥ","the wise one","धीर","dhīra","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["dhīra"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["शोचति","śocati","grieves","शुच्","śuc","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["śuc"]]],"t":"“That by which one perceives both what is seen in dream and what is seen in waking: knowing that great, all-pervading Self, the wise man does not grieve.”","notes":["Śaṅkara: because the Self is so subtle and hard to know, the same thing is said again and again. svapnānta: what lies within dream, the objects known in dream. He knows it directly as ‘I am the supreme Self’."],"by":null,"var":[],"x":false},{"n":"2.1.5","label":null,"d":"य इमं मध्वदं वेद आत्मानं जीवमन्तिकात् ।\nईशानं भूतभव्यस्य न ततो विजुगुप्सते ।\nएतद्वै तत् ॥ ५ ॥","i":"ya imaṃ madhvadaṃ veda ātmānaṃ jīvam antikāt |\nīśānaṃ bhūtabhavyasya na tato vijugupsate |\netad vai tat || 5 ||","pd":"यः इमम् मध्वदम् वेद आत्मानम् जीवम् अन्तिकात् ईशानम् भूत-भव्यस्य न ततः विजुगुप्सते एतत् वै तत्","pi":"yaḥ imam madhvadam veda ātmānam jīvam antikāt īśānam bhūta-bhavyasya na tataḥ vijugupsate etat vai tat","w":[["यः","yaḥ","who","यद्","yad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["yad"]],["इमम्","imam","this","इदम्","idam","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["idam"]],["मध्वदम्","madhvadam","eater of honey","मध्वद","madhvada","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",[]],["वेद","veda","knows","विद्","vid","लिट्, प्रथम, एक","liṭ, prathama, eka","perfect 3rd sg.",["vid"]],["आत्मानम्","ātmānam","Self","आत्मन्","ātman","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["ātman"]],["जीवम्","jīvam","the living one","जीव","jīva","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["jīva"]],["अन्तिकात्","antikāt","close at hand","अन्तिक","antika","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["antika"]],["ईशानम्","īśānam","the lord","ईशान","īśāna","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["īśāna"]],["भूत-भव्यस्य","bhūta-bhavyasya","of what has been and what is to be","भूतभव्य","bhūtabhavya","षष्ठी, नपुं, एक","ṣaṣṭhī, napuṃ, eka","n. gen. sg.",["bhūtabhavya"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["ततः","tataḥ","thereafter","ततस्","tatas","अव्यय","avyaya","indeclinable",["tatas"]],["विजुगुप्सते","vijugupsate","seeks to protect himself","वि-गुप्","vi-gup","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vigup"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["etad"]],["वै","vai","indeed","वै","vai","अव्यय","avyaya","indeclinable",["vai"]],["तत्","tat","is that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]]],"t":"“He who knows this Self, the eater of honey, the living one, close at hand, as the lord of what has been and what is to be, no longer seeks to protect himself. This indeed is that.”","notes":["Śaṅkara: madhvada: the one who tastes the fruits of action; jīva: the sustainer of the life-breaths. ‘Lord of past and future’ covers the three times. As long as a man thinks himself impermanent and exposed to fear, he wishes to guard himself; once he knows the Self as eternal and without a second, who would guard what, and from what?","vijugupsate is a desiderative form; it is labelled here as a present."],"by":null,"var":[],"x":false},{"n":"2.1.6","label":null,"d":"यः पूर्वं तपसो जातमद्भ्यः पूर्वमजायत ।\nगुहां प्रविश्य तिष्ठन्तं यो भूतेभिर्व्यपश्यत ।\nएतद्वै तत् ॥ ६ ॥","i":"yaḥ pūrvaṃ tapaso jātam adbhyaḥ pūrvam ajāyata |\nguhāṃ praviśya tiṣṭhantaṃ yo bhūtebhir vyapaśyata |\netad vai tat || 6 ||","pd":"यः पूर्वम् तपसः जातम् अद्भ्यः पूर्वम् अजायत गुहाम् प्रविश्य तिष्ठन्तम् यः भूतेभिः व्यपश्यत एतत् वै तत्","pi":"yaḥ pūrvam tapasaḥ jātam adbhyaḥ pūrvam ajāyata guhām praviśya tiṣṭhantam yaḥ bhūtebhiḥ vyapaśyata etat vai tat","w":[["यः","yaḥ","who","यद्","yad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["yad"]],["पूर्वम्","pūrvam","first","पूर्वम्","pūrvam","अव्यय","avyaya","indeclinable",["pūrvam"]],["तपसः","tapasaḥ","from austerity","तपस्","tapas","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["tapas"]],["जातम्","jātam","born","जन्","jan","क्त, द्वितीया, पुं, एक","kta, dvitīyā, puṃ, eka","past passive participle m. acc. sg.",["jan"]],["अद्भ्यः","adbhyaḥ","than the waters","अप्","ap","पञ्चमी, स्त्री, बहु","pañcamī, strī, bahu","f. abl. pl.",["ap"]],["पूर्वम्","pūrvam","earlier","पूर्वम्","pūrvam","अव्यय","avyaya","indeclinable",["pūrvam"]],["अजायत","ajāyata","was born","जन्","jan","लङ्, प्रथम, एक","laṅ, prathama, eka","imperfect 3rd sg.",["jan"]],["गुहाम्","guhām","the cave","गुहा","guhā","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["guhā"]],["प्रविश्य","praviśya","having entered","प्र-विश्","pra-viś","ल्यप्","lyap","absolutive",["praviś"]],["तिष्ठन्तम्","tiṣṭhantam","abiding","स्था","sthā","शतृ।शानच्, द्वितीया, पुं, एक","śatṛ/śānac, dvitīyā, puṃ, eka","present participle m. acc. sg.",["sthā"]],["यः","yaḥ","who","यद्","yad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["yad"]],["भूतेभिः","bhūtebhiḥ","with the elements","भूत","bhūta","तृतीया, नपुं, बहु","tṛtīyā, napuṃ, bahu","n. ins. pl.",["bhūta"]],["व्यपश्यत","vyapaśyata","sees","वि-दृश्","vi-dṛś","लङ्, प्रथम, एक","laṅ, prathama, eka","imperfect 3rd sg.",["vidṛś"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["etad"]],["वै","vai","indeed","वै","vai","अव्यय","avyaya","indeclinable",["vai"]],["तत्","tat","is that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]]],"t":"“He who sees the first-born, born of old from austerity, born before the waters, who has entered the cave and abides there with the elements: he sees this very Brahman. This indeed is that.”","notes":["Śaṅkara: the inward Self, already shown to be the Lord, is now shown to be the Self of all. The first-born is Hiraṇyagarbha, born from Brahman, whose austerity is knowledge. ‘Before the waters’ means before all five elements, water included. The cave is the space in the heart of every creature; the bhūtas are the body and organs. bhūtebhiḥ is the Vedic form of bhūtaiḥ. vyapaśyata has the sense ‘sees’.","Śaṅkara: etad vai tat: this is that which Naciketas asked about, which even the gods doubted, which is other than righteousness and the rest: the highest state of Viṣṇu, beyond which there is nothing."],"by":null,"var":[],"x":false},{"n":"2.1.7","label":null,"d":"या प्राणेन सम्भवति अदितिर्देवतामयी ।\nगुहां प्रविश्य तिष्ठन्तीं या भूतेभिर्व्यजायत ।\nएतद्वै तत् ॥ ७ ॥","i":"yā prāṇena sambhavati aditir devatāmayī |\nguhāṃ praviśya tiṣṭhantīṃ yā bhūtebhir vyajāyata |\netad vai tat || 7 ||","pd":"या प्राणेन सम्भवति अदितिः देवता-मयी गुहाम् प्रविश्य तिष्ठन्तीम् या भूतेभिः व्यजायत एतत् वै तत्","pi":"yā prāṇena sambhavati aditiḥ devatā-mayī guhām praviśya tiṣṭhantīm yā bhūtebhiḥ vyajāyata etat vai tat","w":[["या","yā","who","यद्","yad","सर्वनाम, प्रथमा, स्त्री, एक","sarvanāma, prathamā, strī, eka","pronoun f. nom. sg.",["yad"]],["प्राणेन","prāṇena","as the life-breath","प्राण","prāṇa","तृतीया, पुं, एक","tṛtīyā, puṃ, eka","m. ins. sg.",["prāṇa"]],["सम्भवति","sambhavati","arises","सम्-भू","sam-bhū","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.", ,"notes":["Śaṅkara: ‘that’ is the life-breath, the Self. The gods are fire and the rest in the cosmos, and speech and the rest in the person; they are fixed in it like spokes in the hub of a wheel. It too is Brahman, the Self of all. No one, ceasing to be of its nature, becomes other than it.","Śaṅkara: etad vai tat: this is that which Naciketas asked about, which even the gods doubted, which is other than righteousness and the rest: the highest state of Viṣṇu, beyond which there is nothing."],"by":null,"var":[],"x":false},{"n":"2.1.10","label":null,"d":"यदेवेह तदमुत्र यदमुत्र तदन्विह ।\nमृत्योः स मृत्युमाप्नोति य इह नानेव पश्यति ॥ १० ॥","i":"yad eveha tad amutra yad amutra tad anv iha |\nmṛtyoḥ sa mṛtyum āpnoti ya iha nāneva paśyati || 10 ||","pd":"यत् एव इह तत् अमुत्र यत् अमुत्र तत् अनु इह मृत्योः सः मृत्युम् आप्नोति यः इह नाना इव पश्यति","pi":"yat eva iha tat amutra yat amutra tat anu iha mṛtyoḥ saḥ mṛtyum āpnoti yaḥ iha nānā iva paśyati","w":[["यत्","yat","what","यद्","yad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["yad"]],["एव","eva","indeed","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["इह","iha","here","इह","iha","अव्यय","avyaya","indeclinable",["iha"]],["तत्","tat","that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]],["अमुत्र","amutra","there","अमुत्र","amutra","अव्यय","avyaya","indeclinable",["amutra"]],["यत्","yat","what","यद्","yad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["yad"]],["अमुत्र","amutra","there","अमुत्र","amutra","अव्यय","avyaya","indeclinable",["amutra"]],["तत्","tat","that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]],["अनु","anu","likewise","अनु","anu","अव्यय","avyaya","indeclinable",["anu"]],["इह","iha","here","इह","iha","अव्यय","avyaya","indeclinable",["iha"]],["मृत्योः","mṛtyoḥ","from death","मृत्यु","mṛtyu","पञ्चमी, पुं, एक","pañcamī, puṃ, eka","m. abl. sg.",["mṛtyu"]],["सः","saḥ","he","तद्","tad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["tad"]],["मृत्युम्","mṛtyum","to death","मृत्यु","mṛtyu","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["mṛtyu"]],["आप्नोति","āpnoti","goes","आप्","āp","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["āp"]],["यः","yaḥ","who","यद्","yad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["yad"]],["इह","iha","here","इह","iha","अव्यय","avyaya","indeclinable",["iha"]],["नाना","nānā","difference","नाना","nānā","अव्यय","avyaya","indeclinable",["nānā"]],["इव","iva","as it were","इव","iva","अव्यय","avyaya","indeclinable",["iva"]],["पश्यति","paśyati","sees","दृश्","dṛś","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["dṛś"]]],"t":"“What is here, that is there; what is there, that again is here. He goes from death to death who sees here any seeming difference.”","notes":["Śaṅkara: this removes the doubt that the self in beings, from Brahmā down to plants, is other than the supreme Brahman. ‘Here’: joined to the adjuncts of body and organs, and appearing to the undiscerning to have the properties of the cycle of birth and death. ‘There’: established in itself, by nature unbroken consciousness. One who thinks ‘I am other than the supreme, and Brahman is other than I’ comes to birth and death again and again."],"by":null,"var":[],"x":false},{"n":"2.1.11","label":null,"d":"मनसैवेदमाप्तव्यं नेह नानास्ति किंचन ।\nमृत्योः स मृत्युं गच्छति य इह नानेव पश्यति ॥ ११ ॥","i":"manasaivedam āptavyaṃ neha nānāsti kiṃcana |\nmṛtyoḥ sa mṛtyuṃ gacchati ya iha nāneva paśyati || 11 ||","pd":"मनसा एव इदम् आप्तव्यम् न इह नाना अस्ति किंचन मृत्योः सः मृत्युम् गच्छति यः इह नाना इव पश्यति","pi":"manasā eva idam āptavyam na iha nānā asti kiṃcana mṛtyoḥ saḥ mṛtyum gacchati yaḥ iha nānā iva paśyati","w":[["मनसा","manasā","by the mind","मनस्","manas","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. s up difference is gone, and not the least trace of difference remains in Brahman."],"by":null,"var":[],"x":false},{"n":"2.1.12","label":null,"d":"अङ्गुष्ठमात्रः पुरुषो मध्य आत्मनि तिष्ठति ।\nईशानो भूतभव्यस्य न ततो विजुगुप्सते ।\nएतद्वै तत् ॥ १२ ॥","i":"aṅguṣṭhamātraḥ puruṣo madhya ātmani tiṣṭhati |\nīśāno bhūtabhavyasya na tato vijugupsate |\netad vai tat || 12 ||","pd":"अङ्गुष्ठ-मात्रः पुरुषः मध्ये आत्मनि तिष्ठति ईशानः भूत-भव्यस्य न ततः विजुगुप्सते एतत् वै तत्","pi":"aṅguṣṭha-mātraḥ puruṣaḥ madhye ātmani tiṣṭhati īśānaḥ bhūta-bhavyasya na tataḥ vijugupsate etat vai tat","w":[["अङ्गुष्ठ-मात्रः","aṅguṣṭha-mātraḥ","the size of a thumb","अङ्गुष्ठमात्र","aṅguṣṭhamātra","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["aṅguṣṭhamātra"]],["पुरुषः","puruṣaḥ","the Person","पुरुष","puruṣa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["puruṣa"]],["मध्ये","madhye","in the middle","मध्य","madhya","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg.",["madhya"]],["आत्मनि","ātmani","of the body","आत्मन्","ātman","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["ātman"]],["तिष्ठति","tiṣṭhati","dwells","स्था","sthā","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["sthā"]],["ईशानः","īśānaḥ","the lord","ईशान","īśāna","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["īśāna"]],["भूत-भव्यस्य","bhūta-bhavyasya","of what has been and what is to be","भूतभव्य","bhūtabhavya","षष्ठी, नपुं, एक","ṣaṣṭhī, napuṃ, eka","n. gen. sg.",["bhūtabhavya"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["ततः","tataḥ","thereafter","ततस्","tatas","अव्यय","avyaya","indeclinable",["tatas"]],["विजुगुप्सते","vijugupsate","seeks to protect himself","वि-गुप्","vi-gup","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vigup"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["etad"]],["वै","vai","indeed","वै","vai","अव्यय","avyaya","indeclinable",["vai"]],["तत्","tat","is that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]]],"t":"“The Person, the size of a thumb, dwells in the middle of the body, the lord of what has been and what is to be. Knowing him, one no longer seeks to protect oneself. This indeed is that.”","notes":["Śaṅkara: the lotus of the heart is the size of a thumb; limited by the inner organ that lies in its hollow, the Self is called ‘the size of a thumb’, like the space inside a thumb-length joint of bamboo. puruṣa: by him all this is filled. ātmani here means ‘in the body’.","Śaṅkara: etad vai tat: this is that which Naciketas asked about, which even the gods doubted, which is other than righteousness and the rest: the highest state of Viṣṇu, beyond which there is nothing."],"by":null,"var":[],"x":false},{"n":"2.1.13","label":null,"d":"अङ्गुष्ठमात्रः पुरुषो ज्योतिरिव अधूमकः ।\nईशानो भूतभव्यस्य स एवाद्य स उ श्वः ।\nएतद्वै तत् ॥ १३ ॥","i":"aṅguṣṭhamātraḥ puruṣo jyotir iva adhūmakaḥ |\nīśāno bhūtabhavyasya sa evādya sa u śvaḥ |\netad vai tat || 13 ||","pd":"अङ्गुष्ठ-मात्रः पुरुषः ज्योतिः इव अधूमकः ईशानः भूत-भव्यस्य सः एव अद्य सः उ श्वः एतत् वै तत्","pi":"aṅguṣṭha-mātraḥ puruṣaḥ jyotiḥ iva adhūmakaḥ īśānaḥ bhūta-bhavyasya saḥ eva adya saḥ u śvaḥ etat vai tat","w":[["अङ्गुष्ठ-मात्रः","aṅguṣṭha-mātraḥ","the size of a thumb","अङ्गुष्ठमात्र","aṅguṣṭhamātra","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["aṅguṣṭhamātra"]],["पुरुषः","puruṣaḥ","the Person","पुरुष","puruṣa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["puruṣa"]],["ज्योतिः","jyotiḥ","a flame","ज्योतिस्","jyotis","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["jyotis"]],["इव","iva","like","इव","iva","अव्यय","avyaya","indeclinable",["iva"]],["अधूमकः","adhūmakaḥ","without smoke","अधूमक","adhūmaka","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["adhūmaka"]],["ईशानः","īśānaḥ","the lord","ईशान","īśāna","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["īśāna"]],["भूत-भव्यस्य","bhūta-bhavyasya","of what has been and what is to be","भूतभव्य","bhūtabhavya","षष्ठी, नपुं, एक","ṣaṣṭhī, napuṃ, eka","n. gen. sg.",["bhūtabhavya"]],["सः","saḥ","he","तद्","tad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["tad"]],["एव","eva","alone","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["अद्य","adya","today","अद्य","adya","अव्यय","avyaya","indeclinable",["adya"]],["सः","saḥ","he","तद्","tad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["tad"]],["उ","u","also","उ","u","अव्यय","avyaya","indeclinable",["u"]],["श्वः","śvaḥ","tomorrow","श्वस्","śvas","अव्यय","avyaya","indeclinable",["śvas"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["etad"]],["वै","vai","indeed","वै","vai","अव्यय","avyaya","indeclinable",["vai"]],["तत्","tat","is that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]]],"t":"“The Person, the size of a thumb, is like a flame without smoke, the lord of what has been and what is to be. He alone is today, and he will be tomorrow. This indeed is that.”","notes":["Śaṅkara: the one thus perceived in the heart by yogīs is eternal and unchanging: present in beings now, he will be so tomorrow, and no other like him will be born. In its own words the Upaniṣad here sets aside the view ‘he does not exist’ (1.1.20), and also the doctrine that everything is momentary.","Śaṅkara: etad vai tat: this is that which Naciketas asked about, which even the gods doubted, which is other than righteousness and the rest: the highest state of Viṣṇu, beyond which there is nothing."],"by":null,"var":[],"x":false},{"n":"2.1.14","label":null,"d":"यथोदकं दुर्गे वृष्टं पर्वतेषु विधावति ।\nएवं धर्मान्पृथक्पश्यंस्तानेवानु विधावति ॥ १४ ॥","i":"yathodakaṃ durge vṛṣṭaṃ parvateṣu vidhāvati |\nevaṃ dharmān pṛthak paśyaṃs tān evānu vidhāvati || 14 ||","pd":"यथा उदकम् दुर्गे वृष्टम् पर्वतेषु विधावति एवम् धर्मान् पृथक् पश्यन् तान् एव अनु विधावति","pi":"yathā udakam durge vṛṣṭam parvateṣu vidhāvati evam dharmān pṛthak paśyan tān eva anu vidhāvati","w":[["यथा","yathā","as","यथा","yathā","अव्यय","avyaya","indeclinable",["yathā"]],["उदकम्","udakam","water","उदक","udaka","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["udaka"]],["दुर्गे","durge","on a height hard to reach","दुर्ग","durga","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg.",["durga"]],["वृष्टम्","vṛṣṭam","rained","वृष्","vṛṣ","क्त, प्रथमा, नपुं, एक","kta, prathamā, napuṃ, eka","past passive participle n. nom. sg.",["vṛṣ"]],["पर्वतेषु","parvateṣu","among the hills","पर्वत","parvata","सप्तमी, पुं, बहु","saptamī, puṃ, bahu","m. loc. pl.",["parvata"]],["विधावति","vidhāvati","runs off","वि-धाव्","vi-dhāv","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vidhāv"]],["एवम्","evam","so","एवम्","evam","अव्यय","avyaya","indeclinable",["evam"]],["धर्मान्","dharmān","the selves","धर्म","dharma","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["dharma"]],["पृथक्","pṛthak","as separate","पृथक्","pṛthak","अव्यय","avyaya","indeclinable",["pṛthak"]],["पश्यन्","paśyan","one who sees","दृश्","dṛś","शतृ।शानच्, प्रथमा, पुं, एक","śatṛ/śānac, prathamā, puṃ, eka","present participle m. nom. sg.",["dṛś"]],["तान्","tān","them","तद्","tad","सर्वनाम, द्वितीया, पुं, बहु","sarvanāma, dvitīyā, puṃ, bahu","pronoun m. acc. pl.",["tad"]],["एव","eva","alone","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["अनु","anu","(with vidhāvati)","अनु","anu","अव्यय","avyaya","indeclinable",["anu"]],["विधावति","vidhāvati","runs after","वि-धाव्","vi-dhāv","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vidhāv"]]],"t":"“As water rained on a height runs off among the hills and is lost, so one who sees the selves as separate runs after them alone.”","notes":["anu … vidhāvati is one verb (anuvidhāvati), its parts separated in the verse.","Śaṅkara: the dharmas here are selves, which are not different from the Self; one who sees them as separate in each body keeps taking on one separate body after another. The water, scattered over the low ground, is lost."],"by":null,"var":[],"x":false},{"n":"2.1.15","label":null,"d":"यथोदकं शुद्धे शुद्धमासिक्तं तादृगेव भवति ।\nएवं मुनेर्विजानत आत्मा भवति गौतम ॥ १५ ॥","i":"yathodakaṃ śuddhe śuddham āsiktaṃ tādṛg eva bhavati |\nevaṃ muner vijānata ātmā bhavati gautama || 15 ||","pd":"यथा उदकम् शुद्धे शुद्धम् आसिक्तम् तादृक् एव भवति एवम् मुनेः विजानतः आत्मा भवति गौतम","pi":"yathā udakam śuddhe śuddham āsiktam tādṛk eva bhavati evam muneḥ vijānataḥ ātmā bhavati gautama","w":[["यथा","yathā","as","यथा","yathā","अव्यय","avyaya","indeclinable",["yathā"]],["उदकम्","udakam","water","उदक","udaka","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["udaka"]],["शुद्धे","śuddhe","into pure (water)","शुद्ध","śuddha","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg.",["śuddha"]],["शुद्धम्","śuddham","pure","शुद्ध","śuddha","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["śuddha"]],["आसिक्तम्","āsiktam","poured","आ-सिच्","ā-sic","क्त, प्रथमा, नपुं, एक","kta, prathamā, napuṃ, eka","past passive participle n. nom. sg.",["āsic"]],["तादृक्","tādṛk","just such","तादृश्","tādṛś","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["tādṛś"]],["एव","eva","indeed","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["भवति","bhavati","becomes","भू","bhū","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["bhū"]],["एवम्","evam","so","एवम्","evam","अव्यय","avyaya","indeclinable",["evam"]],["मुनेः","muneḥ","of the sage","मुनि","muni","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["muni"]],["विजानतः","vijānataḥ","who knows","वि-ज्ञा","vi-jñā","शतृ।शानच्, षष्ठी, पुं, एक","śatṛ/śānac, ṣaṣṭhī, puṃ, eka","present participle m. gen. sg.",["vijñā"]],["आत्मा","ātmā","the Self","आत्मन्","ātman","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["ātman"]],["भवति","bhavati","becomes","भू","bhū","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["bhū"]],["गौतम","gautama","O Gautama","गौतम","gautama","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["gautama"]]],"t":"“As pure water poured into pure water becomes just the same, so becomes the Self of the sage who knows, O Gautama.”","notes":["Śaṅkara: for the sage, the reflective one, who has cast off the seeing of difference made by adjuncts and knows the oneness of the Self, the Self is of one nature only. Therefore the vision of oneness taught by the Veda, a better friend than a thousand mothers and fathers, is to be honoured."],"by":null,"var":[],"x":false},{"n":"2.2.1","label":null,"d":"पुरमेकादशद्वारमजस्यावक्रचेतसः ।\nअनुष्ठाय न शोचति विमुक्तश्च विमुच्यते ।\nएतद्वै तत् ॥ १ ॥","i":"puram ekādaśadvāram ajasyāvakracetasaḥ |\nanuṣṭhāya na śocati vimuktaś ca vimucyate |\netad vai tat || 1 ||","pd":"पुरम् एकादश-द्वारम् अजस्य अ-वक्र-चेतसः अनुष्ठाय न शोचति विमुक्तः च विमुच्यते एतत् वै तत्","pi":"puram ekādaśa-dvāram ajasya a-vakra-cetasaḥ anuṣṭhāya na śocati vimuktaḥ ca vimucyate etat vai tat","w":[["पुरम्","puram","the city","पुर","pura","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["pura"]],["एकादश-द्वारम्","ekādaśa-dvāram","of eleven gates","एकादशद्वार","ekādaśadvāra","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["ekādaśadvāra"]],["अजस्य","ajasya","of the unborn","अज","aja","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["aja"]],["अ-वक्र-चेतसः","a-vakra-cetasaḥ","whose consciousness is unbent","अवक्रचेतस्","avakracetas","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["a","vakra","cetas"]],["अनुष्ठाय","anuṣṭhāya","having meditated on (its lord)","अनु-स्था","anu-sthā","ल्यप्","lyap","absolutive",[]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["शोचति","śocati","one grieves","शुच्","śuc","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["śuc"]],["विमुक्तः","vimuktaḥ","freed","वि-मुच्","vi-muc","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg.",["vimuc"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["विमुच्यते","vimucyate","is set free","वि-मुच्","vi-muc","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["vimuc"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["etad"]],["वै","vai","indeed","वै","vai","अव्यय","avyaya","indeclinable",["vai"]],["तत्","tat","is that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]]],"t":"“There is a city of eleven gates, belonging to the unborn one whose consciousness never bends. Meditating on its lord, one does not grieve; and, already freed, one is set free. This indeed is that.”","notes":["Śaṅkara: the city is the body, which like a city has gatekeepers, rulers and much equipment, and exists for a master who is no part of it. The eleven gates are the seven in the head, three below including the navel, and one at the crown. avakracetas: whose consciousness, like the light of the sun, is always the same. anuṣṭhāya: having meditated on the supreme Lord, the master of the city. ‘Freed’ here and now from the bonds of desire and action made by ignorance, he is ‘set free’: he takes no further body."],"by":null,"var":[],"x":false},{"n":"2.2.2","label":null,"d":"हंसः शुचिषद्वसुरन्तरिक्षसद्धोता वेदिषदतिथिर्दुरोणसत् ।\nनृषद्वरसदृतसद्व्योमसदब्जा गोजा ऋतजा अद्रिजा ऋतं बृहत् ॥ २ ॥","i":"haṃsaḥ śuciṣad vasur antarikṣasad dhotā vediṣad atithir duroṇasat |\nnṛṣad varasad ṛtasad vyomasad abjā gojā ṛtajā adrijā ṛtaṃ bṛhat || 2 ||","pd":"हंसः शुचिषत् वसुः अन्तरिक्ष-सत् होता वेदिषत् अतिथिः दुरोण-सत् नृषत् वर-सत् ऋत-सत् व्योम-सत् अप्-जाः गो-जाः ऋत-जाः अद्रि-जाः ऋतम् बृहत्","pi":"haṃsaḥ śuciṣat vasuḥ antarikṣa-sat hotā vediṣat atithiḥ duroṇa-sat nṛṣat vara-sat ṛta-sat vyoma-sat ap-jāḥ go-jāḥ ṛta-jāḥ adri-jāḥ ṛtam bṛhat","w":[["हंसः","haṃsaḥ","the mover (the sun)","हंस","haṃsa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["haṃsa"]],["शुचिषत्","śuciṣat","dwelling in the bright sky","शुचिषद्","śuciṣad","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["śuciṣad"]],["वसुः","vasuḥ","the one who gives all a dwelling (air)","वसु","vasu","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vasu"]],["अन्तरिक्ष-सत्","antarikṣa-sat","dwelling in the mid-region","अन्तरिक्षसद्","antarikṣasad","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["antarikṣasad"]],["होता","hotā","the fire","होतृ","hotṛ","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["hotṛ"]],["वेदिषत्","vediṣat","dwelling on the altar (the earth)","वेदिषद्","vediṣad","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vediṣad"]],["अतिथिः","atithiḥ","the guest","अतिथि","atithi","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["atithi"]],["दुरोण-सत्","duroṇa-sat","dwelling in the jar, or in houses","दुरोणसद्","duroṇasad","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["duroṇasad"]],["नृषत्","nṛṣat","dwelling in men","नृषद्","nṛṣad","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["nṛṣad"]],["वर-सत्","vara-sat","dwelling in the gods","वरसद्","varasad","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["varasad"]],["ऋत-सत्","ṛta-sat","dwelling in truth","ऋतसद्","ṛtasad","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["ṛtasad"]],["व्योम-सत्","vyoma-sat","dwelling in space","व्योमसद्","vyomasad","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vyomasad"]],["अप्-जाः","ap-jāḥ","born in the waters","अब्जा","abjā","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["abjā"]],["गो-जाः","go-jāḥ","born on the earth","गोजा","gojā","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["gojā"]],["ऋत-जाः","ṛta-jāḥ","born in the sacrifice","ऋतजा","ṛtajā","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["ṛtajā"]],["अद्रि-जाः","adri-jāḥ","born from the mountains","अद्रिजा","adrijā","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["adrijā"]],["ऋतम्","ṛtam","the true","ऋत","ṛta","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["ṛta"]],["बृहत्","bṛhat","the great","बृहत्","bṛhat","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["bṛhat"]]],"t":"“He is the sun dwelling in the bright sky, the air dwelling in the mid-region, the fire dwelling on the altar of the earth, the guest dwelling in the house. He dwells in men, in the gods, in truth, in space. He is born in the waters, on the earth, in the sacrifice, from the mountains. He is the true, the great.”","notes":["Śaṅkara: the Self dwells not in the city of one body only but in all. haṃsa, ‘the one who goes’: the sun; vasu, ‘he who gives all a dwelling’: air; hotṛ: fire; the altar is the earth. atithi: Soma in the jar, or a brahmin guest in houses. vara: the gods. abjā: as conch, pearl-oyster and sea creatures; gojā: as rice and barley; ṛtajā: as the parts of the sacrifice; adrijā: as rivers. Though the Self of all, it is ṛta, of unfailing nature, and great as the cause of all. The one all-pervading Self is the Self of the world: there is no division in it."],"by":null,"var":[],"x":false},{"n":"2.2.3","label":null,"d":"ऊर्ध्वं प्राणमुन्नयति अपानं प्रत्यगस्यति ।\nमध्ये वामनमासीनं विश्वे देवा उपासते ॥ ३ ॥","i":"ūrdhvaṃ prāṇam unnayati apānaṃ pratyag asyati |\nmadhye vāmanam āsīnaṃ viśve devā upāsate || 3 ||","pd":"ऊर्ध्वम् प्राणम् उन्नयति अपानम् प्रत्यक् अस्यति मध्ये वामनम् आसीनम् विश्वे देवाः उपासते","pi":"ūrdhvam prāṇam unnayati apānam pratyak asyati madhye vāmanam āsīnam viśve devāḥ upāsate","w":[["ऊर्ध्वम्","ūrdhvam","upward","ऊर्ध्वम्","ūrdhvam","अव्यय","avyaya","indeclinable",["ūrdhvam"]],["प्राणम्","prāṇam","the out-breath","प्राण","prāṇa","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["prāṇa"]],["उन्नयति","unnayati","leads up","उत्-नी","ut-nī","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",[]],["अपानम्","apānam","the in-breath","अपान","apāna","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["apāna"]],["प्रत्यक्","pratyak","downward","प्रत्यञ्च्","pratyañc","अव्यय","avyaya","indeclinable",["pratyañc"]],["अस्यति","asyati","casts","अस्","as","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["as"]],["मध्ये","madhye","in the middle","मध्य","madhya","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg.",["madhya"]],["वामनम्","vāmanam","the adorable one","वामन","vāmana","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["vāmana"]],["आसीनम्","āsīnam","seated","आस्","ās","शतृ।शानच्, द्वितीया, पुं, एक","śatṛ/śānac, dvitīyā, puṃ, eka","present participle m. acc. sg.",["ās"]],["विश्वे","viśve","all","विश्व","viśva","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["viśva"]],["देवाः","devāḥ","the gods (senses)","देव","deva","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["deva"]],["उपासते","upāsate","wait upon","उप-आस्","upa-ās","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["upās"]]],"t":"“He leads the out-breath upward and casts the in-breath downward. Him, the adorable one seated in the middle, all the gods wait upon.”","notes":["Śaṅkara: this gives a mark by which the Self may be known. ‘In the middle’: in the space of the lotus of the heart. vāmana: the one to be adored (vananīya). The gods are the eye and the other senses, which bring him the perceptions of form and the rest as subjects bring tribute to a king. He for whose sake all the workings of breath and senses go on is thereby shown to be other than they."],"by":null,"var":[],"x":false},{"n":"2.2.4","label":null,"d":"अस्य विस्रंसमानस्य शरीरस्थस्य देहिनः ।\nदेहाद्विमुच्यमानस्य किमत्र परिशिष्यते ।\nएतद्वै तत् ॥ ४ ॥","i":"asya visraṃsamānasya śarīrasthasya dehinaḥ |\ndehād vimucyamānasya kim atra pariśiṣyate |\netad vai tat || 4 ||","pd":"अस्य विस्रंसमानस्य शरीर-स्थस्य देहिनः देहात् विमुच्यमानस्य किम् अत्र परिशिष्यते एतत् वै तत्","pi":"asya visraṃsamānasya śarīra-sthasya dehinaḥ dehāt vimucyamānasya kim atra pariśiṣyate etat vai tat","w":[["अस्य","asya","of this","इदम्","idam","सर्वनाम, षष्ठी, पुं, एक","sarvanāma, ṣaṣṭhī, puṃ, eka","pronoun m. gen. sg.",["idam"]],["विस्रंसमानस्य","visraṃsamānasya","slipping away","वि-स्रंस्","vi-sraṃs","शतृ।शानच्, षष्ठी, पुं, एक","śatṛ/śānac, ṣaṣṭhī, puṃ, eka","present participle m. gen. sg.",["visraṃs"]],["शरीर-स्थस्य","śarīra-sthasya","dwelling in the body","शरीरस्थ","śarīrastha","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["śarīrastha"]],["देहिनः","dehinaḥ","embodied one","देहिन्","dehin","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["dehin"]],["देहात्","dehāt","from the body","देह","deha","पञ्चमी, पुं, एक","pañcamī, puṃ, eka","m. abl. sg.",["deha"]],["विमुच्यमानस्य","vimucyamānasya","being released","वि-मुच्","vi-muc","शतृ।शानच्, षष्ठी, पुं, एक","śatṛ/śānac, ṣaṣṭhī, puṃ, eka","present participle m. gen. sg.",["vimuc"]],["किम्","kim","what","किम्","kim","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["kim"]],["अत्र","atra","here","अत्र","atra","अव्यय","avyaya","indeclinable",["atra"]],["परिशिष्यते","pariśiṣyate","remains","परि-शिष्","pari-śiṣ","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["pariśiṣ"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["etad"]],["वै","vai","indeed","वै","vai","अव्यय","avyaya","indeclinable",["vai"]],["तत्","tat","is that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]]],"t":"“When this embodied one who dwells in the body slips away and is released from the body, what remains here? This indeed is that.”","notes":["Śaṅkara: nothing remains of the whole group of breaths and organs; all of it loses its strength in a moment, as the townspeople do when the master of the city has gone. That whose departure brings this about is the Self, shown to be other than they."],"by":null,"var":[],"x":false},{"n":"2.2.5","label":null,"d":"न प्राणेन नापानेन मर्त्यो जीवति कश्चन ।\nइतरेण तु जीवन्ति यस्मिन्न the cause of life. All live by that which is other than the combination, the Self."],"by":null,"var":[],"x":false},{"n":"2.2.6","label":null,"d":"हन्त त इदं प्रवक्ष्यामि गुह्यं ब्रह्म सनातनम् ।\nयथा च मरणं प्राप्य आत्मा भवति गौतम ॥ ६ ॥","i":"hanta ta idaṃ pravakṣyāmi guhyaṃ brahma sanātanam |\nyathā ca maraṇaṃ prāpya ātmā bhavati gautama || 6 ||","pd":"हन्त ते इदम् प्रवक्ष्यामि गुह्यम् ब्रह्म सनातनम् यथा च मरणम् प्राप्य आत्मा भवति गौतम","pi":"hanta te idam pravakṣyāmi guhyam brahma sanātanam yathā ca maraṇam prāpya ātmā bhavati gautama","w":[["हन्त","hanta","come","हन्त","hanta","अव्यय","avyaya","indeclinable",["hanta"]],["ते","te","to you","युष्मद्","yuṣmad","सर्वनाम, चतुर्थी, एक","sarvanāma, caturthī, eka","pronoun dat. sg.",["yuṣmad"]],["इदम्","idam","this","इदम्","idam","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["idam"]],["प्रवक्ष्यामि","pravakṣyāmi","I shall declare","प्र-वच्","pra-vac","लृट्, उत्तम, एक","lṛṭ, uttama, eka","future 1st sg.",["pravac"]],["गुह्यम्","guhyam","secret","गुह्य","guhya","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["guhya"]],["ब्रह्म","brahma","Brahman","ब्रह्मन्","brahman","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["brahman"]],["सनातनम्","sanātanam","eternal","सनातन","sanātana","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["sanātana"]],["यथा","yathā","how","यथा","yathā","अव्यय","avyaya","indeclinable",["yathā"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["मरणम्","maraṇam","death","मरण","maraṇa","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["maraṇa"]],["प्राप्य","prāpya","having met","प्र-आप्","pra-āp","ल्यप्","lyap","absolutive",["prāp"]],["आत्मा","ātmā","the self","आत्मन्","ātman","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["ātman"]],["भवति","bhavati","fares","भू","bhū","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["bhū"]],["गौतम","gautama","O Gautama","गौतम","gautama","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["gautama"]]],"t":"“Come, I shall declare to you this secret, eternal Brahman, and also how the self fares on meeting death, O Gautama.”","notes":["Śaṅkara: by knowing it the whole cycle of birth and death comes to an end; and hear how the self of one who does not know it passes on after death."],"by":null,"var":[],"x":false},{"n":"2.2.7","label":null,"d":"योनिमन्ये प्रपद्यन्ते शरीरत्वाय देहिनः ।\nस्थाणुमन्येऽनुसंयन्ति यथाकर्म यथाश्रुतम् ॥ ७ ॥","i":"yonim anye prapadyante śarīratvāya dehinaḥ |\nsthāṇum anye 'nusaṃyanti yathākarma yathāśrutam || 7 ||","pd":"योनिम् अन्ये प्रपद्यन्ते शरीर-त्वाय देहिनः स्थाणुम् अन्ये अनुसंयन्ति यथाकर्म यथाश्रुतम्","pi":"yonim anye prapadyante śarīra-tvāya dehinaḥ sthāṇum anye anusaṃyanti yathākarma yathāśrutam","w":[["योनिम्","yonim","a womb","योनि","yoni","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["yoni"]],["अन्ये","anye","some","अन्य","anya","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["anya"]],["प्रपद्यन्ते","prapadyante","enter","प्र-पद्","pra-pad","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["prapad"]],["शरीर-त्वाय","śarīra-tvāya","to take a body","शरीरत्व","śarīratva","चतुर्थी, नपुं, एक","caturthī, napuṃ, eka","n. dat. sg.",["śarīratva"]],["देहिनः","dehinaḥ","embodied ones","देहिन्","dehin","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["dehin"]],["स्थाणुम्","sthāṇum","the motionless state","स्थाणु","sthāṇu","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["sthāṇu"]],["अन्ये","anye","others","अन्य","anya","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["anya"]],["अनुसंयन्ति","anusaṃyanti","pass into","अनु-सम्-इ","anu-sam-i","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["anusami"]],["यथाकर्म","yathākarma","according to their action","यथाकर्म","yathākarma","अव्यय","avyaya","indeclinable",["yathākarma"]],["यथाश्रुतम्","yathāśrutam","according to their knowledge","यथाश्रुतम्"," ure, like space."],"by":null,"var":[],"x":false},{"n":"2.2.10","label":null,"d":"वायुर्यथैको भुवनं प्रविष्टो रूपं रूपं प्रतिरूपो बभूव ।\nएकस्तथा सर्वभूतान्तरात्मा रूपं रूपं प्रतिरूपो बहिश्च ॥ १० ॥","i":"vāyur yathaiko bhuvanaṃ praviṣṭo rūpaṃ rūpaṃ pratirūpo babhūva |\nekas tathā sarvabhūtāntarātmā rūpaṃ rūpaṃ pratirūpo bahiś ca || 10 ||","pd":"वायुः यथा एकः भुवनम् प्रविष्टः रूपम् रूपम् प्रतिरूपः बभूव एकः तथा सर्व-भूत-अन्तरात्मा रूपम् रूपम् प्रतिरूपः बहिः च","pi":"vāyuḥ yathā ekaḥ bhuvanam praviṣṭaḥ rūpam rūpam pratirūpaḥ babhūva ekaḥ tathā sarva-bhūta-antarātmā rūpam rūpam pratirūpaḥ bahiḥ ca","w":[["वायुः","vāyuḥ","air","वायु","vāyu","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vāyu"]],["यथा","yathā","as","यथा","yathā","अव्यय","avyaya","indeclinable",["yathā"]],["एकः","ekaḥ","the one","एक","eka","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["eka"]],["भुवनम्","bhuvanam","the world","भुवन","bhuvana","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["bhuvana"]],["प्रविष्टः","praviṣṭaḥ","having entered","प्र-विश्","pra-viś","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg.",["praviś"]],["रूपम्","rūpam","form","रूप","rūpa","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["rūpa"]],["रूपम्","rūpam","after form","रूप","rūpa","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["rūpa"]],["प्रतिरूपः","pratirūpaḥ","of matching form","प्रतिरूप","pratirūpa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["pratirūpa"]],["बभूव","babhūva","has become","भू","bhū","लिट्, प्रथम, एक","liṭ, prathama, eka","perfect 3rd sg.",["bhū"]],["एकः","ekaḥ","the one","एक","eka","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["eka"]],["तथा","tathā","so","तथा","tathā","अव्यय","avyaya","indeclinable",["tathā"]],["सर्व-भूत-अन्तरात्मा","sarva-bhūta-antarātmā","the inner Self of all beings","सर्वभूतान्तरात्मन्","sarvabhūtāntarātman","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["sarvabhūtāntarātman"]],["रूपम्","rūpam","form","रूप","rūpa","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["rūpa"]],["रूपम्","rūpam","after form","रूप","rūpa","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["rūpa"]],["प्रतिरूपः","pratirūpaḥ","of matching form","प्रतिरूप","pratirūpa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["pratirūpa"]],["बहिः","bahiḥ","outside","बहिस्","bahis","अव्यय","avyaya","indeclinable",["bahis"]],["च","ca","and also","च","ca","अव्यय","avyaya","indeclinable",["ca"]]],"t":"“As the one air, having entered the world, takes a form to match each form it meets, so the one inner Self of all beings takes a form to match each form; and it is outside them too.”","notes":["Śaṅkara: a second illustration: air enters bodies as the life-breath."],"by":null,"var":[],"x":false},{"n":"2.2.11","label":null,"d":"सूर्यो यथा सर्वलोकस्य चक्षुर्न लिप्यते चाक्षुषैर्बाह्यदोषैः ।\nएकस्तथा सर्वभूतान्तरात्मा न लिप्यते लोकदुःखेन बाह्यः ॥ ११ ॥","i":"sūryo yathā sarvalokasya cakṣur na lipyate cākṣuṣair bāhyadoṣaiḥ |\nekas tathā sarvabhūtāntarātmā na lipyate lokaduḥkhena bāhyaḥ || 11 ||","pd":"सूर्यः यथा सर्व-लोकस्य चक्षुः न लिप्यते चाक्षुषैः बाह्य-दोषैः एकः तथा सर्व-भूत-अन्तरात्मा न लिप्यते लोक-दुःखेन बाह्यः","pi":"sūryaḥ yathā sarva-lokasya cakṣuḥ na lipyate cākṣuṣaiḥ bāhya-doṣaiḥ ekaḥ tathā sarva-bhūta-antarātmā na lipyate loka-duḥkhena bāhyaḥ","w":[["सूर्यः","sūryaḥ","the sun","सूर्य","sūrya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["sūrya"]],["यथा","yathā","as","यथा","yathā","अव्यय","avyaya","indeclinable",["yathā"]],["सर्व-लोकस्य","sarva-lokasya","of the whole world","सर्वलोक","sarvaloka","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["sarvaloka"]],["चक्षुः","cakṣuḥ","the eye","चक्षुस्","cakṣus","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["cakṣus"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["लिप्यते","lipyate","is stained","लिप्","lip","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["lip"]],["चाक्षुषैः","cākṣuṣaiḥ","of the eye","चाक्षुष","cākṣuṣa","तृतीया, पुं, बहु","tṛtīyā, puṃ, bahu","m. ins. pl.",["cākṣuṣa"]],["बाह्य-दोषैः","bāhya-doṣaiḥ","by outward faults","बाह्यदोष","bāhyadoṣa","तृतीया, पुं, बहु","tṛtīyā, puṃ, bahu","m. ins. pl.",["bāhya","doṣa"]],["एकः","ekaḥ","the one","एक","eka","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["eka"]],["तथा","tathā","so","तथा","tathā","अव्यय","avyaya","indeclinable",["tathā"]],["सर्व-भूत-अन्तरात्मा","sarva-bhūta-antarātmā","the inner Self of all beings","सर्वभूतान्तरात्मन्","sarvabhūtāntarātman","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["sarvabhūtāntarātman"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["लिप्यते","lipyate","is stained","लिप्","lip","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["lip"]],["लोक-दुःखेन","loka-duḥkhena","by the sorrow of the world","लोकदुःख","lokaduḥkha","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["loka","duḥkha"]],["बाह्यः","bāhyaḥ","being outside it","बाह्य","bāhya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["bāhya"]]],"t":"“As the sun, the eye of the whole world, is not stained by the outward faults that the eye sees, so the one inner Self of all beings is not stained by the sorrow of the world, for it stands outside it.”","notes":["Śaṅkara: this answers the objection that, if the one Self is the Self of all, the sorrow of worldly life must belong to the supreme itself. The sun lights up unclean things and is untouched by them. People suffer through ignorance laid upon the Self; that ignorance is not truly in it, just as the snake is not in the rope nor silver in mother-of-pearl."],"by":null,"var":[],"x":false},{"n":"2.2.12","label":null,"d":"एको वशी सर्वभूतान्तरात्मा एकं रूपं बहुधा यः करोति ।\nतमात्मस्थं येऽनुपश्यन्ति धीरास्तेषां सुखं शाश्वतं नेतरेषाम् ॥ १२ ॥","i":"eko vaśī sarvabhūtāntarātmā ekaṃ rūpaṃ bahudhā yaḥ karoti |\ntam ātmasthaṃ ye 'nupaśyanti dhīrās teṣāṃ sukhaṃ śāśvataṃ netareṣām || 12 ||","pd":"एकः वशी सर्व-भूत-अन्तरात्मा एकम् रूपम् बहुधा यः करोति तम् आत्म-स्थम् ये अनुपश्यन्ति धीराः तेषाम् सुखम् शाश्वतम् न इतरेषाम्","pi":"ekaḥ vaśī sarva-bhūta-antarātmā ekam rūpam bahudhā yaḥ karoti tam ātma-stham ye anupaśyanti dhīrāḥ teṣām sukham śāśvatam na itareṣām","w":[["एकः","ekaḥ","the one","एक","eka","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["eka"]],["वशी","vaśī","ruler","वशिन्","vaśin","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vaśin"]],["सर्व-भूत-अन्तरात्मा","sarva-bhūta-antarātmā","the inner Self of all beings","सर्वभूतान्तरात्मन्","sarvabhūtāntarātman","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["sarvabhūtāntarātman"]],["एकम्","ekam","one","एक","eka","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["eka"]],["रूपम्","rūpam","form","रूप","rūpa","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["rūpa"]],["बहुधा","bahudhā","manifold","बहुधा","bahudhā","अव्यय","avyaya","indeclinable",["bahudhā"]],["यः","yaḥ","who","यद्","yad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["yad"]],["करोति","karoti","makes","कृ","kṛ","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["kṛ"]],["तम्","tam","him","तद्","tad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["tad"]],["आत्म-स्थम्","ātma-stham","dwelling in oneself","आत्मस्थ","ātmastha","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["ātma","stha"]],["ये","ye","who","यद्","yad","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["yad"]],["अनुपश्यन्ति","anupaśyanti","perceive","अनु-दृश्","anu-dṛś","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["anudṛś"]],["धीराः","dhīrāḥ","the wise","धीर","dhīra","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["dhīra"]],["तेषाम्","teṣām","theirs","तद्","tad","सर्वनाम, षष्ठी, पुं, बहु","sarvanāma, ṣaṣṭhī, puṃ, bahu","pronoun m. gen. pl.",["tad"]],["सुखम्","sukham","happiness","सुख","sukha","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["sukha"]],["शाश्वतम्","śāśvatam","everlasting","शाश्वत","śāśvata","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["śāśvata"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["इतरेषाम्","itareṣām","of others","इतर","itara","सर्वनाम, षष्ठी, पुं, बहु","sarvanāma, ṣaṣṭhī, puṃ, bahu","pronoun m. gen. pl.",["itara"]]],"t":"“The one ruler, the inner Self of all beings, who makes his one form manifold: the wise who perceive him dwelling in themselves have everlasting happiness, and no others.”","notes":["Śaṅkara: he is the supreme Lord, free, with none equal or greater; the whole world is under his sway. By his mere being, through powers beyond thought, he makes the one pure consciousness many through the limiting adjuncts of name and form. ātmastha: shown as consciousness in the intellect, in the space of the heart; the body is not really his container, any more than a mirror contains the face. anu: after the teaching of teacher and scripture. The happiness is the bliss of the Self."],"by":null,"var":[],"x":false},{"n":"2.2.13","label":null,"d":"नित्योऽनित्यानां चेतनश्चेतनानामेको बहूनां यो विदधाति कामान् ।\nतमात्मस्थं येऽनुपश्यन्ति धीरास्तेषां शान्तिः शाश्वती नेतरेषाम् ॥ १३ ॥","i":"nityo 'nityānāṃ cetanaś cetanānām eko bahūnāṃ yo vidadhāti kāmān |\ntam ātmasthaṃ ye 'nupaśyanti dhīrās teṣāṃ śāntiḥ śāśvatī netareṣām || 13 ||","pd":"नित्यः अनित्यानाम् चेतनः चेतनानाम् एकः बहूनाम् यः विदधाति कामान् तम् आत्म-स्थम् ये अनुपश्यन्ति धीराः तेषाम् शान्तिः शाश्वती न इतरेषाम्","pi":"nityaḥ anityānām cetanaḥ cetanānām ekaḥ bahūnām yaḥ vidadhāti kāmān tam ātma-stham ye anupaśyanti dhīrāḥ teṣām śāntiḥ śāśvatī na itareṣām","w":[["नित्यः","nityaḥ","the eternal","नित्य","nitya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["nitya"]],["अनित्यानाम्"," रेषाम्","itareṣām","of others","इतर","itara","सर्वनाम, षष्ठी, पुं, बहु","sarvanāma, ṣaṣṭhī, puṃ, bahu","pronoun m. gen. pl.",["itara"]]],"t":"“The eternal among the non-eternal, the conscious among the conscious, the one who grants the desires of the many: the wise who perceive him dwelling in themselves have everlasting peace, and no others.”","notes":["Śaṅkara: other beings, from Brahmā down, are conscious only through the consciousness of the Self, as water burns only through fire. All-knowing and Lord of all, he gives those who desire the fruits of their actions, each according to his action. The peace is cessation, and it is their very Self."],"by":null,"var":[],"x":false},{"n":"2.2.14","label":null,"d":"तदेतदिति मन्यन्तेऽनिर्देश्यं परमं सुखम् ।\nकथं नु तद्विजानीयां किमु भाति विभाति वा ॥ १४ ॥","i":"tad etad iti manyante 'nirdeśyaṃ paramaṃ sukham |\nkathaṃ nu tad vijānīyāṃ kim u bhāti vibhāti vā || 14 ||","pd":"तत् एतत् इति मन्यन्ते अ-निर्देश्यम् परमम् सुखम् कथम् नु तत् विजानीयाम् किम् उ भाति विभाति वा","pi":"tat etat iti manyante a-nirdeśyam paramam sukham katham nu tat vijānīyām kim u bhāti vibhāti vā","w":[["तत्","tat","that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]],["एतत्","etat","is this","एतद्","etad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["etad"]],["इति","iti","thus","इति","iti","अव्यय","avyaya","indeclinable",["iti"]],["मन्यन्ते","manyante","they hold","मन्","man","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["man"]],["अ-निर्देश्यम्","a-nirdeśyam","indescribable","अनिर्देश्य","anirdeśya","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["anirdeśya"]],["परमम्","paramam","supreme","परम","parama","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["parama"]],["सुखम्","sukham","happiness","सुख","sukha","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["sukha"]],["कथम्","katham","how","कथम्","katham","अव्यय","avyaya","indeclinable",["katham"]],["नु","nu","then","नु","nu","अव्यय","avyaya","indeclinable",["nu"]],["तत्","tat","that","तद्","tad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["tad"]],["विजानीयाम्","vijānīyām","may I know","वि-ज्ञा","vi-jñā","विधिलिङ्, उत्तम, एक","vidhiliṅ, uttama, eka","optative 1st sg.",["vijñā"]],["किम्","kim","does","किम्","kim","अव्यय","avyaya","indeclinable",["kim"]],["उ","u","indeed","उ","u","अव्यय","avyaya","indeclinable",["u"]],["भाति","bhāti","it shine","भा","bhā","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["bhā"]],["विभाति","vibhāti","is it clearly seen","वि-भा","vi-bhā","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vibhā"]],["वा","vā","or","वा","vā","अव्यय","avyaya","indeclinable",["vā"]]],"t":"“‘That is this’: so they hold the indescribable, supreme happiness to be. How, then, may I know it? Does it shine of itself, and is it clearly seen, or not?”","notes":["Śaṅkara: the happiness of knowing the Self cannot be pointed out and lies beyond the speech and mind of ordinary men; yet those who have laid down all desires hold it to be directly present, ‘this’. The question is how one may make it an object of one's own understanding as they do: is it luminous, so that it is plainly seen by our understanding, or not?"],"by":null,"var":[],"x":false},{"n":"2.2.15","label":null,"d":"न तत्र सूर्यो भाति न चन्द्रतारकं नेमा विद्युतो भान्ति कुतोऽयमग्निः ।\nतमेव भान्तमनु भाति सर्वं तस्य भासा सर्वमिदं विभाति ॥ १५ ॥","i":"na tatra sūryo bhāti na candratārakaṃ nemā vidyuto bhānti kuto 'yam agniḥ |\ntam eva bhāntam anu bhāti sarvaṃ tasya bhāsā sarvam idaṃ vibhāti || 15 ||","pd":"न तत्र सूर्यः भाति न चन्द्र-तारकम् न इमाः विद्युतः भान्ति कुतः अयम् अग्निः तम् एव भान्तम् अनु भाति सर्वम् तस्य भासा सर्वम् इदम् विभाति","pi":"na tatra sūryaḥ bhāti na candra-tārakam na imāḥ vidyutaḥ bhānti kutaḥ ayam agniḥ tam eva bhāntam anu bhāti sarvam tasya bhāsā sarvam idam vibhāti","w":[["न","na","not","न","na","अव षष्ठी, पुं, एक","sarvanāma, ṣaṣṭhī, puṃ, eka","pronoun m. gen. sg.",["tad"]],["भासा","bhāsā","by the light","भास्","bhās","तृतीया, स्त्री, एक","tṛtīyā, strī, eka","f. ins. sg.",["bhās"]],["सर्वम्","sarvam","all","सर्व","sarva","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["sarva"]],["इदम्","idam","this","इदम्","idam","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["idam"]],["विभाति","vibhāti","shines","वि-भा","vi-bhā","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vibhā"]]],"t":"“There the sun does not shine, nor the moon and stars, nor do these lightnings shine; how then this fire? Everything shines only after him, as he shines; by his light all this shines.”","notes":["Śaṅkara: this is the answer: it both shines and is clearly seen. The sun, which lights up everything, does not light up Brahman, one's own Self. All else shines after it, as water or a firebrand burns only through contact with fire and not of itself. From the varied light found in its effects, the luminous nature of Brahman is known to be its own."],"by":null,"var":[],"x":false},{"n":"2.3.1","label":null,"d":"ऊर्ध्वमूलो अवाक्शाख एषोऽश्वत्थः सनातनः ।\nतदेव शुक्रं तद्ब्रह्म तदेवामृतमुच्यते ।\nतस्मिंल्लोकाः श्रिताः सर्वे तदु नात्येति कश्चन ।\nएतद्वै तत् ॥ १ ॥","i":"ūrdhvamūlo avākśākha eṣo 'śvatthaḥ sanātanaḥ |\ntad eva śukraṃ tad brahma tad evāmṛtam ucyate |\ntasmiṃllokāḥ śritāḥ sarve tad u nātyeti kaścana |\netad vai tat || 1 ||","pd":"ऊर्ध्व-मूलः अवाक्-शाखः एषः अश्वत्थः सनातनः तत् एव शुक्रम् तत् ब्रह्म तत् एव अमृतम् उच्यते तस्मिन् लोकाः श्रिताः सर्वे तत् उ न अत्येति कश्चन एतत् वै तत्","pi":"ūrdhva-mūlaḥ avāk-śākhaḥ eṣaḥ aśvatthaḥ sanātanaḥ tat eva śukram tat brahma tat eva amṛtam ucyate tasmin lokāḥ śritāḥ sarve tat u na atyeti kaścana etat vai tat","w":[["ऊर्ध्व-मूलः","ūrdhva-mūlaḥ","with its root above","ऊर्ध्वमूल","ūrdhvamūla","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["ūrdhvamūla"]],["अवाक्-शाखः","a
