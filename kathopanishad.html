<!DOCTYPE html>
<html lang="sa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaṭhopaniṣad · Vedic Space</title>
<script>try{var t=localStorage.getItem("vs-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Noto+Serif+Devanagari:wght@400;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2420; --soft:#6f655c; --faint:#a1968b; --line:#e7dfd4; --paper:#fdfaf5; --card:#fffdf9;
  --accent:#9a4a1c; --accent-soft:#f5e6d8; --on:#9a4a1c; --off:#d8cfc4;
  --deva:"Tiro Devanagari Sanskrit","Noto Serif Devanagari",serif;
  --latin:"Noto Serif",Georgia,serif;
}
/* dark palette: follows the device unless the reader picked a theme with the switch */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#ece4da;--soft:#b8ab9d;--faint:#85796d;--line:#3a332d;--paper:#1c1916;--card:#231f1b;
        --accent:#e09a6a;--accent-soft:#3a2a1f;--on:#e09a6a;--off:#4a423a;color-scheme:dark}
}
:root[data-theme="dark"]{--ink:#ece4da;--soft:#b8ab9d;--faint:#85796d;--line:#3a332d;--paper:#1c1916;--card:#231f1b;
  --accent:#e09a6a;--accent-soft:#3a2a1f;--on:#e09a6a;--off:#4a423a;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--latin);}
body{font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 64px}
header{text-align:center;padding:40px 0 18px}
header .deva-title{font-family:var(--deva);font-size:2.6rem;line-height:1.3;margin:0}
header .iast-title{font-style:italic;color:var(--soft);margin:4px 0 0;font-size:1.05rem}
header .en-title{margin:2px 0 0;font-size:.95rem;color:var(--soft)}
header .author{margin:10px 0 0;font-size:.9rem;color:var(--soft)}
.badge{display:inline-block;margin-top:12px;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.about{font-size:.88rem;color:var(--soft);text-align:center;max-width:620px;margin:10px auto 0}

/* ---- sticky Vedic Space toolbar; the display toggles merge into it once scrolled past */
.topbar{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--paper) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.3) blur(12px);backdrop-filter:saturate(1.3) blur(12px);
  border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s}
.topbar.scrolled{border-bottom-color:var(--line);box-shadow:0 1px 14px rgba(60,40,20,.05)}
.tb-in{max-width:820px;margin:0 auto;padding:0 20px;height:54px;display:flex;align-items:center;gap:16px}
.brand{display:inline-flex;align-items:center;gap:10px;transition:gap .35s ease;text-decoration:none;color:var(--ink);flex-shrink:0;border-radius:8px}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.brand img{width:32px;height:32px;display:block;transition:transform .3s ease}
.brand:hover img{transform:rotate(-6deg) scale(1.05)}
.brand-name{font-weight:600;font-size:1.02rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;
  max-width:140px;transition:max-width .35s ease,opacity .25s ease}
.topbar.merged .brand-name{max-width:0;opacity:0}
.topbar.merged .brand{gap:0}
.tb-slot{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:22px;
  overflow-x:auto;scrollbar-width:none;visibility:hidden;opacity:0;transform:translateY(-6px);
  transition:opacity .25s ease,transform .25s ease,visibility 0s linear .25s}
.tb-slot::-webkit-scrollbar{display:none}
.topbar.merged .tb-slot{visibility:visible;opacity:1;transform:none;margin-right:42px;
  transition:opacity .25s ease,transform .25s ease,visibility 0s}
.tb-slot .sw,.tb-slot .theme-btn{flex-shrink:0;white-space:nowrap}
@media (max-width:700px){.tb-slot{gap:12px}.topbar.merged .tb-slot{margin-right:0}}
.sw .ls{display:none}

/* ---- section picker: the current section's name sits quietly in the toolbar and follows the scroll;
        touched, it opens a list of the sections to jump to */
.sec-nav{position:relative;flex-shrink:0;min-width:0}
.sec-nav[hidden]{display:none}
.sec-cur{display:inline-flex;align-items:center;gap:5px;max-width:42vw;font-family:var(--deva);font-size:1.06rem;line-height:1.5;
  color:var(--accent);background:none;border:1px solid transparent;border-radius:999px;padding:1px 8px 1px 11px;cursor:pointer;
  transition:background .2s,border-color .2s}
.sec-cur span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a short tag for the larger division the section belongs to (अ॰ १ = adhyāya 1), before its name */
.sec-short{flex-shrink:0;font-size:.8em;color:var(--soft)}
.sec-short[hidden]{display:none}
.sec-short::after{content:"·";margin:0 1px 0 6px;color:var(--faint)}
.sec-item .sn .sec-short{font-size:.78em}
.sec-cur svg{width:13px;height:13px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  opacity:0;transition:opacity .2s,transform .2s}
.sec-cur:hover,.sec-cur:focus-visible,.sec-nav.open .sec-cur{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line));outline:0}
.sec-cur:hover svg,.sec-cur:focus-visible svg,.sec-nav.open .sec-cur svg{opacity:1}
.sec-nav.open .sec-cur svg{transform:rotate(180deg)}
.sec-menu{display:none;position:absolute;top:calc(100% + 10px);left:0;z-index:8;min-width:250px;max-width:min(340px,86vw);
  max-height:min(70vh,460px);overflow-y:auto;overscroll-behavior:contain;padding:6px;border:1px solid var(--line);border-radius:14px;
  background:var(--card);box-shadow:0 14px 36px rgba(60,40,20,.18)}
.sec-nav.open .sec-menu{display:block;animation:secIn .16s ease}
@keyframes secIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sec-item{display:block;width:100%;text-align:left;border:0;background:none;border-radius:9px;padding:7px 12px;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.sec-item .sn{display:block;font-family:var(--deva);font-size:1.08rem;line-height:1.4}
.sec-item .se{display:block;font-size:.74rem;color:var(--soft)}
.sec-item:hover,.sec-item:focus-visible{background:var(--accent-soft);outline:0}
.sec-item[aria-current="true"] .sn{color:var(--accent)}
.sec-item[aria-current="true"]{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
@media (max-width:560px){.sec-cur{font-size:.98rem;padding:1px 4px 1px 6px;max-width:46vw}.sec-cur svg{display:none}
  /* on a phone the list spans the screen under the toolbar, so it can never run off the edge */
  .sec-nav{position:static}
  .sec-menu{left:12px;right:12px;top:calc(100% + 6px);min-width:0;max-width:none}}
@media (prefers-reduced-motion:reduce){.sec-nav.open .sec-menu{animation:none}.sec-cur,.sec-cur svg{transition:none}}

/* ---- the text's name at the right of the toolbar, once its title has scrolled out of view (wide screens only) */
.tb-title{flex:0 1 auto;min-width:0;max-width:230px;margin-left:auto;font-family:var(--deva);font-size:1.04rem;color:var(--soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(-5px);
  transition:opacity .25s ease,transform .25s ease}
.topbar.past-title .tb-title{opacity:1;transform:none}
.topbar.merged .tb-slot{margin-right:0}
/* mid widths: make room for the name by using the short toggle labels (Pada, Words) and closer spacing */
@media (max-width:900px){.tb-title{max-width:150px;font-size:.98rem}
  .tb-slot{gap:12px}.tb-slot .sw .lf{display:none}.tb-slot .sw .ls{display:inline}}
@media (max-width:720px){.tb-title{display:none}}          /* no room beside the toggles on a narrow screen */
@media (prefers-reduced-motion:reduce){.tb-title{transition:none}}

/* ---- light/dark switch */
.theme-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--soft);
  display:inline-grid;place-items:center;cursor:pointer;padding:0;align-self:center;transition:color .2s,border-color .2s,background .2s}
.theme-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.theme-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-btn .i-sun{display:none}
.theme-btn[data-mode="dark"] .i-sun{display:block}
.theme-btn[data-mode="dark"] .i-moon{display:none}
.focus-btn .i-min{display:none}
.focus-btn[aria-pressed="true"] .i-min{display:block}
.focus-btn[aria-pressed="true"] .i-max{display:none}
.focus-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

/* ---- focus mode: one verse at a time, swipe or arrows to move */
.focus-meta{display:none}
.focus-nav{display:none}
/* keep the page from panning sideways while a verse slides in or a finger swipes */
html{overflow-x:hidden}
@supports (overflow:clip){html{overflow-x:clip}}
#verses{overflow-x:clip}
body.focus-mode{touch-action:pan-y pinch-zoom;overscroll-behavior-x:none}
html:has(body.focus-mode){overscroll-behavior-x:none}
body.focus-mode header,body.focus-mode .bar,body.focus-mode #credits,
body.focus-mode #verses .section,body.focus-mode .to-top{display:none}
body.focus-mode #verses .verse{display:none}
body.focus-mode #verses .verse.cur{display:block;border-bottom:0;padding:18px 0 120px;
  min-height:calc(100vh - 54px - 70px);min-height:calc(100dvh - 54px - 70px)}
body.focus-mode .focus-meta{display:block;text-align:center;margin:26px 0 0}
.focus-meta .fm-sec{font-family:var(--deva);font-size:1.05rem;color:var(--accent)}
.focus-meta .fm-n{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.verse.in-next{animation:vsInNext .32s ease}
.verse.in-prev{animation:vsInPrev .32s ease}
@keyframes vsInNext{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes vsInPrev{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
body.focus-mode .focus-nav{display:flex;position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:7;align-items:center;gap:6px;padding:5px;
  border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--card) 82%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 22px rgba(60,40,20,.12)}
.fn-btn{width:42px;height:42px;border-radius:50%;border:0;background:none;color:var(--accent);cursor:pointer;
  display:grid;place-items:center;padding:0;transition:background .2s,opacity .2s,transform .2s}
.fn-btn:hover:not(:disabled){background:var(--accent-soft)}
.fn-btn:active:not(:disabled){transform:scale(.94)}
.fn-btn:disabled{opacity:.3;cursor:default}
.fn-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fn-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fn-count{min-width:64px;text-align:center;font-size:.86rem;color:var(--soft);font-variant-numeric:tabular-nums}
.fn-mid{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:76px}
.fn-hint{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);opacity:.8;margin-top:2px;white-space:nowrap}
.fn-hint .h-keys{display:none;letter-spacing:.08em}
@media (hover:hover) and (pointer:fine){.fn-hint .h-touch{display:none}.fn-hint .h-keys{display:inline}}
@media (prefers-reduced-motion:reduce){.verse.in-next,.verse.in-prev{animation:none}}

.bar{border-bottom:1px solid var(--line);margin:18px -20px 0;padding:10px 20px;
  display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.bar .thanks-btn{display:none}            /* namaste lives in the merged toolbar; the bar has the text link below */
/* "Built on Pioneering Shoulders": a gratitude pill between the intro and the toggles */
.pioneer-row{display:flex;justify-content:center;margin:2px 0 4px}
body.focus-mode .pioneer-row{display:none}
body.no-thanks .pioneer-row,body.no-thanks [data-thanks]{display:none}
.pioneer{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:12px;padding:7px 18px 7px 7px;
  border-radius:999px;text-decoration:none;color:var(--ink);
  border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));
  background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 35%,var(--card)));
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 7%,transparent),0 10px 24px -16px color-mix(in srgb,var(--accent) 80%,transparent);
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.pioneer::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;pointer-events:none;
  background:linear-gradient(100deg,transparent,color-mix(in srgb,#fff 45%,transparent),transparent);
  transform:skewX(-18deg);animation:pnSheen 7s ease-in-out 1.2s infinite}
@keyframes pnSheen{0%{left:-60%}14%,100%{left:130%}}
.pn-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--accent);color:var(--paper);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--paper) 25%,transparent)}
.pn-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pn-tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
.pn-k{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.pn-t{font-size:.98rem;font-weight:600;letter-spacing:.01em;margin-top:2px}
.pn-go{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  flex-shrink:0;transition:transform .25s ease}
.pioneer:hover{transform:translateY(-1px);border-color:var(--accent);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 12%,transparent),0 14px 28px -16px color-mix(in srgb,var(--accent) 90%,transparent)}
.pioneer:hover .pn-go{transform:translateY(3px)}
.pioneer:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pn-t{white-space:nowrap}
@media (max-width:560px){.pioneer{gap:10px;padding:6px 14px 6px 6px}.pn-ic{width:30px;height:30px}
  .pn-ic svg{width:18px;height:18px}.pn-t{font-size:.9rem}}
@media (prefers-reduced-motion:reduce){.pioneer::after{animation:none;display:none}.pioneer,.pn-go{transition:none}}

/* ---- back-to-top */
.to-top{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:7;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);color:var(--accent);
  background:color-mix(in srgb,var(--card) 82%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 6px 22px rgba(60,40,20,.12);display:grid;place-items:center;cursor:pointer;padding:0;
  opacity:0;transform:translateY(12px) scale(.94);pointer-events:none;
  transition:opacity .3s ease,transform .3s ease,background .2s,box-shadow .2s}
.to-top.show{opacity:1;transform:none;pointer-events:auto}
.to-top:hover{background:var(--accent-soft);box-shadow:0 10px 26px rgba(60,40,20,.16);transform:translateY(-2px)}
.to-top:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.to-top svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){
  .topbar,.brand img,.brand-name,.tb-slot,.to-top{transition:none}
}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;color:var(--soft);cursor:pointer;
  user-select:none;background:none;border:0;padding:2px 0;font-family:inherit}
.sw .k{width:28px;height:16px;border-radius:999px;background:var(--off);position:relative;transition:background .15s}
.sw .k::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:#fff;transition:transform .15s}
.sw[aria-pressed="true"]{color:var(--ink)}
.sw[aria-pressed="true"] .k{background:var(--on)}
.sw[aria-pressed="true"] .k::after{transform:translateX(12px)}
.sw.mini{font-size:.76rem;gap:6px}
.sw.mini .k{width:22px;height:13px}
.sw.mini .k::after{width:9px;height:9px}
.sw.mini[aria-pressed="true"] .k::after{transform:translateX(9px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:.74rem}
.seg button{border:0;background:none;color:var(--faint);padding:1px 9px;cursor:pointer;font-family:inherit}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button.dv{font-family:var(--deva);font-size:.86rem}

.section{text-align:center;margin:44px 0 6px}
.section .sd{font-family:var(--deva);font-size:1.35rem;color:var(--accent)}
.section .si{font-size:.82rem;color:var(--soft);font-style:italic}
.section::after{content:"";display:block;width:60px;height:1px;background:var(--line);margin:12px auto 0}

.verse{padding:30px 0 26px;border-bottom:1px solid var(--line)}
.verse:last-child{border-bottom:0}
.vhead{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;min-height:1px}
.tag{font-size:.72rem;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.sa{font-family:var(--deva);font-size:1.62rem;line-height:1.75;text-align:center;white-space:pre-line}
.iast{font-style:italic;color:var(--soft);text-align:center;white-space:pre-line;margin-top:10px;font-size:1.02rem;line-height:1.6}
.blk{margin-top:22px}
.lbl{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.lbl .ctl{display:flex;align-items:center;gap:14px;text-transform:none;letter-spacing:0}
.pd-d{font-family:var(--deva);font-size:1.18rem;line-height:1.7}
.pd-i{font-style:italic;color:var(--soft);font-size:.95rem;margin-top:2px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.w{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.w .wd{font-family:var(--deva);font-size:1.15rem;line-height:1.4}
.w .wi{font-style:italic;color:var(--soft);font-size:.84rem}
.w .wm{font-size:.9rem;margin-top:3px}
.w .wg{font-size:.76rem;color:var(--faint);margin-top:5px;border-top:1px dashed var(--line);padding-top:4px}
.w .wg .gd{font-family:var(--deva);font-size:.86rem}
.tr{margin-top:22px;font-size:1.04rem;line-height:1.65}
.notes{margin-top:12px;font-size:.8rem;color:var(--soft)}
.notes p{margin:3px 0}
.notes b{font-weight:600;color:var(--faint)}

body:not(.show-iast) .iast, body:not(.show-iast) .pd-i, body:not(.show-iast) .w .wi{display:none}
body:not(.show-pd) .pd{display:none}
body:not(.show-wbw) .wbw{display:none}
body:not(.show-lg) .w .wg{display:none}
body.lg-iast .w .gd{display:none}
body:not(.lg-iast) .w .gi{display:none}

.w.has-dict{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.w.has-dict:hover,.w.has-dict:focus-visible{border-color:var(--accent);outline:0;box-shadow:0 0 0 2px var(--accent-soft)}
.dict-back{position:fixed;inset:0;z-index:20;background:rgba(20,14,10,.42);display:none;
  align-items:center;justify-content:center;padding:20px}
.dict-back.open{display:flex}
.dict{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;
  width:min(680px,100%);max-height:min(82vh,760px);display:flex;flex-direction:column;
  box-shadow:0 18px 50px rgba(0,0,0,.28)}
.dict-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dict-head .dh{flex:1;min-width:0}
.dict-head .dw{font-family:var(--deva);font-size:1.45rem;line-height:1.35;overflow-wrap:anywhere}
.dict-head .di{font-style:italic;color:var(--soft);font-size:.9rem;overflow-wrap:anywhere}
.dict-head .dm{font-size:.9rem;margin-top:4px}
.dict-x{border:0;background:none;color:var(--soft);font-size:1.5rem;line-height:1;cursor:pointer;padding:0 4px;font-family:inherit}
.dict-x:hover{color:var(--ink)}
.dict-body{overflow-y:auto;padding:4px 18px 14px;overscroll-behavior:contain}
.dict-body h3{font-family:var(--deva);font-weight:400;font-size:1.2rem;margin:16px 0 0;color:var(--accent)}
.dict-body h3 i{font-family:var(--latin);font-size:.86rem;color:var(--soft);margin-left:6px}
.dict-body h4{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:14px 0 4px}
.dict-body p{margin:0 0 7px;font-size:.9rem;line-height:1.5;overflow-wrap:anywhere}
.dict-body p .lx{font-size:.74rem;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px;margin-right:6px}
.dict-body .none,.dict-body .more{color:var(--soft);font-style:italic;font-size:.86rem}
.dict-foot{border-top:1px solid var(--line);padding:9px 18px;font-size:.72rem;color:var(--faint)}
@media (max-width:560px){
  .dict-back{padding:0;align-items:flex-end}
  .dict{border-radius:14px 14px 0 0;max-height:86vh}
}

footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:.8rem;color:var(--soft)}
footer p{margin:4px 0}
a.theme-btn{text-decoration:none}
#credits{scroll-margin-top:70px;padding-top:28px}
#credits a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
#credits a:hover{text-decoration-thickness:2px}
/* citations: a framed, illuminated panel */
.cr-frame{position:relative;margin:34px 0 26px;padding:44px 26px 26px;border-radius:20px;
  border:1px solid color-mix(in srgb,var(--accent) 38%,var(--line));
  background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--accent-soft) 85%,transparent) 0%,transparent 70%),var(--card);
  box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 10%,transparent),0 14px 34px -22px color-mix(in srgb,var(--accent) 55%,transparent);
  color:var(--ink)}
.cr-frame::before{content:"";position:absolute;inset:7px;border-radius:14px;pointer-events:none;
  border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.cr-corner{position:absolute;width:22px;height:22px;pointer-events:none;color:color-mix(in srgb,var(--accent) 70%,transparent)}
.cr-corner svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round}
.cr-corner.tl{top:13px;left:13px}.cr-corner.tr{top:13px;right:13px;transform:scaleX(-1)}
.cr-corner.bl{bottom:13px;left:13px;transform:scaleY(-1)}.cr-corner.br{bottom:13px;right:13px;transform:scale(-1)}
.cr-medal{position:absolute;top:-25px;left:50%;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--accent);background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 38%,var(--line));box-shadow:0 0 0 6px var(--paper)}
.cr-medal svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-head{text-align:center;margin:0 0 6px}
.cr-head .cr-inv{font-family:var(--deva);font-size:1.05rem;color:var(--accent);letter-spacing:.02em}
.cr-head .cr-k{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.cr-head h2{font-family:inherit;font-size:1.4rem;font-weight:600;color:var(--ink);margin:3px 0 0;letter-spacing:.01em}
.cr-orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 18px;max-width:240px}
.cr-orn::before,.cr-orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 55%,transparent))}
.cr-orn::after{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 55%,transparent),transparent)}
.cr-orn i{width:7px;height:7px;transform:rotate(45deg);background:var(--accent);opacity:.75}
.cr-thanks{font-size:.95rem;line-height:1.75;color:var(--ink);max-width:620px;margin:0 auto}
.cr-thanks p{margin:0 0 11px}
.cr-thanks .cr-names{font-weight:600}
.cr-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.cr-links a{display:inline-block;font-size:.8rem;padding:5px 12px;border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:999px;
  text-decoration:none !important;background:color-mix(in srgb,var(--paper) 70%,transparent)}
@media (max-width:560px){.cr-frame{padding:42px 18px 22px}.cr-corner{width:18px;height:18px}}
.cr-links a:hover{border-color:var(--accent);background:var(--accent-soft)}
.cr-list p{margin:0 0 7px;line-height:1.55}
.cr-note{margin-top:14px !important;color:var(--faint)}
@media (max-width:560px){
  header .deva-title{font-size:2.1rem}.sa{font-size:1.38rem}.bar{gap:16px}
  .tb-in{padding:0 14px;gap:12px;height:50px}
  .brand img{width:30px;height:30px}
  .tb-slot{gap:8px;justify-content:flex-start}
  .tb-slot .sw .lf{display:none}
  .tb-slot .sw .ls{display:inline}
  .tb-slot .theme-btn{width:26px;height:26px}
  .topbar.merged .tb-slot{margin-right:0}
  .tb-slot .sw{font-size:.8rem;gap:6px}
  .tb-slot .sw .k{width:22px;height:13px}
  .tb-slot .sw .k::after{width:9px;height:9px}
  .tb-slot .sw[aria-pressed="true"] .k::after{transform:translateX(9px)}
  .to-top{right:16px;width:42px;height:42px}
  .words{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}

.",["vac"]],["पितरम्","pitaram","to his father","पितृ","pitṛ","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["pitṛ"]],["तत","tata","father","तत","tata","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["tata"]],["कस्मै","kasmai","to whom","किम्","kim","सर्वनाम, चतुर्थी, पुं, एक","sarvanāma, caturthī, puṃ, eka","pronoun m. dat. sg.",["kim"]],["माम्","mām","me","अस्मद्","asmad","सर्वनाम, द्वितीया, एक","sarvanāma, dvitīyā, eka","pronoun acc. sg.",["asmad"]],["दास्यसि","dāsyasi","will you give","दा","dā","लृट्, मध्यम, एक","lṛṭ, madhyama, eka","future 2nd sg.",["dā"]],["इति","iti","thus","इति","iti","अव्यय","avyaya","indeclinable",["iti"]],["द्वितीयम्","dvitīyam","a second time","द्वितीय","dvitīya","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["dvitīya"]],["तृतीयम्","tṛtīyam","a third time","तृतीय","tṛtīya","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["tṛtīya"]],["तम्","tam","to him","तद्","tad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["tad"]],["ह","ha","indeed","ह","ha","अव्यय","avyaya","indeclinable",["ha"]],["उवाच","uvāca","(the father) said","वच्","vac","लिट्, प्रथम, एक","liṭ, prathama, eka","perfect 3rd sg.",["vac"]],["मृत्यवे","mṛtyave","to Death","मृत्यु","mṛtyu","चतुर्थी, पुं, एक","caturthī, puṃ, eka","m. dat. sg.",["mṛtyu"]],["त्वा","tvā","you","युष्मद्","yuṣmad","सर्वनाम, द्वितीया, एक","sarvanāma, dvitīyā, eka","pronoun acc. sg.",["yuṣmad"]],["ददामि","dadāmi","I give","दा","dā","लट्, उत्तम, एक","laṭ, uttama, eka","present 1st sg.",["dā"]],["इति","iti","thus","इति","iti","अव्यय","avyaya","indeclinable",["iti"]]],"t":"He said to his father, “Father, to whom will you give me?” He asked a second time and a third. The father said to him, “To Death I give you.”","notes":["Śaṅkara: the boy offers himself so that the sacrifice may not fall short and bring harm to his father. Ignored at first, he asks again and again, and the father answers in anger."],"by":null,"var":[],"x":false},{"n":"1 irst, and among many as the middlemost. What purpose of Yama's is there that my father will accomplish through me today?”","notes":["Śaṅkara: Naciketas reflects by himself. Among many sons or pupils his conduct is that of the best, or at least of the middling, never of the worst. His father spoke in anger and with no purpose in view; even so, his father's word must not prove false."],"by":null,"var":[],"x":false},{"n":"1.1.6","label":null,"d":"अनुपश्य यथा पूर्वे प्रतिपश्य तथापरे ।\nसस्यमिव मर्त्यः पच्यते सस्यमिवाजायते पुनः ॥ ६ ॥","i":"anupaśya yathā pūrve pratipaśya tathāpare |\nsasyam iva martyaḥ pacyate sasyam ivājāyate punaḥ || 6 ||","pd":"अनुपश्य यथा पूर्वे प्रतिपश्य तथा अपरे सस्यम् इव मर्त्यः पच्यते सस्यम् इव आजायते पुनः","pi":"anupaśya yathā pūrve pratipaśya tathā apare sasyam iva martyaḥ pacyate sasyam iva ājāyate punaḥ","w":[["अनुपश्य","anupaśya","consider","अनु-दृश्","anu-dṛś","लोट्, मध्यम, एक","loṭ, madhyama, eka","imperative 2nd sg.",["anudṛś"]],["यथा","yathā","how","यथा","yathā","अव्यय","avyaya","indeclinable",["yathā"]],["पूर्वे","pūrve","those who went before","पूर्व","pūrva","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["pūrva"]],["प्रतिपश्य","pratipaśya","look also at","प्रति-दृश्","prati-dṛś","लोट्, मध्यम, एक","loṭ, madhyama, eka","imperative 2nd sg.",["pratidṛś"]],["तथा","tathā","so too","तथा","tathā","अव्यय","avyaya","indeclinable",["tathā"]],["अपरे","apare","the others (now living)","अपर","apara","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["apara"]],["सस्यम्","sasyam","corn","सस्य","sasya","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["sasya"]],["इव","iva","like","इव","iva","अव्यय","avyaya","indeclinable",["iva"]],["मर्त्यः","martyaḥ","a mortal","मर्त्य","martya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["martya"]],["पच्यते","pacyate","ripens","पच्","pac","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["pac"]],["सस्यम्","sasyam","corn","सस्य","sasya","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["sasya"]],["इव","iva","like","इव","iva","अव्यय","avyaya","indeclinable",["iva"]],["आजायते","ājāyate","is born","आ-जन्","ā-jan","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["ājan"]],["पुनः","punaḥ","again","पुनर्","punar","अव्यय","avyaya","indeclinable",["punar"]]],"t":"“Consider how those before us acted, and see how others act now. Like corn a mortal ripens, and like corn he is born again.”","notes":["Śaṅkara: Naciketas says this to his father. Neither the forefathers nor good men now living have gone back on their word. Since man ripens and dies and is born again like corn, nothing in this passing world is gained by a falsehood: keep your word and send me to Yama."],"by":null,"var":[],"x":false},{"n":"1.1.7","label":null,"d":"वैश्वानरः प्रविशति अतिथिर्ब्राह्मणो गृहान् ।\nतस्यैतां शान्तिं कुर्वन्ति हर वैवस्वतोदकम् ॥ ७ ॥","i":"vaiśvānaraḥ praviśati atithir brāhmaṇo gṛhān |\ntasyaitāṃ śāntiṃ kurvanti hara vaivasvatodakam || 7 ||","pd":"वैश्वानरः प्रविशति अतिथिः ब्राह्मणः गृहान् तस्य एताम् शान्तिम् कुर्वन्ति हर वैवस्वत उदकम्","pi":"vaiśvānaraḥ praviśati atithiḥ brāhmaṇaḥ gṛhān tasya etām śāntim kurvanti hara vaivasvata udakam","w":[["वैश्वानरः","vaiśvānaraḥ","fire","वैश्वानर","vaiśvānara","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vaiśvānara"]],["प्रविशति","praviśati","enters","प्र-विश्","pra-viś","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["praviś"]],["अतिथिः","atithiḥ","as a guest","अतिथि","atithi","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["atithi"]],["ब्राह्मणः","brāhmaṇaḥ","a brahmin","ब्राह्मण","brāhmaṇa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["brāhmaṇa"]],["गृहान्","gṛhān","a house","गृह","gṛha","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["gṛha"]],["तस्य","tasya","for him","तद्","tad","सर्वनाम, षष्ठी, पुं, एक","sarvanāma, ṣaṣṭhī, puṃ, eka","pronoun m. gen. sg.",["tad"]],["एताम्","etām","this","एतद्","etad","सर्वनाम, द्वितीया, स्त्री, एक","sarvanāma derstanding in whose house a brahmin stays without food.”","notes":["Śaṅkara: āśā is the wish for a desired thing not yet known to be within reach; pratīkṣā is the awaiting of one that is. saṃgata, sūnṛtā and iṣṭāpūrta stand for their fruits: what comes of keeping good company, of pleasant speech, of sacrifice, and of works such as the laying out of gardens."],"by":null,"var":[],"x":false},{"n":"1.1.9","label":null,"d":"तिस्रो रात्रीर्यदवात्सीर्गृहे मे अनश्नन्ब्रह्मन्नतिथिर्नमस्यः ।\nनमस्तेऽस्तु ब्रह्मन्स्वस्ति मेऽस्तु तस्मात्प्रति त्रीन्वरान्वृणीष्व ॥ ९ ॥","i":"tisro rātrīr yad avātsīr gṛhe me anaśnan brahmann atithir namasyaḥ |\nnamas te 'stu brahman svasti me 'stu tasmāt prati trīn varān vṛṇīṣva || 9 ||","pd":"तिस्रः रात्रीः यत् अवात्सीः गृहे मे अन्-अश्नन् ब्रह्मन् अतिथिः नमस्यः नमः ते अस्तु ब्रह्मन् स्वस्ति मे अस्तु तस्मात् प्रति त्रीन् वरान् वृणीष्व","pi":"tisraḥ rātrīḥ yat avātsīḥ gṛhe me an-aśnan brahman atithiḥ namasyaḥ namaḥ te astu brahman svasti me astu tasmāt prati trīn varān vṛṇīṣva","w":[["तिस्रः","tisraḥ","three","त्रि","tri","द्वितीया, स्त्री, बहु","dvitīyā, strī, bahu","f. acc. pl.",["tri"]],["रात्रीः","rātrīḥ","nights","रात्रि","rātri","द्वितीया, स्त्री, बहु","dvitīyā, strī, bahu","f. acc. pl.",["rātri"]],["यत्","yat","since","यद्","yad","अव्यय","avyaya","indeclinable",["yad"]],["अवात्सीः","avātsīḥ","you have stayed","वस्","vas","लुङ्, मध्यम, एक","luṅ, madhyama, eka","aorist 2nd sg.",["vas"]],["गृहे","gṛhe","in the house","गृह","gṛha","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg.",["gṛha"]],["मे","me","my","अस्मद्","asmad","सर्वनाम, षष्ठी, एक","sarvanāma, ṣaṣṭhī, eka","pronoun gen. sg.",["asmad"]],["अन्-अश्नन्","an-aśnan","not eating","अनश्नत्","anaśnat","शतृ।शानच्, प्रथमा, पुं, एक","śatṛ/śānac, prathamā, puṃ, eka","present participle m. nom. sg.",["anaśnat"]],["ब्रह्मन्","brahman","O brahmin","ब्रह्मन्","brahman","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["brahman"]],["अतिथिः","atithiḥ","a guest","अतिथि","atithi","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["atithi"]],["नमस्यः","namasyaḥ","worthy of reverence","नमस्य","namasya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["namasya"]],["नमः","namaḥ","homage","नमस्","namas","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["namas"]],["ते","te","to you","युष्मद्","yuṣmad","सर्वनाम, चतुर्थी, एक","sarvanāma, caturthī, eka","pronoun dat. sg.",["yuṣmad"]],["अस्तु","astu","let there be","अस्","as","लोट्, प्रथम, एक","loṭ, prathama, eka","imperative 3rd sg.",["as"]],["ब्रह्मन्","brahman","O brahmin","ब्रह्मन्","brahman","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["brahman"]],["स्वस्ति","svasti","well-being","स्वस्ति","svasti","अव्यय","avyaya","indeclinable",["svasti"]],["मे","me","for me","अस्मद्","asmad","सर्वनाम, षष्ठी, एक","sarvanāma, ṣaṣṭhī, eka","pronoun gen. sg.",["asmad"]],["अस्तु","astu","let there be","अस्","as","लोट्, प्रथम, एक","loṭ, prathama, eka","imperative 3rd sg.",["as"]],["तस्मात्","tasmāt","therefore","तद्","tad","अव्यय","avyaya","indeclinable",["tad"]],["प्रति","prati","in return, for each","प्रति","prati","अव्यय","avyaya","indeclinable",["prati"]],["त्रीन्","trīn","three","त्रि","tri","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["tri"]],["वरान्","varān","boons","वर","vara","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["vara"]],["वृणीष्व","vṛṇīṣva","choose","वृ","vṛ","लोट्, मध्यम, एक","loṭ, madhyama, eka","imperative 2nd sg.",["vṛ"]]],"t":"“Since you have stayed three nights in my house without food, O brahmin, a guest worthy of reverence, homage to you, O brahmin, and may it be well with me. Therefore choose three boons, one for each night.”","notes":["Śaṅkara: Yama says this, approaching Naciketas with honour. prati: a boon in return for each night spent without food."],"by":null,"var":[],"x":false},{"n":"1.1.10","label":null,"d":"शान्तसङ्कल्पः सुमना यथा स्याद्वीतमन्युर्गौतमो माभि मृत्यो ।\nत्वत्प्रसृष्टं माभिवदेत्प्रतीत एतत्त्रयाणां प्रथमं वरं वृणे ॥ १० ॥","i":"śān athamā, puṃ, eka","past passive participle m. nom. sg.",["pratī"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["etad"]],["त्रयाणाम्","trayāṇām","of the three","त्रि","tri","षष्ठी, पुं, बहु","ṣaṣṭhī, puṃ, bahu","m. gen. pl.",["tri"]],["प्रथमम्","prathamam","the first","प्रथम","prathama","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["prathama"]],["वरम्","varam","boon","वर","vara","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["vara"]],["वृणे","vṛṇe","I choose","वृ","vṛ","लट्, उत्तम, एक","laṭ, uttama, eka","present 1st sg.",["vṛ"]]],"t":"“O Death, may Gautama, my father, be free of anxiety, glad at heart and without anger towards me; and when you send me back, may he recognise me and greet me. This I choose as the first of the three boons.”","notes":["Śaṅkara: śāntasaṃkalpa: his anxious thought, ‘what will become of my son, gone to Yama?’, laid to rest. pratīta: with memory restored, recognising ‘this is my own son, come back’."],"by":null,"var":[],"x":false},{"n":"1.1.11","label":null,"d":"यथा पुरस्ताद्भविता प्रतीत औद्दालकिरारुणिर्मत्प्रसृष्टः ।\nसुखं रात्रीः शयिता वीतमन्युस्त्वां ददृशिवान्मृत्युमुखात्प्रमुक्तम् ॥ ११ ॥","i":"yathā purastād bhavitā pratīta auddālakir āruṇir matprasṛṣṭaḥ |\nsukhaṃ rātrīḥ śayitā vītamanyus tvāṃ dadṛśivān mṛtyumukhāt pramuktam || 11 ||","pd":"यथा पुरस्तात् भविता प्रतीतः औद्दालकिः आरुणिः मद्-प्रसृष्टः सुखम् रात्रीः शयिता वीत-मन्युः त्वाम् ददृशिवान् मृत्यु-मुखात् प्रमुक्तम्","pi":"yathā purastāt bhavitā pratītaḥ auddālakiḥ āruṇiḥ mad-prasṛṣṭaḥ sukham rātrīḥ śayitā vīta-manyuḥ tvām dadṛśivān mṛtyu-mukhāt pramuktam","w":[["यथा","yathā","as","यथा","yathā","अव्यय","avyaya","indeclinable",["yathā"]],["पुरस्तात्","purastāt","before","पुरस्तात्","purastāt","अव्यय","avyaya","indeclinable",["purastāt"]],["भविता","bhavitā","he will be","भू","bhū","लुट्, प्रथम, एक","luṭ, prathama, eka","periphrastic future 3rd sg.",["bhū"]],["प्रतीतः","pratītaḥ","recognising (you)","प्रति-इ","prati-i","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg.",["pratī"]],["औद्दालकिः","auddālakiḥ","Auddālaki","औद्दालकि","auddālaki","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["auddālaki"]],["आरुणिः","āruṇiḥ","Āruṇi","आरुणि","āruṇi","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["āruṇi"]],["मद्-प्रसृष्टः","mad-prasṛṣṭaḥ","with my leave","मत्प्रसृष्ट","matprasṛṣṭa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["mad","prasṛṣṭa"]],["सुखम्","sukham","happily","सुखम्","sukham","अव्यय","avyaya","indeclinable",["sukham"]],["रात्रीः","rātrīḥ","through the nights","रात्रि","rātri","द्वितीया, स्त्री, बहु","dvitīyā, strī, bahu","f. acc. pl.",["rātri"]],["शयिता","śayitā","he will sleep","शी","śī","लुट्, प्रथम, एक","luṭ, prathama, eka","periphrastic future 3rd sg.",["śī"]],["वीत-मन्युः","vīta-manyuḥ","free from anger","वीतमन्यु","vītamanyu","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vītamanyu"]],["त्वाम्","tvām","you","युष्मद्","yuṣmad","सर्वनाम, द्वितीया, एक","sarvanāma, dvitīyā, eka","pronoun acc. sg.",["yuṣmad"]],["ददृशिवान्","dadṛśivān","having seen","दृश्","dṛś","क्वसु।कानच्, प्रथमा, पुं, एक","kvasu/kānac, prathamā, puṃ, eka","perfect participle m. nom. sg.",["dṛś"]],["मृत्यु-मुखात्","mṛtyu-mukhāt","from the jaws of Death","मृत्युमुख","mṛtyumukha","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["mṛtyu","mukha"]],["प्रमुक्तम्","pramuktam","released","प्र-मुच्","pra-muc","क्त, द्वितीया, पुं, एक","kta, dvitīyā, puṃ, eka","past passive participle m. acc. sg.",["pramuc"]]],"t":"“Auddālaki Āruṇi will recognise you and be towards you as he was before, by my leave. Free from anger, he will sleep happily through the nights, having seen you released from the jaws of Death.”","notes":["Śaṅkara: Yama speaks. Auddālaki is Uddālaka himself, and Āruṇi ‘the son of Aruṇa’. matprasṛṣṭaḥ: ‘permitted by me’. yathā purastāt: with the same affection he had for you before."],"by":null,"var":[],"x":false},{"n":"1.1.12","label":null,"d":"स्वर्गे लोके न भयं किंचनास्ति न तत्र त्वं न जरया बिभेति ।\nउभे तीर्त्वा अशनायापिपासे शोकातिगो मोदते स्वर्गलोके ॥ १२ ॥","i":"svarge loke na bhayaṃ kiṃcanāsti na tatra tvaṃ na jarayā bibheti |\nubhe tīrtvā aśanāyāpipāse śokātigo modate svargaloke || 12 ||","pd":"स्वर्गे लोके न भयम् किंचन अस्ति न तत्र त्वम् न जरया बिभेति उभे तीर्त्वा अशनाया-पिपासे शोक-अतिगः मोदते स्वर्ग-लोके","pi":"svarge loke na bhayam kiṃcana asti na tatra tvam na jarayā bibheti ubhe tīrtvā aśanāyā-pipāse śoka-atigaḥ modate svarga-loke","w":[["स्वर्गे","svarge","in the heavenly","स्वर्ग","svarga","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["svarga"]],["लोके","loke","world","लोक","loka","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["loka"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["भयम्","bhayam","fear","भय","bhaya","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["bhaya"]],["किंचन","kiṃcana","any at all","किंचन","kiṃcana","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["kiñcana"]],["अस्ति","asti","there is","अस्","as","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["as"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["तत्र","tatra","there","तत्र","tatra","अव्यय","avyaya","indeclinable",["tatra"]],["त्वम्","tvam","you","युष्मद्","yuṣmad","सर्वनाम, प्रथमा, एक","sarvanāma, prathamā, eka","pronoun nom. sg.",["yuṣmad"]],["न","na","nor","न","na","अव्यय","avyaya","indeclinable",["na"]],["जरया","jarayā","because of old age","जरा","jarā","तृतीया, स्त्री, एक","tṛtīyā, strī, eka","f. ins. sg.",["jarā"]],["बिभेति","bibheti","does one fear","भी","bhī","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["bhī"]],["उभे","ubhe","both","उभ","ubha","द्वितीया, स्त्री, द्वि","dvitīyā, strī, dvi","f. acc. du.",["ubha"]],["तीर्त्वा","tīrtvā","having crossed beyond","तॄ","tṝ","क्त्वा","ktvā","absolutive",["tṝ"]],["अशनाया-पिपासे","aśanāyā-pipāse","hunger and thirst","अशनायापिपासा","aśanāyāpipāsā","द्वितीया, स्त्री, द्वि","dvitīyā, strī, dvi","f. acc. du.",["aśanāyā","pipāsā"]],["शोक-अतिगः","śoka-atigaḥ","gone beyond sorrow","शोकातिग","śokātiga","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["śokātiga"]],["मोदते","modate","one rejoices","मुद्","mud","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["mud"]],["स्वर्ग-लोके","svarga-loke","in the world of heaven","स्वर्गलोक","svargaloka","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["svargaloka"]]],"t":"“In the world of heaven there is no fear at all. You are not there, and no one fears old age. Having crossed beyond both hunger and thirst, and gone beyond sorrow, one rejoices in the world of heaven.”","notes":["Śaṅkara: Naciketas speaks. ‘You are not there’: Death does not suddenly prevail there, so no one, touched by old age, fears him as people do here. śoka is sorrow of the mind."],"by":null,"var":[],"x":false},{"n":"1.1.13","label":null,"d":"स त्वमग्निं स्वर्ग्यमध्येषि मृत्यो प्रब्रूहि तं श्रद्दधानाय मह्यम् ।\nस्वर्गलोका अमृतत्वं भजन्त एतद्द्वितीयेन वृणे वरेण ॥ १३ ॥","i":"sa tvam agniṃ svargyam adhyeṣi mṛtyo prabrūhi taṃ śraddadhānāya mahyam |\nsvargalokā amṛtatvaṃ bhajanta etad dvitīyena vṛṇe vareṇa || 13 ||","pd":"सः त्वम् अग्निम् स्वर्ग्यम् अध्येषि मृत्यो प्रब्रूहि तम् श्रद्दधानाय मह्यम् स्वर्ग-लोकाः अमृत-त्वम् भजन्ते एतत् द्वितीयेन वृणे वरेण","pi":"saḥ tvam agnim svargyam adhyeṣi mṛtyo prabrūhi tam śraddadhānāya mahyam svarga-lokāḥ amṛta-tvam bhajante etat dvitīyena vṛṇe vareṇa","w":[["सः","saḥ","such as you are","तद्","tad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["tad"]],["त्वम्","tvam","you","युष्मद्","yuṣmad","सर्वनाम, प्रथमा, एक","sarvanāma, prathamā, eka","pronoun nom. sg.",["yuṣmad"]],["अग्निम्","agnim","the fire","अग्नि","agni","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["agni"]],["स्वर्ग्यम्","svargyam","that leads to heaven","स्वर्ग्य","svargya","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["svargya"]],["अध्येषि","adhyeṣi","you know","अधि-इ","adhi-i","लट्, मध्यम, एक","laṭ, madhyama, eka","present 2nd sg.",["adhī"]],["मृत्यो","mṛtyo","O Death","मृत्यु","mṛtyu","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["mṛtyu"]],["प्रब्रूहि","prabrūhi","explain","प्र-ब्रू","pra-brū","लोट्, मध्यम, एक","loṭ, madhyama, eka","imperative 2nd sg.",["prabrū"]],["तम्","tam","it","तद्","tad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["tad"]],["श्रद्दधानाय","śraddadhānāya","who has faith","श्रद्-धा","śrad-dhā","शतृ।शानच्, चतुर्थी, पुं, एक","śatṛ/śānac, caturthī, puṃ, eka","present participle m. dat. sg.",["śraddhā"]],["मह्यम्","mahyam","to me","अस्मद्","asmad","सर्वनाम, चतुर्थी, एक","sarvanāma, caturthī, eka","pronoun dat. sg.",["asmad"]],["स्वर्ग-लोकाः","svarga-lokāḥ","those whose world is heaven","स्वर्गलोक","svargaloka","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["svargaloka"]],["अमृत-त्वम्","amṛta-tvam","immortality","अमृतत्व","amṛtatva","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["amṛtatva"]],["भजन्ते","bhajante","attain","भज्","bhaj","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["bhaj"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["etad"]],["द्वितीयेन","dvitīyena","as the second","द्वितीय","dvitīya","तृतीया, पुं, एक","tṛtīyā, puṃ, eka","m. ins. sg.",["dvitīya"]],["वृणे","vṛṇe","I choose","वृ","vṛ","लट्, उत्तम, एक","laṭ, uttama, eka","present 1st sg.",["vṛ"]],["वरेण","vareṇa","boon","वर","vara","तृतीया, पुं, एक","tṛtīyā, puṃ, eka","m. ins. sg.",["vara"]]],"t":"“You, O Death, know the fire that leads to heaven. Explain it to me, who have faith. Those whose world is heaven attain immortality. This I choose as my second boon.”","notes":["Śaṅkara: adhyeṣi: ‘you remember, you know’. svargalokāḥ are the sacrificers who win heaven by building this fire. The immortality meant here is the deathlessness of the gods (devatva)."],"by":null,"var":[],"x":false},{"n":"1.1.14","label":null,"d":"प्र ते ब्रवीमि तदु मे निबोध स्वर्ग्यमग्निं नचिकेतः प्रजानन् ।\nअनन्तलोकाप्तिमथो प्रतिष्ठां विद्धि त्वमेतं निहितं गुहायाम् ॥ १४ ॥","i":"pra te bravīmi tad u me nibodha svargyam agniṃ naciketaḥ prajānan |\nanantalokāptim atho pratiṣṭhāṃ viddhi tvam etaṃ nihitaṃ guhāyām || 14 ||","pd":"प्र ते ब्रवीमि तत् उ मे निबोध स्वर्ग्यम् अग्निम् नचिकेतः प्रजानन् अनन्त-लोक-आप्तिम् अथ उ प्रतिष्ठाम् विद्धि त्वम् एतम् निहितम् गुहायाम्","pi":"pra te bravīmi tat u me nibodha svargyam agnim naciketaḥ prajānan ananta-loka-āptim atha u pratiṣṭhām viddhi tvam etam nihitam guhāyām","w":[["प्र","pra","(with bravīmi)","प्र","pra","अव्यय","avyaya","indeclinable",["pra"]],["ते","te","to you","युष्मद्","yuṣmad","सर्वनाम, चतुर्थी, एक","sarvanāma, caturthī, eka","pronoun dat. sg.",["yuṣmad"]],["ब्रवीमि","bravīmi","I will explain","ब्रू","brū","लट्, उत्तम, एक","laṭ, uttama, eka","present 1st sg.",["brū"]],["तत्","tat","that","तद्","tad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["tad"]],["उ","u","and","उ","u","अव्यय","avyaya","indeclinable",["u"]],["मे","me","from me","अस्मद्","asmad","सर्वनाम, षष्ठी, एक","sarvanāma, ṣaṣṭhī, eka","pronoun gen. sg.",["asmad"]],["निबोध","nibodha","learn","नि-बुध्","ni-budh","लोट्, मध्यम, एक","loṭ, madhyama, eka","imperative 2nd sg.",["nibudh"]],["स्वर्ग्यम्","svargyam","that leads to heaven","स्वर्ग्य","svargya","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["svargya"]],["अग्निम्","agnim","the fire","अग्नि","agni","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["agni"]],["नचिकेतः","naciketaḥ","O Naciketas","नचिकेतस्","naciketas","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["naciketas"]],["प्रजानन्","prajānan","knowing (it) well","प्र-ज्ञा","pra-jñā","शतृ।शानच्, प्रथमा, पुं, एक","śatṛ/śānac, prathamā, puṃ, eka","present participle m. nom. sg.",["prajñā"]],["अनन्त-लोक-आप्तिम्","ananta-loka-āptim","the attaining of the endless world","अनन्तलोकाप्ति","anantalokāpti","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["ananta","loka","āpti"]],["अथ","atha","and","अथ","atha","अव्यय","avyaya","indeclinable",["atha"]],["उ","u","also","उ","u","अव्यय","avyaya","indeclinable",["u"]],["प्रतिष्ठाम्","pratiṣṭhām","the support","प्रतिष्ठा","pratiṣṭhā","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["pratiṣṭhā"]],["विद्धि","viddhi","know","विद्","vid","लोट्, मध्यम, एक","loṭ, madhyama, eka","imperative 2nd sg.",["vid"]],["त्वम्","tvam","you","युष्मद्","yuṣmad","सर्वनाम, प्रथमा, एक","sarvanāma, prathamā, eka","pronoun nom. sg.",["yuṣmad"]],["एतम्","etam","this (fire)","एतद्","etad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["etad"]],["निहितम्","nihitam","placed","नि-धा","ni-dhā","क्त, द्वितीया, पुं, एक","kta, dvitīyā, puṃ, eka","past passive participle m. acc. sg.",["nidhā"]],["गुहायाम्","guhāyām","in the cave","गुहा","guhā","सप्तमी, स्त्री, एक","saptamī, strī, eka","f. loc. sg.",["guhā"]]],"t":"“I will explain it to you; learn it from me, O Naciketas, for I know well the fire that leads to heaven. Know this fire to be the means of attaining the endless world, and its support, lodged in the cave.”","notes":["pra … bravīmi is one verb (prabravīmi), its parts separated in the verse.","Śaṅkara: Yama asks for attention so as to steady the pupil's mind, and then praises the fire. anantalokāpti: the means of gaining heaven. pratiṣṭhā: the support of the world, in its form as Virāṭ. ‘Lodged in the cave’: seated in the understanding of those who know."],"by":null,"var":[],"x":false},{"n":"1.1.15","label":null,"d":"लोकादिमग्निं तमुवाच तस्मै या इष्टका यावतीर्वा यथा वा ।\nस चापि तत्प्रत्यवदद्यथोक्तमथास्य मृत्युः पुनराह तुष्टः ॥ १५ ॥","i":"lokādim agniṃ tam uvāca tasmai yā iṣṭakā yāvatīr vā yathā vā |\nsa cāpi tat pratyavadad yathoktam athāsya mṛtyuḥ punar āha tuṣṭaḥ || 15 ||","pd":"लोक-आदिम् अग्निम् तम् उवाच तस्मै याः इष्टकाः यावतीः वा यथा वा सः च अपि तत् प्रत्यवदत् यथा उक्तम् अथ अस्य मृत्युः पुनः आह तुष्टः","pi":"loka-ādim agnim tam uvāca tasmai yāḥ iṣṭakāḥ yāvatīḥ vā yathā vā saḥ ca api tat pratyavadat yathā uktam atha asya mṛtyuḥ punaḥ āha tuṣṭaḥ","w":[["लोक-आदिम्","loka-ādim","the beginning of the worlds","लोकादि","lokādi","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["lokādi"]],["अग्निम्","agnim","fire","अग्नि","agni","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["agni"]],["तम्","tam","that","तद्","tad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["tad"]],["उवाच","uvāca","he told","वच्","vac","लिट्, प्रथम, एक","liṭ, prathama, eka","perfect 3rd sg.",["vac"]],["तस्मै","tasmai","to him","तद्","tad","सर्वनाम, चतुर्थी, पुं, एक","sarvanāma, caturthī, puṃ, eka","pronoun m. dat. sg.",["tad"]],["याः","yāḥ","which","यद्","yad","सर्वनाम, प्रथमा, स्त्री, बहु","sarvanāma, prathamā, strī, bahu","pronoun f. nom. pl.",["yad"]],["इष्टकाः","iṣṭakāḥ","bricks","इष्टका","iṣṭakā","प्रथमा, स्त्री, बहु","prathamā, strī, bahu","f. nom. pl.",["iṣṭakā"]],["यावतीः","yāvatīḥ","how many","यावत्","yāvat","प्रथमा, स्त्री, बहु","prathamā, strī, bahu","f. nom. pl.",["yāvat"]],["वा","vā","or","वा","vā","अव्यय","avyaya","indeclinable",["vā"]],["यथा","yathā","how (laid)","यथा","yathā","अव्यय","avyaya","indeclinable",["yathā"]],["वा","vā","or","वा","vā","अव्यय","avyaya","indeclinable",["vā"]],["सः","saḥ","he","तद्","tad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["tad"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["अपि","api","too","अपि","api","अव्यय","avyaya","indeclinable",["api"]],["तत्","tat","that","तद्","tad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["tad"]],["प्रत्यवदत्","pratyavadat","repeated","प्रति-वद्","prati-vad","लङ्, प्रथम, एक","laṅ, prathama, eka","imperfect 3rd sg.",["prativad"]],["यथा","yathā","as","यथा","yathā","अव्यय","avyaya","indeclinable",["yathā"]],["उक्तम्","uktam","it was told","वच्","vac","क्त, प्रथमा, नपुं, एक","kta, prathamā, napuṃ, eka","past passive participle n. nom. sg.",["vac"]],["अथ","atha","then","अथ","atha","अव्यय","avyaya","indeclinable",["atha"]],["अस्य","asya","with him","इदम्","idam","सर्वनाम, षष्ठी, पुं, एक","sarvanāma, ṣaṣṭhī, puṃ, eka","pronoun m. gen. sg.",["idam"]],["मृत्युः","mṛtyuḥ","Death","मृत्यु","mṛtyu","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["mṛtyu"]],["पुनः","punaḥ","again","पुनर्","punar","अव्यय","avyaya","indeclinable",["punar"]],["आह","āha","spoke","अह्","ah","लिट्, प्रथम, एक","liṭ, prathama, eka","perfect 3rd sg.",["ah"]],["तुष्टः","tuṣṭaḥ","pleased","तुष्","tuṣ","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg.",["tuṣ"]]],"t":"Death told him of that fire, the beginning of the worlds: which bricks, how many, and how they are laid. And Naciketas repeated it just as it had been told. Then Death, pleased with him, spoke again.","notes":["Śaṅkara: this verse is the Upaniṣad's own narration. lokādi: the first of the worlds, being the first to take a body. Pleased by the exact repetition, Death wishes to give a boon beyond the three."],"by":null,"var":[],"x":false},{"n":"1.1.16","label":null,"d":"तमब्रवीत्प्रीयमाणो महात्मा वरं तवेहाद्य ददामि भूयः ।\nतवैव नाम्ना भवितायमग्निः सृङ्कां चेमामनेकरूपां गृहाण ॥ १६ ॥","i":"tam abravīt prīyamāṇo mahātmā varaṃ tavehādya dadāmi bhūyaḥ |\ntavaiva nāmnā bhavitāyam agniḥ sṛṅkāṃ cemām anekarūpāṃ gṛhāṇa || 16 ||","pd":"तम् अब्रवीत् प्रीयमाणः महात्मा वरम् तव इह अद्य ददामि भूयः तव एव नाम्ना भविता अयम् अग्निः सृङ्काम् च इमाम् अनेक-रूपाम् गृहाण","pi":"tam abravīt prīyamāṇaḥ mahātmā varam tava iha adya dadāmi bhūyaḥ tava eva nāmnā bhavitā ayam agniḥ sṛṅkām ca imām aneka-rūpām gṛhāṇa","w":[["तम्","tam","to him","तद्","tad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["tad"]],["अब्रवीत्","abravīt","said","ब्रू","brū","लङ्, प्रथम, एक","laṅ, prathama, eka","imperfect 3rd sg.",["brū"]],["प्रीयमाणः","prīyamāṇaḥ","being pleased","प्री","prī","शतृ।शानच्, प्रथमा, पुं, एक","śatṛ/śānac, prathamā, puṃ, eka","present participle m. nom. sg.",["prī"]],["महात्मा","mahātmā","the great-souled one","महात्मन्","mahātman","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["mahātman"]],["वरम्","varam","a boon","वर","vara","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["vara"]],["तव","tava","to you","युष्मद्","yuṣmad","सर्वनाम, षष्ठी, एक","sarvanāma, ṣaṣṭhī, eka","pronoun gen. sg.",["yuṣmad"]],["इह","iha","here","इह","iha","अव्यय","avyaya","indeclinable",["iha"]],["अद्य","adya","now","अद्य","adya","अव्यय","avyaya","indeclinable",["adya"]],["ददामि","dadāmi","I give","दा","dā","लट्, उत्तम, एक","laṭ, uttama, eka","present 1st sg.",["dā"]],["भूयः","bhūyaḥ","further","भूयस्","bhūyas","अव्यय","avyaya","indeclinable",["bhūyas"]],["तव","tava","your","युष्मद्","yuṣmad","सर्वनाम, षष्ठी, एक","sarvanāma, ṣaṣṭhī, eka","pronoun gen. sg.",["yuṣmad"]],["एव","eva","alone","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["नाम्ना","nāmnā","by name","नामन्","nāman","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["nāman"]],["भविता","bhavitā","will be (known)","भू","bhū","लुट्, प्रथम, एक","luṭ, prathama, eka","periphrastic future 3rd sg.",["bhū"]],["अयम्","ayam","this","इदम्","idam","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["idam"]],["अग्निः","agniḥ","fire","अग्नि","agni","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["agni"]],["सृङ्काम्","sṛṅkām","chain","सृङ्का","sṛṅkā","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["sṛṅkā"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["इमाम्","imām","this","इदम्","idam","सर्वनाम, द्वितीया, स्त्री, एक","sarvanāma, dvitīyā, strī, eka","pronoun f. acc. sg.",["idam"]],["अनेक-रूपाम्","aneka-rūpām","of many forms","अनेकरूप","anekarūpa","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["anekarūpa"]],["गृहाण","gṛhāṇa","accept","ग्रह्","grah","लोट्, मध्यम, एक","loṭ, madhyama, eka","imperative 2nd sg.",["grah"]]],"t":"Pleased, the great-souled one said to him: “Here and now I give you one boon more. This fire will be known by your name alone. Accept, too, this chain of many forms.”","notes":["Śaṅkara: this is a fourth boon, given out of delight at the pupil's fitness. sṛṅkā: a tinkling necklace of jewels; or else a course of ritual action that is not to be despised, that is, further knowledge of rites, which yields many results."],"by":null,"var":[],"x":false},{"n":"1.1.17","label":null,"d":"त्रिणाचिकेतस्त्रिभिरेत्य सन्धिं त्रिकर्मकृत्तरति जन्ममृत्यू ।\nब्रह्मजज्ञं देवमीड्यं विदित्वा निचाय्येमां शान्तिमत्यन्तमेति ॥ १७ ॥","i":"triṇāciketas tribhir etya sandhiṃ trikarmakṛt tarati janmamṛtyū |\nbrahmajajñaṃ devam īḍyaṃ viditvā nicāyyemāṃ śāntim atyantam eti || 17 ||","pd":"त्रिणाचिकेतः त्रिभिः एत्य सन्धिम् त्रि-कर्म-कृत् तरति जन्म-मृत्यू ब्रह्म-ज-ज्ञम् देवम् ईड्यम् विदित्वा निचाय्य इमाम् शान्तिम् अत्यन्तम् एति","pi":"triṇāciketaḥ tribhiḥ etya sandhim tri-karma-kṛt tarati janma-mṛtyū brahma-ja-jñam devam īḍyam viditvā nicāyya imām śāntim atyantam eti","w":[["त्रिणाचिकेतः","triṇāciketaḥ","one who has thrice built the Nāciketa fire","त्रिणाचिकेत","triṇāciketa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["triṇāciketa"]],["त्रिभिः","tribhiḥ","with the three","त्रि","tri","तृतीया, पुं, बहु","tṛtīyā, puṃ, bahu","m. ins. pl.",["tri"]],["एत्य","etya","having attained","आ-इ","ā-i","ल्यप्","lyap","absolutive",["e"]],["सन्धिम्","sandhim","union","सन्धि","sandhi","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["sandhi"]],["त्रि-कर्म-कृत्","tri-karma-kṛt","performing the three duties","त्रिकर्मकृत्","trikarmakṛt","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["trikarmakṛt"]],["तरति","tarati","crosses beyond","तॄ","tṝ","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["tṝ"]],["जन्म-मृत्यू","janma-mṛtyū","birth and death","जन्ममृत्यु","janmamṛtyu","द्वितीया, पुं, द्वि","dvitīyā, puṃ, dvi","m. acc. du.",["janmamṛtyu"]],["ब्रह्म-ज-ज्ञम्","brahma-ja-jñam","the knower born of Brahmā","ब्रह्मजज्ञ","brahmajajña","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["brahmajajña"]],["देवम्","devam","the shining one","देव","deva","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["deva"]],["ईड्यम्","īḍyam","worthy of praise","ईड्","īḍ","कृत्य, द्वितीया, पुं, एक","kṛtya, dvitīyā, puṃ, eka","gerundive m. acc. sg.",["īḍ"]],["विदित्वा","viditvā","having known","विद्","vid","क्त्वा","ktvā","absolutive",["vid"]],["निचाय्य","nicāyya","having realised","नि-चि","ni-ci","ल्यप्","lyap","absolutive",["nici"]],["इमाम्","imām","this","इदम्","idam","सर्वनाम, द्वितीया, स्त्री, एक","sarvanāma, dvitīyā, strī, eka","pronoun f. acc. sg.",["idam"]],["शान्तिम्","śāntim","peace","शान्ति","śānti","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["śānti"]],["अत्यन्तम्","atyantam","completely","अत्यन्तम्","atyantam","अव्यय","avyaya","indeclinable",["atyantam"]],["एति","eti","attains","इ","i","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["i"]]],"t":"“One who has thrice built the Nāciketa fire, who has attained union with the three and performs the three duties, crosses beyond birth and death. Knowing that shining one, all-knowing and born of Brahmā, worthy of praise, and realising him, one attains this peace completely.”","notes":["Śaṅkara: ‘the three’ are mother, father and teacher, whose instruction he has duly received; or else the Veda, the smṛti and the conduct of the good; or perception, inference and scripture. The three duties are sacrifice, study and giving. brahmajajña is the all-knowing one born of Hiraṇyagarbha, the fire as Virāṭ. By knowledge and rites together he reaches the state of Virāṭ.","The DCS has the word brahmajajñam in its text but gives no analysis for it; the analysis here is ours."],"by":null,"var":[],"x":false},{"n":"1.1.18","label":null,"d":"त्रिणाचिकेतस्त्रयमेतद्विदित्वा य एवं विद्वांश्चिनुते नाचिकेतम् ।\nस मृत्युपाशान्पुरतः प्रणोद्य शोकातिगो मोदते स्वर्गलोके ॥ १८ ॥","i":"triṇāciketas trayam etad viditvā ya evaṃ vidvāṃś cinute nāciketam |\nsa mṛtyupāśān purataḥ praṇodya śokātigo modate svargaloke || 18 ||","pd":"त्रिणाचिकेतः त्रयम् एतत् विदित्वा यः एवम् विद्वान् चिनुते नाचिकेतम् सः मृत्यु-पाशान् पुरतः प्रणोद्य शोक-अतिगः मोदते स्वर्ग-लोके","pi":"triṇāciketaḥ trayam etat viditvā yaḥ evam vidvān cinute nāciketam saḥ mṛtyu-pāśān purataḥ praṇodya śoka-atigaḥ modate svarga-loke","w":[["त्रिणाचिकेतः","triṇāciketaḥ","one who has thrice built the Nāciketa fire","त्रिणाचिकेत","triṇāciketa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["triṇāciketa"]],["त्रयम्","trayam","triad","त्रय","traya","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["traya"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["etad"]],["विदित्वा","viditvā","having known","विद्","vid","क्त्वा","ktvā","absolutive",["vid"]],["यः","yaḥ","who","यद्","yad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["yad"]],["एवम्","evam","thus","एवम्","evam","अव्यय","avyaya","indeclinable",["evam"]],["विद्वान्","vidvān","knowing","विद्वस्","vidvas","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vidvas"]],["चिनुते","cinute","builds","चि","ci","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["ci"]],["नाचिकेतम्","nāciketam","the Nāciketa fire","नाचिकेत","nāciketa","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["nāciketa"]],["सः","saḥ","he","तद्","tad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["tad"]],["मृत्यु-पाशान्","mṛtyu-pāśān","the snares of death","मृत्युपाश","mṛtyupāśa","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["mṛtyupāśa"]],["पुरतः","purataḥ","beforehand","पुरतस्","puratas","अव्यय","avyaya","indeclinable",["puratas"]],["प्रणोद्य","praṇodya","having cast off","प्र-नुद्","pra-nud","ल्यप्","lyap","absolutive",["pranud"]],["शोक-अतिगः","śoka-atigaḥ","gone beyond sorrow","शोकातिग","śokātiga","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["śokātiga"]],["मोदते","modate","rejoices","मुद्","mud","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["mud"]],["स्वर्ग-लोके","svarga-loke","in the world of heaven","स्वर्गलोक","svargaloka","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["svargaloka"]]],"t":"“He who has thrice built the Nāciketa fire, having known this triad, and who, knowing thus, builds the Nāciketa fire, casts off the snares of death beforehand and, gone beyond sorrow, rejoices in the world of heaven.”","notes":["Śaṅkara: the triad is the bricks, their number and the manner of laying them (verse 15). The snares of death are unrighteousness, ignorance, attachment, aversion and the like. purataḥ: even before the body falls. The heaven meant is the state of Virāṭ."],"by":null,"var":[],"x":false},{"n":"1.1.19","label":null,"d":"एष तेऽग्निर्नचिकेतः स्वर्ग्यो यमवृणीथा द्वितीयेन वरेण ।\nएतमग्निं तवैव प्रवक्ष्यन्ति जनासस्तृतीयं वरं नचिकेतो वृणीष्व ॥ १९ ॥","i":"eṣa te 'gnir naciketaḥ svargyo yam avṛṇīthā dvitīyena vareṇa |\netam agniṃ tavaiva pravakṣyanti janāsas tṛtīyaṃ varaṃ naciketo vṛṇīṣva || 19 ||","pd":"एषः ते अग्निः नचिकेतः स्वर्ग्यः यम् अवृणीथाः द्वितीयेन वरेण एतम् अग्निम् तव एव प्रवक्ष्यन्ति जनासः तृतीयम् वरम् नचिकेतः वृणीष्व","pi":"eṣaḥ te agniḥ naciketaḥ svargyaḥ yam avṛṇīthāḥ dvitīyena vareṇa etam agnim tava eva pravakṣyanti janāsaḥ tṛtīyam varam naciketaḥ vṛṇīṣva","w":[["एषः","eṣaḥ","this","एतद्","etad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["etad"]],["ते","te","for you","युष्मद्","yuṣmad","सर्वनाम, चतुर्थी, एक","sarvanāma, caturthī, eka","pronoun dat. sg.",["yuṣmad"]],["अग्निः","agniḥ","the fire","अग्नि","agni","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["agni"]],["नचिकेतः","naciketaḥ","O Naciketas","नचिकेतस्","naciketas","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["naciketas"]],["स्वर्ग्यः","svargyaḥ","that leads to heaven","स्वर्ग्य","svargya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["svargya"]],["यम्","yam","which","यद्","yad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["yad"]],["अवृणीथाः","avṛṇīthāḥ","you chose","वृ","vṛ","लङ्, मध्यम, एक","laṅ, madhyama, eka","imperfect 2nd sg.",["vṛ"]],["द्वितीयेन","dvitīyena","as the second","द्वितीय","dvitīya","तृतीया, पुं, एक","tṛtīyā, puṃ, eka","m. ins. sg.",["dvitīya"]],["वरेण","vareṇa","boon","वर","vara","तृतीया, पुं, एक","tṛtīyā, puṃ, eka","m. ins. sg.",["vara"]],["एतम्","etam","this","एतद्","etad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["etad"]],["अग्निम्","agnim","fire","अग्नि","agni","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["agni"]],["तव","tava","as yours","युष्मद्","yuṣmad","सर्वनाम, षष्ठी, एक","sarvanāma, ṣaṣṭhī, eka","pronoun gen. sg.",["yuṣmad"]],["एव","eva","alone","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["प्रवक्ष्यन्ति","pravakṣyanti","will speak of","प्र-वच्","pra-vac","लृट्, प्रथम, बहु","lṛṭ, prathama, bahu","future 3rd pl.",["pravac"]],["जनासः","janāsaḥ","people","जन","jana","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["jana"]],["तृतीयम्","tṛtīyam","the third","तृतीय","tṛtīya","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["tṛtīya"]],["वरम्","varam","boon","वर","vara","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["vara"]],["नचिकेतः","naciketaḥ","O Naciketas","नचिकेतस्","naciketas","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["naciketas"]],["वृणीष्व","vṛṇīṣva","choose","वृ","vṛ","लोट्, मध्यम, एक","loṭ, madhyama, eka","imperative 2nd sg.",["vṛ"]]],"t":"“This, O Naciketas, is the fire that leads to heaven, which you chose as your second boon. People will speak of this fire as yours alone. Choose the third boon, O Naciketas.”","notes":["janāsaḥ is the Vedic nominative plural of jana.","Śaṅkara: this sums up what was given. Until the third boon is given, Yama remains in debt."],"by":null,"var":[],"x":false},{"n":"1.1.20","label":null,"d":"येयं प्रेते विचिकित्सा मनुष्ये अस्तीत्येके नायमस्तीति चैके ।\nएतद्विद्यामनुशिष्टस्त्वयाहं वराणामेष वरस्तृतीयः ॥ २० ॥","i":"yeyaṃ prete vicikitsā manuṣye astīty eke nāyam astīti caike |\netad vidyām anuśiṣṭas tvayāhaṃ varāṇām eṣa varas tṛtīyaḥ || 20 ||","pd":"या इयम् प्रेते विचिकित्सा मनुष्ये अस्ति इति एके न अयम् अस्ति इति च एके एतत् विद्याम् अनुशिष्टः त्वया अहम् वराणाम् एषः वरः तृतीयः","pi":"yā iyam prete vicikitsā manuṣye asti iti eke na ayam asti iti ca eke etat vidyām anuśiṣṭaḥ tvayā aham varāṇām eṣaḥ varaḥ tṛtīyaḥ","w":[["या","yā","which","यद्","yad","सर्वनाम, प्रथमा, स्त्री, एक","sarvanāma, prathamā, strī, eka","pronoun f. nom. sg.",["yad"]],["इयम्","iyam","this","इदम्","idam","सर्वनाम, प्रथमा, स्त्री, एक","sarvanāma, prathamā, strī, eka","pronoun f. nom. sg.",["idam"]],["प्रेते","prete","who has departed","प्र-इ","pra-i","क्त, सप्तमी, पुं, एक","kta, saptamī, puṃ, eka","past passive participle m. loc. sg.",["pre"]],["विचिकित्सा","vicikitsā","doubt","विचिकित्सा","vicikitsā","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg.",["vicikitsā"]],["मनुष्ये","manuṣye","about a man","मनुष्य","manuṣya","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["manuṣya"]],["अस्ति","asti","he exists","अस्","as","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["as"]],["इति","iti","thus","इति","iti","अव्यय","avyaya","indeclinable",["iti"]],["एके","eke","some (say)","एक","eka","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["eka"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["अयम्","ayam","he","इदम्","idam","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["idam"]],["अस्ति","asti","exists","अस्","as","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["as"]],["इति","iti","thus","इति","iti","अव्यय","avyaya","indeclinable",["iti"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["एके","eke","others (say)","एक","eka","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["eka"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["etad"]],["विद्याम्","vidyām","may I know","विद्","vid","विधिलिङ्, उत्तम, एक","vidhiliṅ, uttama, eka","optative 1st sg.",["vid"]],["अनुशिष्टः","anuśiṣṭaḥ","taught","अनु-शास्","anu-śās","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg.",["anuśās"]],["त्वया","tvayā","by you","युष्मद्","yuṣmad","सर्वनाम, तृतीया, एक","sarvanāma, tṛtīyā, eka","pronoun ins. sg.",["yuṣmad"]],["अहम्","aham","I","अस्मद्","asmad","सर्वनाम, प्रथमा, एक","sarvanāma, prathamā, eka","pronoun nom. sg.",["asmad"]],["वराणाम्","varāṇām","of the boons","वर","vara","षष्ठी, पुं, बहु","ṣaṣṭhī, puṃ, bahu","m. gen. pl.",["vara"]],["एषः","eṣaḥ","this","एतद्","etad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["etad"]],["वरः","varaḥ","boon","वर","vara","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vara"]],["तृतीयः","tṛtīyaḥ","the third","तृतीय","tṛtīya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["tṛtīya"]]],"t":"“There is this doubt about a man who has departed: some say ‘he exists’, and others say ‘he does not’. Taught by you, may I come to know this. Of the boons, this is the third.”","notes":["Śaṅkara: ‘he exists’: some hold that there is a Self apart from body, senses, mind and intellect, which passes on to another body; others deny it. Neither perception nor inference can settle the matter, and the highest human end depends on knowing it."],"by":null,"var":[],"x":false},{"n":"1.1.21","label":null,"d":"देवैरत्रापि विचिकित्सितं पुरा न हि सुज्ञेयमणुरेष धर्मः ।\nअन्यं वरं नचिकेतो वृणीष्व मा मोपरोत्सीरति मा सृजैनम् ॥ २१ ॥","i":"devair atrāpi vicikitsitaṃ purā na hi sujñeyam aṇur eṣa dharmaḥ |\nanyaṃ varaṃ naciketo vṛṇīṣva mā moparotsīr ati mā sṛjainam || 21 ||","pd":"देवैः अत्र अपि विचिकित्सितम् पुरा न हि सु-ज्ञेयम् अणुः एषः धर्मः अन्यम् वरम् नचिकेतः वृणीष्व मा मा उपरोत्सीः अति मा सृज एनम्","pi":"devaiḥ atra api vicikitsitam purā na hi su-jñeyam aṇuḥ eṣaḥ dharmaḥ anyam varam naciketaḥ vṛṇīṣva mā mā uparotsīḥ ati mā sṛja enam","w":[["देवैः","devaiḥ","by the gods","देव","deva","तृतीया, पुं, बहु","tṛtīyā, puṃ, bahu","m. ins. pl.",["deva"]],["अत्र","atra","on this","अत्र","atra","अव्यय","avyaya","indeclinable",["atra"]],["अपि","api","even","अपि","api","अव्यय","avyaya","indeclinable",["api"]],["विचिकित्सितम्","vicikitsitam","there was doubt","वि-चिकित्स्","vi-cikits","क्त, प्रथमा, नपुं, एक","kta, prathamā, napuṃ, eka","past passive participle n. nom. sg.",[]],["पुरा","purā","of old","पुरा","purā","अव्यय","avyaya","indeclinable",["purā"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["हि","hi","for","हि","hi","अव्यय","avyaya","indeclinable",["hi"]],["सु-ज्ञेयम्","su-jñeyam","easy to understand","सुज्ञेय","sujñeya","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["su","jñeya"]],["अणुः","aṇuḥ","subtle","अणु","aṇu","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["aṇu"]],["एषः","eṣaḥ","this","एतद्","etad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["etad"]],["धर्मः","dharmaḥ","matter","धर्म","dharma","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["dharma"]],["अन्यम्","anyam","another","अन्य","anya","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["anya"]],["वरम्","varam","boon","वर","vara","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["vara"]],["नचिकेतः","naciketaḥ","O Naciketas","नचिकेतस्","naciketas","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["naciketas"]],["वृणीष्व","vṛṇīṣva","choose","वृ","vṛ","लोट्, मध्यम, एक","loṭ, madhyama, eka","imperative 2nd sg.",["vṛ"]],["मा","mā","do not","मा","mā","अव्यय","avyaya","indeclinable",["mā"]],["मा","mā","me","अस्मद्","asmad","सर्वनाम, द्वितीया, एक","sarvanāma, dvitīyā, eka","pronoun acc. sg.",["asmad"]],["उपरोत्सीः"," r a great land. I will make you one who enjoys every desire.”","notes":["Śaṅkara: edhi, ‘be’, means ‘be king’. The desires are both divine and human; Yama can grant them because his will does not fail."],"by":null,"var":[],"x":false},{"n":"1.1.25","label":null,"d":"ये ये कामा दुर्लभा मर्त्यलोके सर्वान्कामांश्छन्दतः प्रार्थयस्व ।\nइमा रामाः सरथाः सतूर्या न हीदृशा लम्भनीया मनुष्यैः ।\nआभिर्मत्प्रत्ताभिः परिचारयस्व नचिकेतो मरणं मानुप्राक्षीः ॥ २५ ॥","i":"ye ye kāmā durlabhā martyaloke sarvān kāmāṃś chandataḥ prārthayasva |\nimā rāmāḥ sarathāḥ satūryā na hīdṛśā lambhanīyā manuṣyaiḥ |\nābhir matprattābhiḥ paricārayasva naciketo maraṇaṃ mānuprākṣīḥ || 25 ||","pd":"ये ये कामाः दुर्लभाः मर्त्य-लोके सर्वान् कामान् छन्दतः प्रार्थयस्व इमाः रामाः स-रथाः स-तूर्याः न हि ईदृशाः लम्भनीयाः मनुष्यैः आभिः मद्-प्रत्ताभिः परिचारयस्व नचिकेतः मरणम् मा अनुप्राक्षीः","pi":"ye ye kāmāḥ durlabhāḥ martya-loke sarvān kāmān chandataḥ prārthayasva imāḥ rāmāḥ sa-rathāḥ sa-tūryāḥ na hi īdṛśāḥ lambhanīyāḥ manuṣyaiḥ ābhiḥ mad-prattābhiḥ paricārayasva naciketaḥ maraṇam mā anuprākṣīḥ","w":[["ये","ye","whatever","यद्","yad","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["yad"]],["ये","ye","whatever","यद्","yad","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["yad"]],["कामाः","kāmāḥ","desires","काम","kāma","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["kāma"]],["दुर्लभाः","durlabhāḥ","hard to obtain","दुर्लभ","durlabha","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["durlabha"]],["मर्त्य-लोके","martya-loke","in the world of mortals","मर्त्यलोक","martyaloka","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["martyaloka"]],["सर्वान्","sarvān","all","सर्व","sarva","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["sarva"]],["कामान्","kāmān","desires","काम","kāma","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["kāma"]],["छन्दतः","chandataḥ","as you please","छन्दतस्","chandatas","अव्यय","avyaya","in
