anuprākṣīḥ","ask","अनु-प्रछ्","anu-prach","लुङ्, मध्यम, एक","luṅ, madhyama, eka","aorist 2nd sg.",["anuprach"]]],"t":"“Whatever desires are hard to obtain in the world of mortals, ask for them all as you please. Here are delightful women with chariots and musical instruments; such as these are not to be obtained by men. Have yourself served by them, given by me. But, O Naciketas, do not ask about death.”","notes":["Śaṅkara: rāmāḥ are heavenly nymphs, so called because they delight (ramayanti) men. The question about death is whether or not one exists after dying."],"by":null,"var":[],"x":false},{"n":"1.1.26","label":null,"d":"श्वोभावा मर्त्यस्य यदन्तकैतत्सर्वेन्द्रियाणां जरयन्ति तेजः ।\nअपि सर्वं जीवितमल्पमेव तवैव वाहास्तव नृत्यगीते ॥ २६ ॥","i":"śvobhāvā martyasya yad antakaitat sarvendriyāṇāṃ jarayanti tejaḥ |\napi sarvaṃ jīvitam alpam eva tavaiva vāhās tava nṛtyagīte || 26 ||","pd":"श्वोभावाः मर्त्यस्य यत् अन्तक एतत् सर्व-इन्द्रियाणाम् जरयन्ति तेजः अपि सर्वम् जीवितम् अल्पम् एव तव एव वाहाः तव नृत्य-गीते","pi":"śvobhāvāḥ martyasya yat antaka etat sarva-indriyāṇām jarayanti tejaḥ api sarvam jīvitam alpam eva tava eva vāhāḥ tava nṛtya-gīte","w":[["श्वोभावाः","śvobhāvāḥ","lasting only till tomorrow","श्वोभाव","śvobhāva","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["śvobhāva"]],["मर्त्यस्य","martyasya","of a mortal","मर्त्य","martya","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["martya"]],["यत्","yat","which","यद्","yad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["yad"]],["अन्तक","antaka","O Death","अन्तक","antaka","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["antaka"]],["एतत्","etat","this","एतद्","etad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["etad"]],["सर्व-इन्द्रियाणाम्","sarva-indriyāṇām","of all the senses","सर्वेन्द्रिय","sarvendriya","षष्ठी, नपुं, बहु","ṣaṣṭhī, napuṃ, bahu","n. gen. pl.",["sarva","indriya"]],["जरयन्ति","jarayanti","they wear away","जॄ","jṝ","लट्, प्रथम, बहु, णिजन्त","laṭ, prathama, bahu, ṇijanta","present 3rd pl. causative",["jṝ"]],["तेजः","tejaḥ","vigour","तेजस्","tejas","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["tejas"]],["अपि","api","even","अपि","api","अव्यय","avyaya","indeclinable",["api"]],["सर्वम्","sarvam","a whole","सर्व","sarva","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["sarva"]],["जीवितम्","jīvitam","life","जीवित","jīvita","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["jīvita"]],["अल्पम्","alpam","short","अल्प","alpa","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["alpa"]],["एव","eva","indeed","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["तव","tava","yours","युष्मद्","yuṣmad","सर्वनाम, षष्ठी, एक","sarvanāma, ṣaṣṭhī, eka","pronoun gen. sg.",["yuṣmad"]],["एव","eva","alone","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["वाहाः","vāhāḥ","the chariots","वाह","vāha","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["vāha"]],["तव","tava","yours","युष्मद्","yuṣmad","सर्वनाम, षष्ठी, एक","sarvanāma, ṣaṣṭhī, eka","pronoun gen. sg.",["yuṣmad"]],["नृत्य-गीते","nṛtya-gīte","dance and song","नृत्यगीत","nṛtyagīta","प्रथमा, नपुं, द्वि","prathamā, napuṃ, dvi","n. nom. du.",["nṛtyagīta"]]],"t":"“These things last only till tomorrow, O Death, and they wear away the vigour of all a mortal's senses. Even a whole life is short indeed. Let the chariots be yours alone, and yours the dance and song.”","notes":["Śaṅkara: śvobhāvāḥ: enjoyments of which it is doubtful whether they will be there tomorrow. They waste virtue, strength, understanding, vigour and good name. ‘A whole life’: even the lifespan of Brahmā is short."],"by":null,"var":[],"x":false},{"n":"1.1.27","label":null,"d":"न वित्तेन तर्पणीयो मनुष्यो लप्स्यामहे वित्तमद्राक्ष्म चेत्त्वा ।\nजीविष्यामो यावदीशिष्यसि त्वं वरस्तु मे वरणीयः स एव ॥ २७ ॥","i":"na vittena tarpaṇīyo manuṣyo lapsyāmahe vittam adrākṣma cet tvā |\njīviṣyāmo yāvad īśiṣyasi tvaṃ varas tu me varaṇīyaḥ sa eva || 27 ||","pd":"न वित्तेन तर्पणीयः मनुष्यः लप्स्यामहे वित्तम् अद्राक्ष्म चेत् त्वा जीविष्यामः यावत् ईशिष्यसि त्वम् वरः तु मे वरणीयः सः एव","pi":"na vittena tarpaṇīyaḥ manuṣyaḥ lapsyāmahe vittam adrākṣma cet tvā jīviṣyāmaḥ yāvat īśiṣyasi tvam varaḥ tu me varaṇīyaḥ saḥ eva","w":[["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["वित्तेन","vittena","by wealth","वित्त","vitta","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["vitta"]],["तर्पणीयः","tarpaṇīyaḥ","to be satisfied","तृप्","tṛp","कृत्य, प्रथमा, पुं, एक","kṛtya, prathamā, puṃ, eka","gerundive m. nom. sg.",["tṛp"]],["मनुष्यः","manuṣyaḥ","a man","मनुष्य","manuṣya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["manuṣya"]],["लप्स्यामहे","lapsyāmahe","we shall obtain","लभ्","labh","लृट्, उत्तम, बहु","lṛṭ, uttama, bahu","future 1st pl.",["labh"]],["वित्तम्","vittam","wealth","वित्त","vitta","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["vitta"]],["अद्राक्ष्म","adrākṣma","we have seen","दृश्","dṛś","लुङ्, उत्तम, बहु","luṅ, uttama, bahu","aorist 1st pl.",["dṛś"]],["चेत्","cet","since","चेद्","ced","अव्यय","avyaya","indeclinable",["ced"]],["त्वा","tvā","you","युष्मद्","yuṣmad","सर्वनाम, द्वितीया, एक","sarvanāma, dvitīyā, eka","pronoun acc. sg.",["yuṣmad"]],["जीविष्यामः","jīviṣyāmaḥ","we shall live","जीव्","jīv","लृट्, उत्तम, बहु","lṛṭ, uttama, bahu","future 1st pl.",["jīv"]],["यावत्","yāvat","as long as","यावत्","yāvat","अव्यय","avyaya","indeclinable",["yāvat"]],["ईशिष्यसि","īśiṣyasi","you rule","ईश्","īś","लृट्, मध्यम, एक","lṛṭ, madhyama, eka","future 2nd sg.",["īś"]],["त्वम्","tvam","you","युष्मद्","yuṣmad","सर्वनाम, प्रथमा, एक","sarvanāma, prathamā, eka","pronoun nom. sg.",["yuṣmad"]],["वरः","varaḥ","the boon","वर","vara","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vara"]],["तु","tu","but","तु","tu","अव्यय","avyaya","indeclinable",["tu"]],["मे","me","by me","अस्मद्","asmad","सर्वनाम, षष्ठी, एक","sarvanāma, ṣaṣṭhī, eka","pronoun gen. sg.",["asmad"]],["वरणीयः","varaṇīyaḥ","to be chosen","वृ","vṛ","कृत्य, प्रथमा, पुं, एक","kṛtya, prathamā, puṃ, eka","gerundive m. nom. sg.",["vṛ"]],["सः","saḥ","that","तद्","tad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["tad"]],["एव","eva","alone","एव","eva","अव्यय","avyaya","indeclinable",["eva"]]],"t":"“A man is not to be satisfied by wealth. If we want wealth, we shall have it, now that we have seen you; and we shall live as long as you rule. But the boon I must choose is that one alone.”","notes":["Śaṅkara: no gain of wealth has ever been seen to content anyone. ‘That one’: the knowledge of the Self."],"by":null,"var":[],"x":false},{"n":"1.1.28","label":null,"d":"अजीर्यताममृतानामुपेत्य जीर्यन्मर्त्यः क्वधःस्थः प्रजानन् ।\nअभिध्यायन्वर्णरतिप्रमोदानतिदीर्घे जीविते को रमेत ॥ २८ ॥","i":"ajīryatām amṛtānām upetya jīryan martyaḥ kvadhaḥsthaḥ prajānan |\nabhidhyāyan varṇaratipramodān atidīrghe jīvite ko rameta || 28 ||","pd":"अजीर्यताम् अमृतानाम् उपेत्य जीर्यन् मर्त्यः कु-अधःस्थः प्रजानन् अभिध्यायन् वर्ण-रति-प्रमोदान् अति-दीर्घे जीविते कः रमेत","pi":"ajīryatām amṛtānām upetya jīryan martyaḥ ku-adhaḥsthaḥ prajānan abhidhyāyan varṇa-rati-pramodān ati-dīrghe jīvite kaḥ rameta","w":[["अजीर्यताम्","ajīryatām","of the undecaying","अजीर्यत्","ajīryat","शतृ।शानच्, षष्ठी, पुं, बहु","śatṛ/śānac, ṣaṣṭhī, puṃ, bahu","present participle m. gen. pl.",["ajīryat"]],["अमृतानाम्","amṛtānām","immortals","अमृत","amṛta","षष्ठी, पुं, बहु","ṣaṣṭhī, puṃ, bahu","m. gen. pl.",["amṛta"]],["उपेत्य","upetya","having come near","उप-इ","upa-i","ल्यप्","lyap","absolutive",["upe"]],["जीर्यन्","jīryan","decaying","जॄ","jṝ","शतृ।शानच्, प्रथमा, पुं, एक","śatṛ/śānac, prathamā, puṃ, eka","present participle m. nom. sg.",["jṝ"]],["मर्त्यः","martyaḥ","a mortal","मर्त्य","martya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["martya"]],["कु-अधःस्थः","ku-adhaḥsthaḥ","dwelling on the earth below","क्वधःस्थ","kvadhaḥstha","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["kvadhaḥstha"]],["प्र ["प्रेयः","preyaḥ","the pleasant","प्रेयस्","preyas","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["preyas"]],["वृणीते","vṛṇīte","chooses","वृ","vṛ","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vṛ"]]],"t":"“The good is one thing, and the pleasant quite another. Both, having different ends, bind a person. Of the two, it goes well with him who takes up the good; he who chooses the pleasant falls away from the goal.”","notes":["Śaṅkara: Yama speaks. śreyas is the highest good (niḥśreyasa), preyas what is more pleasing. Being of the nature of knowledge and of ignorance, the two cannot be followed together by one person. The ‘goal’ is the true and lasting end of man."],"by":null,"var":[],"x":false},{"n":"1.2.2","label":null,"d":"श्रेयश्च प्रेयश्च मनुष्यमेतस्तौ सम्परीत्य विविनक्ति धीरः ।\nश्रेयो हि धीरोऽभि प्रेयसो वृणीते प्रेयो मन्दो योगक्षेमाद्वृणीते ॥ २ ॥","i":"śreyaś ca preyaś ca manuṣyam etas tau samparītya vivinakti dhīraḥ |\nśreyo hi dhīro 'bhi preyaso vṛṇīte preyo mando yogakṣemād vṛṇīte || 2 ||","pd":"श्रेयः च प्रेयः च मनुष्यम् एतः तौ सम्परीत्य विविनक्ति धीरः श्रेयः हि धीरः अभि प्रेयसः वृणीते प्रेयः मन्दः योगक्षेमात् वृणीते","pi":"śreyaḥ ca preyaḥ ca manuṣyam etaḥ tau samparītya vivinakti dhīraḥ śreyaḥ hi dhīraḥ abhi preyasaḥ vṛṇīte preyaḥ mandaḥ yogakṣemāt vṛṇīte","w":[["श्रेयः","śreyaḥ","the good","श्रेयस्","śreyas","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["śreyas"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["प्रेयः","preyaḥ","the pleasant","प्रेयस्","preyas","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["preyas"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["मनुष्यम्","manuṣyam","to a man","मनुष्य","manuṣya","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["manuṣya"]],["एतः","etaḥ","come","आ-इ","ā-i","लट्, प्रथम, द्वि","laṭ, prathama, dvi","present 3rd du.",["e"]],["तौ","tau","those two","तद्","tad","सर्वनाम, द्वितीया, पुं, द्वि","sarvanāma, dvitīyā, puṃ, dvi","pronoun m. acc. du.",["tad"]],["सम्परीत्य","samparītya","having examined well","सम्-परि-इ","sam-pari-i","ल्यप्","lyap","absolutive",["samparī"]],["विविनक्ति","vivinakti","tells apart","वि-विच्","vi-vic","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vivic"]],["धीरः","dhīraḥ","the wise one","धीर","dhīra","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["dhīra"]],["श्रेयः","śreyaḥ","the good","श्रेयस्","śreyas","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["śreyas"]],["हि","hi","indeed","हि","hi","अव्यय","avyaya","indeclinable",["hi"]],["धीरः","dhīraḥ","the wise one","धीर","dhīra","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["dhīra"]],["अभि","abhi","(with vṛṇīte)","अभि","abhi","अव्यय","avyaya","indeclinable",["abhi"]],["प्रेयसः","preyasaḥ","over the pleasant","प्रेयस्","preyas","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["preyas"]],["वृणीते","vṛṇīte","chooses","वृ","vṛ","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vṛ"]],["प्रेयः","preyaḥ","the pleasant","प्रेयस्","preyas","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["preyas"]],["मन्दः","mandaḥ","the dull one","मन्द","manda","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["manda"]],["योगक्षेमात्","yogakṣemāt","for the sake of getting and keeping","योगक्षेम","yogakṣema","पञ्चमी, पुं, एक","pañcamī, puṃ, eka","m. abl. sg.",["yogakṣema"]],["वृणीते","vṛṇīte","chooses","वृ","vṛ","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vṛ"]]],"t":"“Both the good and the pleasant come to a man. The wise one examines them well and tells them apart. The wise chooses the good over the pleasant; the dull chooses the pleasant, for the sake of getting and keeping.”","notes":["abhi … vṛṇīte is one verb (abhivṛṇīte), its parts separated in the verse.","Śaṅkara: the two come as though mixed together, hard for a dull mind to separate; the wise separates them as a swan separates milk from water. yogakṣema: the increase and protection of the body and the like. The pleasant is cattle, sons and so on."],"by":null,"var":[],"x":false},{"n":"1.2.3","label":null,"d":"स त्वं प्रियान्प्रियरूपांश्च कामानभिध्यायन्नचिकेतोऽत्यस्राक्षीः ।\nनैतां सृङ्कां वित्तमयीमवाप्तो यस्यां मज्जन्ति बहवो मनुष्याः ॥ ३ ॥","i":"sa tvaṃ priyān priyarūpāṃś ca kāmān abhidhyāyan naciketo 'tyasrākṣīḥ |\nnaitāṃ sṛṅkāṃ vittamayīm avāpto yasyāṃ majjanti bahavo manuṣyāḥ || 3 ||","pd":"सः त्वम् प्रियान् प्रिय-रूपान् च कामान् अभिध्यायन् नचिकेतः अत्यस्राक्षीः न एताम् सृङ्काम् वित्त-मयीम् अवाप्तः यस्याम् मज्जन्ति बहवः मनुष्याः","pi":"saḥ tvam priyān priya-rūpān ca kāmān abhidhyāyan naciketaḥ atyasrākṣīḥ na etām sṛṅkām vitta-mayīm avāptaḥ yasyām majjanti bahavaḥ manuṣyāḥ","w":[["सः","saḥ","such as you are","तद्","tad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["tad"]],["त्वम्","tvam","you","युष्मद्","yuṣmad","सर्वनाम, प्रथमा, एक","sarvanāma, prathamā, eka","pronoun nom. sg.",["yuṣmad"]],["प्रियान्","priyān","dear","प्रिय","priya","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["priya"]],["प्रिय-रूपान्","priya-rūpān","of pleasing form","प्रियरूप","priyarūpa","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["priyarūpa"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["कामान्","kāmān","objects of desire","काम","kāma","द्वितीया, पुं, बहु","dvitīyā, puṃ, bahu","m. acc. pl.",["kāma"]],["अभिध्यायन्","abhidhyāyan","reflecting on","अभि-ध्यै","abhi-dhyai","शतृ।शानच्, प्रथमा, पुं, एक","śatṛ/śānac, prathamā, puṃ, eka","present participle m. nom. sg.",["abhidhyai"]],["नचिकेतः","naciketaḥ","O Naciketas","नचिकेतस्","naciketas","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["naciketas"]],["अत्यस्राक्षीः","atyasrākṣīḥ","you have let go","अति-सृज्","ati-sṛj","लुङ्, मध्यम, एक","luṅ, madhyama, eka","aorist 2nd sg.",["atisṛj"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["एताम्","etām","this","एतद्","etad","सर्वनाम, द्वितीया, स्त्री, एक","sarvanāma, dvitīyā, strī, eka","prono oun gen. sg.",["asmad"]]],"t":"“The passing beyond does not show itself to the childish one, heedless and deluded by the delusion of wealth. Thinking ‘there is this world and no other’, he falls under my sway again and again.”","notes":["Śaṅkara: sāmparāya is the other world, and the scriptural means of reaching it. Such a man is born again and again and remains caught in the unbroken run of suffering that is birth and death. Most people are like this."],"by":null,"var":[],"x":false},{"n":"1.2.7","label":null,"d":"श्रवणायापि बहुभिर्यो न लभ्यः शृण्वन्तोऽपि बहवो यं न विद्युः ।\nआश्चर्यो वक्ता कुशलोऽस्य लब्धा आश्चर्यो ज्ञाता कुशलानुशिष्टः ॥ ७ ॥","i":"śravaṇāyāpi bahubhir yo na labhyaḥ śṛṇvanto 'pi bahavo yaṃ na vidyuḥ |\nāścaryo vaktā kuśalo 'sya labdhā āścaryo jñātā kuśalānuśiṣṭaḥ || 7 ||","pd":"श्रवणाय अपि बहुभिः यः न लभ्यः शृण्वन्तः अपि बहवः यम् न विद्युः आश्चर्यः वक्ता कुशलः अस्य लब्धा आश्चर्यः ज्ञाता कुशल-अनुशिष्टः","pi":"śravaṇāya api bahubhiḥ yaḥ na labhyaḥ śṛṇvantaḥ api bahavaḥ yam na vidyuḥ āścaryaḥ vaktā kuśalaḥ asya labdhā āścaryaḥ jñātā kuśala-anuśiṣṭaḥ","w":[["श्रवणाय","śravaṇāya","to hear of","श्रवण","śravaṇa","चतुर्थी, नपुं, एक","caturthī, napuṃ, eka","n. dat. sg.",["śravaṇa"]],["अपि","api","even","अपि","api","अव्यय","avyaya","indeclinable",["api"]],["बहुभिः","bahubhiḥ","by many","बहु","bahu","तृतीया, पुं, बहु","tṛtīyā, puṃ, bahu","m. ins. pl.",["bahu"]],["यः","yaḥ","who","यद्","yad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["yad"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["लभ्यः","labhyaḥ","to be attained","लभ्","labh","कृत्य, प्रथमा, पुं, एक","kṛtya, prathamā, puṃ, eka","gerundive m. nom. sg.",["labh"]],["शृण्वन्तः","śṛṇvantaḥ","hearing","श्रु","śru","शतृ।शानच्, प्रथमा, पुं, बहु","śatṛ/śānac, prathamā, puṃ, bahu","present participle m. nom. pl.",["śru"]],["अपि","api","even","अपि","api","अव्यय","avyaya","indeclinable",["api"]],["बहवः","bahavaḥ","many","बहु","bahu","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["bahu"]],["यम्","yam","whom","यद्","yad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["yad"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["विद्युः","vidyuḥ","would know","विद्","vid","विधिलिङ्, प्रथम, बहु","vidhiliṅ, prathama, bahu","optative 3rd pl.",["vid"]],["आश्चर्यः","āścaryaḥ","a wonder","आश्चर्य","āścarya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["āścarya"]],["वक्ता","vaktā","the teacher","वक्तृ","vaktṛ","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vaktṛ"]],["कुशलः","kuśalaḥ","skilful","कुशल","kuśala","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["kuśala"]],["अस्य","asya","of this","इदम्","idam","सर्वनाम, षष्ठी, पुं, एक","sarvanāma, ṣaṣṭhī, puṃ, eka","pronoun m. gen. sg.",["idam"]],["लब्धा","labdhā","the one who attains","लब्धृ","labdhṛ","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["labdhṛ"]],["आश्चर्यः","āścaryaḥ","a wonder","आश्चर्य","āścarya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["āścarya"]],["ज्ञाता","jñātā","the knower","ज्ञातृ","jñātṛ","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["jñātṛ"]],["कुशल-अनुशिष्टः","kuśala-anuśiṣṭaḥ","taught by a skilful teacher","कुशलानुशिष्ट","kuśalānuśiṣṭa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["kuśala","anuśiṣṭa"]]],"t":"“He of whom many do not get even to hear, and whom many do not know even when they hear: a wonder is the one who teaches him, and skilful the one who attains him; a wonder is the one who knows him, taught by a skilful teacher.”","notes":["Śaṅkara: ‘he’ is the Self. Among thousands, only one such as Naciketas seeks the good and comes to know the Self."],"by":null,"var":[],"x":false},{"n":"1.2.8","label":null,"d":"न नरेणावरेण प्रोक्त एष सुविज्ञेयो बहुधा चिन्त्यमानः ।\nअनन्यप्रोक्ते गतिरत्र नास्त्यणीयान्ह्यतर्क्यमणुप्रमाणात् ॥ ८ ॥","i":"na nareṇāvareṇa prokta eṣa suvijñeyo bahudhā cintyamānaḥ |\nananyaprokte gatir atra nāsty aṇīyān hy atarkyam aṇupramāṇāt || 8 ||","pd":"न नरेण अवरेण प्रोक्तः एषः सु-विज्ञेयः बहुधा चिन्त्यमानः अन्-अन्य-प्रोक्ते गतिः अत्र न अस्ति अणीयान् हि अ-तर्क्यम् अणु-प्रमाणात्","pi":"na nareṇa avareṇa proktaḥ eṣaḥ su-vijñeyaḥ bahudhā cintyamānaḥ an-anya-prokte gatiḥ atra na asti aṇīyān hi a-tarkyam aṇu-pramāṇāt","w":[["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["नरेण","nareṇa","by a man","नर","nara","तृतीया, पुं, एक","tṛtīyā, puṃ, eka","m. ins. sg.",["nara"]],["अवरेण","avareṇa","inferior","अवर","avara","तृतीया, पुं, एक","tṛtīyā, puṃ, eka","m. ins. sg.",["avara"]],["प्रोक्तः","proktaḥ","taught","प्र-वच्","pra-vac","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg.",["pravac"]],["एषः","eṣaḥ","this (Self)","एतद्","etad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["etad"]],["सु-विज्ञेयः","su-vijñeyaḥ","easy to understand well","सुविज्ञेय","suvijñeya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["suvijñeya"]],["बहुधा","bahudhā","in many ways","बहुधा","bahudhā","अव्यय","avyaya","indeclinable",["bahudhā"]],["चिन्त्यमानः","cintyamānaḥ","being thought of","चिन्त्","cint","शतृ।शानच्, प्रथमा, पुं, एक","śatṛ/śānac, prathamā, puṃ, eka","present participle m. nom. sg.",["cint"]],["अन्-अन्य-प्रोक्ते","an-anya-prokte","when taught by one who is not other","अनन्यप्रोक्त","ananyaprokta","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["an","anya","prokta"]],["गतिः","gatiḥ","going, wavering","गति","gati","प्रथमा, स्त्री, एक","prathamā, strī, eka","f. nom. sg.",["gati"]],["अत्र","atra","here","अत्र","atra","अव्यय","avyaya","indeclinable",["atra"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["अस्ति","asti","there is","अस्","as","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["as"]],["अणीयान्","aṇīyān","subtler","अणीयस्","aṇīyas","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["aṇīyas"]],["हि","hi","for","हि","hi","अव्यय","avyaya","indeclinable",["hi"]],["अ-तर्क्यम्","a-tarkyam","beyond reasoning","अतर्क्य","atarkya","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["atarkya"]],["अणु-प्रमाणात्","aṇu-pramāṇāt","than what is of minute measure","अणुप्रमाण","aṇupramāṇa","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["aṇu","pramāṇa"]]],"t":"“Taught by an inferior man, this Self is not easy to understand well, for it is thought of in many ways. When it is taught by one who is not other than it, there is no more wavering about it; for it is subtler than the subtlest and beyond the reach of reasoning.”","notes":["Śaṅkara: an inferior man is one of ordinary understanding. Disputants think of the Self variously: as existing or not, as agent or not, as pure or impure. ananyaprokte: taught by a teacher who sees no difference, who has become the Brahman he teaches.","Śaṅkara gives several senses for gatir atra nāsti: no more doubt of ‘is it or is it not’; nothing further left to be known; no more passage through birth and death; or, dividing the words as agatiḥ, no failure to understand."],"by":null,"var":[],"x":false},{"n":"1.2.9","label":null,"d":"नैषा तर्केण मतिरापनेया प्रोक्तान्येनैव सुज्ञानाय प्रेष्ठ ।\nयां त्वमापः सत्यधृतिर्बतासि त्वादृङ्नो भूयान्नचिकेतः प्रष्टा ॥ ९ ॥","i":"naiṣā tarkeṇa matir āpaneyā proktānyenaiva sujñānāya preṣṭha |\nyāṃ tvam āpaḥ satyadhṛtir batāsi tvādṛṅ no bhūyān naciketaḥ praṣṭā || 9 ||","pd":"न एषा तर्केण मतिः आपनेया प्रोक्ता अन्येन एव सु-ज्ञानाय प्रेष्ठ याम् त्वम् आपः सत्य-धृतिः बत असि त्वादृक् नः भूयात् नचिकेतः प्रष्टा","pi":"na eṣā tarkeṇa matiḥ āpaneyā proktā anyena eva su-jñānāya preṣṭha yām tvam āpaḥ satya-dhṛtiḥ bata asi tvādṛk naḥ bhūyāt naciketaḥ praṣṭā","w":[["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["एषा","eṣā","this","एतद्","etad","सर्वनाम, प्रथमा, स्त्री, एक","sarvanāma, prathamā, strī, eka","pronoun f. nom. sg.",["etad"]],["तर्केण","tarkeṇa","by reasoning","तर्क","tarka","तृतीया, पुं, एक","tṛtīyā, puṃ, eka","m. ins. sg.",["tarka"]],["मतिः","matiḥ","unders questioner","प्रष्टृ","praṣṭṛ","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["praṣṭṛ"]]],"t":"“This understanding is not to be reached by reasoning. Taught by another, dearest one, it leads to sound knowledge. You have attained it. Ah, you are of true resolve! May we have a questioner like you, O Naciketas.”","notes":["Śaṅkara: ‘another’ is a teacher versed in the scriptures, as distinct from a mere reasoner. āpaneyā: ‘to be reached’; or else ‘to be set aside’, in which case the sense is that this understanding is not to be given up for reasoning.","bhūyāt is a benedictive (āśīrliṅ); it is labelled here as an optative."],"by":null,"var":[],"x":false},{"n":"1.2.10","label":null,"d":"जानाम्यहं शेवधिरित्यनित्यं न ह्यध्रुवैः प्राप्यते हि ध्रुवं तत् ।\nततो मया नाचिकेतश्चितोऽग्निरनित्यैर्द्रव्यैः प्राप्तवानस्मि नित्यम् ॥ १० ॥","i":"jānāmy ahaṃ śevadhir ity anityaṃ na hy adhruvaiḥ prāpyate hi dhruvaṃ tat |\ntato mayā nāciketaś cito 'gnir anityair dravyaiḥ prāptavān asmi nityam || 10 ||","pd":"जानामि अहम् शेवधिः इति अनित्यम् न हि अध्रुवैः प्राप्यते हि ध्रुवम् तत् ततः मया नाचिकेतः चितः अग्निः अनित्यैः द्रव्यैः प्राप्तवान् अस्मि नित्यम्","pi":"jānāmi aham śevadhiḥ iti anityam na hi adhruvaiḥ prāpyate hi dhruvam tat tataḥ mayā nāciketaḥ citaḥ agniḥ anityaiḥ dravyaiḥ prāptavān asmi nityam","w":[["जानामि","jānāmi","I know","ज्ञा","jñā","लट्, उत्तम, एक","laṭ, uttama, eka","present 1st sg.",["jñā"]],["अहम्","aham","I","अस्मद्","asmad","सर्वनाम, प्रथमा, एक","sarvanāma, prathamā, eka","pronoun nom. sg.",["asmad"]],["शेवधिः","śevadhiḥ","treasure","शेवधि","śevadhi","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["śevadhi"]],["इति","iti","what is called","इति","iti","अव्यय","avyaya","indeclinable",["iti"]],["अनित्यम्","anityam","impermanent","अनित्य","anitya","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["anitya"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["हि","hi","for","हि","hi","अव्यय","avyaya","indeclinable",["hi"]],["अध्रुवैः","adhruvaiḥ","by unstable things","अध्रुव","adhruva","तृतीया, नपुं, बहु","tṛtīyā, napuṃ, bahu","n. ins. pl.",["adhruva"]],["प्राप्यते","prāpyate","is attained","प्र-आप्","pra-āp","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["prāp"]],["हि","hi","indeed","हि","hi","अव्यय","avyaya","indeclinable",["hi"]],["ध्रुवम्","dhruvam","stable","ध्रुव","dhruva","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["dhruva"]],["तत्","tat","that","तद्","tad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["tad"]],["ततः","tataḥ","therefore","ततस्","tatas","अव्यय","avyaya","indeclinable",["tatas"]],["मया","mayā","by me","अस्मद्","asmad","सर्वनाम, तृतीया, एक","sarvanāma, tṛtīyā, eka","pronoun ins. sg.",["asmad"]],["नाचिकेतः","nāciketaḥ","the Nāciketa","नाचिकेत","nāciketa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["nāciketa"]],["चितः","citaḥ","was built","चि","ci","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg.",["ci"]],["अग्निः","agniḥ","fire","अग्नि","agni","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["agni"]],["अनित्यैः","anityaiḥ","with impermanent","अनित्य","anitya","तृतीया, नपुं, बहु","tṛtīyā, napuṃ, bahu","n. ins. pl.",["anitya"]],["द्रव्यैः","dravyaiḥ","things","द्रव्य","dravya","तृतीया, नपुं, बहु","tṛtīyā, napuṃ, bahu","n. ins. pl.",["dravya"]],["प्राप्तवान्","prāptavān","have attained","प्र-आप्","pra-āp","क्तवतु, प्रथमा, पुं, एक","ktavatu, prathamā, puṃ, eka","past active participle m. nom. sg.",["prāp"]],["अस्मि","asmi","I","अस्","as","लट्, उत्तम, एक","laṭ, uttama, eka","present 1st sg.",["as"]],["नित्यम्","nityam","what is lasting","नित्य","nitya","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["nitya"]]],"t":"“I know that what is called treasure is impermanent, for what is stable is not attained by things that are unstable. Therefore I built the Nāciketa fire with impermanent things, and I have attained what is lasting.”","notes":["Śaṅkara: Yama, pleased, speaks again. The treasure is the fruit of rites. The ‘lasting’ that he gained is the station of Yama, called heaven, which lasts only in a relative sense; the truly stable treasure, the supreme Self, is not reached by such means."],"by":null,"var":[],"x":false},{"n":"1.2.11","label":null,"d":"कामस्य आप्तिं जगतः प्रतिष्ठां क्रतोरनन्त्यमभयस्य पारम् ।\nस्तोममहदुरुगायं प्रतिष्ठां दृष्ट्वा धृत्या धीरो नचिकेतोऽत्यस्राक्षीः ॥ ११ ॥","i":"kāmasya āptiṃ jagataḥ pratiṣṭhāṃ krator anantyam abhayasya pāram |\nstomamahad urugāyaṃ pratiṣṭhāṃ dṛṣṭvā dhṛtyā dhīro naciketo 'tyasrākṣīḥ || 11 ||","pd":"कामस्य आप्तिम् जगतः प्रतिष्ठाम् क्रतोः अनन्त्यम् अभयस्य पारम् स्तोम-महत् उरु-गायम् प्रतिष्ठाम् दृष्ट्वा धृत्या धीरः नचिकेतः अत्यस्राक्षीः","pi":"kāmasya āptim jagataḥ pratiṣṭhām kratoḥ anantyam abhayasya pāram stoma-mahat uru-gāyam pratiṣṭhām dṛṣṭvā dhṛtyā dhīraḥ naciketaḥ atyasrākṣīḥ","w":[["कामस्य","kāmasya","of desire","काम","kāma","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["kāma"]],["आप्तिम्","āptim","the fulfilment","आप्ति","āpti","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["āpti"]],["जगतः","jagataḥ","of the world","जगत्","jagat","षष्ठी, नपुं, एक","ṣaṣṭhī, napuṃ, eka","n. gen. sg.",["jagat"]],["प्रतिष्ठाम्","pratiṣṭhām","the support","प्रतिष्ठा","pratiṣṭhā","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["pratiṣṭhā"]],["क्रतोः","kratoḥ","of meditation","क्रतु","kratu","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["kratu"]],["अनन्त्यम्","anantyam","the endless (fruit)","आनन्त्य","ānantya","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["ānantya"]],["अभयस्य","abhayasya","of fearlessness","अभय","abhaya","षष्ठी, नपुं, एक","ṣaṣṭhī, napuṃ, eka","n. gen. sg.",["abhaya"]],["पारम्","pāram","the farther shore","पार","pāra","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["pāra"]],["स्तोम-महत्","stoma-mahat","worthy of praise and great","स्तोममहत्","stomamahat","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["stoma","mahat"]],["उरु-गायम्","uru-gāyam","the far-reaching course","उरुगाय","urugāya","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["urugāya"]],["प्रतिष्ठाम्","pratiṣṭhām","the firm standing","प्रतिष्ठा","pratiṣṭhā","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["pratiṣṭhā"]],["दृष्ट्वा","dṛṣṭvā","having seen","दृश्","dṛś","क्त्वा","ktvā","absolutive",["dṛś"]],["धृत्या","dhṛtyā","with firmness","धृति","dhṛti","तृतीया, स्त्री, एक","tṛtīyā, strī, eka","f. ins. sg.",["dhṛti"]],["धीरः","dhīraḥ","being wise","धीर","dhīra","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["dhīra"]],["नचिकेतः","naciketaḥ","O Naciketas","नचिकेतस्","naciketas","सम्बोधन, पुं, एक","sambodhana, puṃ, eka","m. voc. sg.",["naciketas"]],["अत्यस्राक्षीः","atyasrākṣīḥ","you have let go","अति-सृज्","ati-sṛj","लुङ्, मध्यम, एक","luṅ, madhyama, eka","aorist 2nd sg.",["atisṛj"]]],"t":"“The fulfilment of desire, the support of the world, the endless fruit of meditation, the farther shore of fearlessness, great and worthy of praise, far-reaching, a firm standing: having seen all this, O Naciketas, you, being wise, have with firmness let it go.”","notes":["Śaṅkara: all of this describes the state of Hiraṇyagarbha, the fruit of meditation (kratu here is upāsanā). Naciketas gave up even that, desiring only the highest."],"by":null,"var":[],"x":false},{"n":"1.2.12","label":null,"d":"तं दुर्दर्शं गूढमनुप्रविष्टं गुहाहितं गह्वरेष्ठं पुराणम् ।\nअध्यात्मयोगाधिगमेन देवं मत्वा धीरो हर्षशोकौ जहाति ॥ १२ ॥","i":"taṃ durdarśaṃ gūḍham anupraviṣṭaṃ guhāhitaṃ gahvareṣṭhaṃ purāṇam |\nadhyātmayogādhigamena devaṃ matvā dhīro harṣaśokau jahāti || 12 ||","pd":"तम् दुर्दर्शम् गूढम् अनुप्रविष्टम् गुहा-हितम् गह्वरेष्ठम् पुराणम् अध्यात्म-योग-अधिगमेन देवम् मत्वा धीरः हर्ष-शोकौ जहाति","pi":"tam durdarśam gūḍham anupraviṣṭam guhā-hitam gahvareṣṭham purāṇam adhyātma-yoga-adhigamena devam matvā dhīraḥ harṣa-śokau jahāti","w":[["तम्","tam","him","तद्","tad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["tad"]],["दुर्दर्शम्","durdarśam","hard to see","दुर्दर्श","durdarśa","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["durdarśa"]],["गूढम्","gūḍham","what is hidden","गुह्","guh","क्त, द्वितीया, नपुं, एक","kta, dvitīyā, napuṃ, eka","past passive participle n. acc. sg.",["guh"]],["अनुप्रविष्टम्","anupraviṣṭam","who has entered into","अनु-प्र-विश्","anu-pra-viś","क्त, द्वितीया, पुं, एक","kta, dvitīyā, puṃ, eka","past passive participle m. acc. sg.",["anupraviś"]],["गुहा-हितम्","guhā-hitam","set in the cave","गुहाहित","guhāhita","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["guhāhita"]],["गह्वरेष्ठम्","gahvareṣṭham","dwelling in the deep","गह्वरेष्ठ","gahvareṣṭha","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["gahvareṣṭha"]],["पुराणम्","purāṇam","ancient","पुराण","purāṇa","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["purāṇa"]],["अध्यात्म-योग-अधिगमेन","adhyātma-yoga-adhigamena","by attaining concentration on the Self","अध्यात्मयोगाधिगम","adhyātmayogādhigama","तृतीया, पुं, एक","tṛtīyā, puṃ, eka","m. ins. sg.",["adhyātma","yoga","adhigama"]],["देवम्","devam","the shining one","देव","deva","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["deva"]],["मत्वा","matvā","having known","मन्","man","क्त्वा","ktvā","absolutive",["man"]],["धीरः","dhīraḥ","the wise one","धीर","dhīra","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["dhīra"]],["हर्ष-शोकौ","harṣa-śokau","joy and sorrow","हर्षशोक","harṣaśoka","द्वितीया, पुं, द्वि","dvitīyā, puṃ, dvi","m. acc. du.",["harṣaśoka"]],["जहाति","jahāti","leaves behind","हा","hā","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["hā"]]],"t":"“Him who is hard to see, who has entered into what is hidden, who is set in the cave and dwells in the deep, the ancient one: knowing that shining one by fixing the mind on the Self, the wise man leaves joy and sorrow behind.”","notes":["Śaṅkara: this is the Self that Naciketas wishes to know, hidden by the perceptions of ordinary objects. The cave is the intellect, where it is perceived; the ‘deep’ is a hard place crowded with many evils. adhyātmayoga: withdrawing the mind from objects and settling it on the Self. deva is the Self."],"by":null,"var":[],"x":false},{"n":"1.2.13","label":null,"d":"एतच्छ्रुत्वा सम्परिगृह्य मर्त्यः प्रवृह्य धर्म्यमणुमेतमाप्य ।\nस मोदते मोदनीयं हि लब्ध्वा विवृतं सद्म नचिकेतसं मन्ये ॥ १३ ॥","i":"etacchrutvā samparigṛhya martyaḥ pravṛhya dharmyam aṇum etam āpya |\nsa modate modanīyaṃ hi labdhvā vivṛtaṃ sadma naciketasaṃ manye || 13 ||","pd":"एतत् श्रुत्वा सम्परिगृह्य मर्त्यः प्रवृह्य धर्म्यम् अणुम् एतम् आप्य सः मोदते मोदनीयम् हि लब्ध्वा विवृतम् सद्म नचिकेतसम् मन्ये","pi":"etat śrutvā samparigṛhya martyaḥ pravṛhya dharmyam aṇum etam āpya saḥ modate modanīyam hi labdhvā vivṛtam sadma naciketasam manye","w":[["एतत्","etat","this","एतद्","etad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["etad"]],["श्रुत्वा","śrutvā","having heard","श्रु","śru","क्त्वा","ktvā","absolutive",["śru"]],["सम्परिगृह्य","samparigṛhya","having grasped fully","सम्-परि-ग्रह्","sam-pari-grah","ल्यप्","lyap","absolutive",["samparigrah"]],["मर्त्यः","martyaḥ","a mortal","मर्त्य","martya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["martya"]],["प्रवृह्य","pravṛhya","having drawn out","प्र-वृह्","pra-vṛh","ल्यप्","lyap","absolutive",["pravṛh"]],["धर्म्यम्","dharmyam","in accord with dharma","धर्म्य","dharmya","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["dharmya"]],["अणुम्","aṇum","subtle","अणु","aṇu","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["aṇu"]],["एतम्","etam","this (Self)","एतद्","etad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["etad"]],["आप्य","āpya","having attained","आप्","āp","ल्यप्","lyap","absolutive",["āp"]],["सः","saḥ","he","तद्","tad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["tad"]],["मोदते","modate","rejoices","मुद्","mud","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["mud"]],["मोदनीयम्","modanīyam","what is worth rejoicing in","मुद्","mud","कृत्य, द्वितीया, पुं, एक","kṛtya, dvitīyā, puṃ, eka","gerundive m. acc. sg.",["mud"]],["हि","hi","for","हि","hi","अव्यय","avyaya","indeclinable",["hi"]],["लब्ध्वा","labdhvā","having gained","लभ्","labh","क्त्वा","ktvā","absolutive",["labh"]],["विवृतम्","vivṛtam","open","वि-वृ","vi-vṛ","क्त, द्वितीया, नपुं, एक","kta, dvitīyā, napuṃ, eka","past passive participle n. acc. sg.",["vivṛ"]],["सद्म","sadma","the abode","सद्मन्","sadman","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["sadman"]],["नचिकेतसम्","naciketasam","for Naciketas","नचिकेतस्","naciketas","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["naciketas"]],["मन्ये","manye","I think","मन्","man","लट्, उत्तम, एक","laṭ, uttama, eka","present 1st sg.",["man"]]],"t":"“Having heard this and grasped it fully, having drawn out this subtle Self, which accords with dharma, and attained it, the mortal rejoices, for he has gained what is worth rejoicing in. The abode, I think, stands open for Naciketas.”","notes":["Śaṅkara: pravṛhya: setting the Self apart from the body and the rest. The abode is Brahman, its door open to Naciketas: ‘I consider you fit for liberation.’"],"by":null,"var":[],"x":false},{"n":"1.2.14","label":null,"d":"अन्यत्र धर्मादन्यत्राधर्मादन्यत्रास्मात्कृताकृतात् ।\nअन्यत्र भूताच्च भव्याच्च यत्तत्पश्यसि तद्वद ॥ १४ ॥","i":"anyatra dharmād anyatrādharmād anyatrāsmāt kṛtākṛtāt |\nanyatra bhūtāc ca bhavyāc ca yat tat paśyasi tad vada || 14 ||","pd":"अन्यत्र धर्मात् अन्यत्र अधर्मात् अन्यत्र अस्मात् कृत-अकृतात् अन्यत्र भूतात् च भव्यात् च यत् तत् पश्यसि तत् वद","pi":"anyatra dharmāt anyatra adharmāt anyatra asmāt kṛta-akṛtāt anyatra bhūtāt ca bhavyāt ca yat tat paśyasi tat vada","w":[["अन्यत्र","anyatra","apart from","अन्यत्र","anyatra","अव्यय","avyaya","indeclinable",["anyatra"]],["धर्मात्","dharmāt","righteousness","धर्म","dharma","पञ्चमी, पुं, एक","pañcamī, akṛta the cause. With past and future the present too is meant: that which the three times do not limit."],"by":null,"var":[],"x":false},{"n":"1.2.15","label":null,"d":"सर्वे वेदा यत्पदमामनन्ति तपांसि सर्वाणि च यद्वदन्ति ।\nयदिच्छन्तो ब्रह्मचर्यं चरन्ति तत्ते पदं संग्रहेण ब्रवीमि ओमित्येतत् ॥ १५ ॥","i":"sarve vedā yat padam āmananti tapāṃsi sarvāṇi ca yad vadanti |\nyad icchanto brahmacaryaṃ caranti tat te padaṃ saṃgraheṇa bravīmi om ity etat || 15 ||","pd":"सर्वे वेदाः यत् पदम् आमनन्ति तपांसि सर्वाणि च यत् वदन्ति यत् इच्छन्तः ब्रह्मचर्यम् चरन्ति तत् ते पदम् संग्रहेण ब्रवीमि ॐ इति एतत्","pi":"sarve vedāḥ yat padam āmananti tapāṃsi sarvāṇi ca yat vadanti yat icchantaḥ brahmacaryam caranti tat te padam saṃgraheṇa bravīmi om iti etat","w":[["सर्वे","sarve","all","सर्व","sarva","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["sarva"]],["वेदाः","vedāḥ","the Vedas","वेद","veda","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["veda"]],["यत्","yat","which","यद्","yad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["yad"]],["पदम्","padam","goal","पद","pada","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["pada"]],["आमनन्ति","āmananti","declare","आ-म्ना","ā-mnā","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["āmnā"]],["तपांसि","tapāṃsi","austerities","तपस्","tapas","प्रथमा, नपुं, बहु","prathamā, napuṃ, bahu","n. nom. pl.",["tapas"]],["सर्वाणि","sarvāṇi","all","सर्व","sarva","सर्वनाम, प्रथमा, नपुं, बहु","sarvanāma, prathamā, napuṃ, bahu","pronoun n. nom. pl.",["sarva"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["यत्","yat","which","यद्","yad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. acc. sg.",["yad"]],["वदन्ति","vadanti","speak of","वद्","vad","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["vad"]],["यत्","yat","which","यद्","yad","सर्वनाम, द्वितीया, नपुं, एक","sarvanāma, dvitīyā, napuṃ, eka","pronoun n. a ],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["अयम्","ayam","this","इदम्","idam","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["idam"]],["कुतश्चित्","kutaścit","from anything","कुतश्चित्","kutaścit","अव्यय","avyaya","indeclinable",[]],["न","na","nor","न","na","अव्यय","avyaya","indeclinable",["na"]],["बभूव","babhūva","came to be","भू","bhū","लिट्, प्रथम, एक","liṭ, prathama, eka","perfect 3rd sg.",["bhū"]],["कश्चित्","kaścit","anything","कश्चित्","kaścit","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",[]],["अजः","ajaḥ","unborn","अज","aja","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["aja"]],["नित्यः","nityaḥ","eternal","नित्य","nitya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["nitya"]],["शाश्वतः","śāśvataḥ","everlasting","शाश्वत","śāśvata","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["śāśvata"]],["अयम्","ayam","this","इदम्","idam","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["idam"]],["पुराणः","purāṇaḥ","ancient","पुराण","purāṇa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["purāṇa"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["हन्यते","hanyate","is slain","हन्","han","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["han"]],["हन्यमाने","hanyamāne","when … is slain","हन्","han","शतृ।शानच्, सप्तमी, नपुं, एक","śatṛ/śānac, saptamī, napuṃ, eka","present participle n. loc. sg.",["han"]],["शरीरे","śarīre","the body","शरीर","śarīra","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg.",["śarīra"]]],"t":"“The knowing Self is not born, nor does it die. It did not come from anything, nor did anything come from it. Unborn, eternal, everlasting and ancient, it is not slain when the body is slain.”","notes":["Śaṅkara: vipaścit, ‘intelligent’, because its nature as consciousness is never lost. Birth and death, the first and last of the changes that belong to things that arise, are denied so as to deny all change. purāṇa: ‘new even of old’, that is, without growth. It is in the body as space is."],"by":null,"var":[],"x":false},{"n":"1.2.19","label":null,"d":"हन्ता चेन्मन्यते हन्तुं हतश्चेन्मन्यते हतम् ।\nउभौ तौ न विजानीतो नायं हन्ति न हन्यते ॥ १९ ॥","i":"hantā cen manyate hantuṃ hataś cen manyate hatam |\nubhau tau na vijānīto nāyaṃ hanti na hanyate || 19 ||","pd":"हन्ता चेत् मन्यते हन्तुम् हतः चेत् मन्यते हतम् उभौ तौ न विजानीतः न अयम् हन्ति न हन्यते","pi":"hantā cet manyate hantum hataḥ cet manyate hatam ubhau tau na vijānītaḥ na ayam hanti na hanyate","w":[["हन्ता","hantā","the slayer","हन्तृ","hantṛ","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["hantṛ"]],["चेत्","cet","if","चेद्","ced","अव्यय","avyaya","indeclinable",["ced"]],["मन्यते","manyate","thinks","मन्","man","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["man"]],["हन्तुम्","hantum","to slay","हन्","han","तुमुन्","tumun","infinitive",["han"]],["हतः","hataḥ","the slain","हन्","han","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg.",["han"]],["चेत्","cet","if","चेद्","ced","अव्यय","avyaya","indeclinable",["ced"]],["मन्यते","manyate","thinks","मन्","man","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["man"]],["हतम्","hatam","(himself) slain","हन्","han","क्त, द्वितीया, पुं, एक","kta, dvitīyā, puṃ, eka","past passive participle m. acc. sg.",["han"]],["उभौ","ubhau","both","उभ","ubha","प्रथमा, पुं, द्वि","prathamā, puṃ, dvi","m. nom. du.",["ubha"]],["तौ","tau","those two","तद्","tad","सर्वनाम, प्रथमा, पुं, द्वि","sarvanāma, prathamā, puṃ, dvi","pronoun m. nom. du.",["tad"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["विजानीतः","vijānītaḥ","know","वि-ज्ञा","vi-jñā","लट्, प्रथम, द्वि","laṭ, prathama, dvi","present 3rd du.",["vijñā"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["अयम्","ayam","this","इदम्","idam","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["idam"]],["हन्ति","hanti","slays","हन्","han","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["han"]],["न","na","nor","न","na","अव्यय","avyaya","indeclinable",["na"]],["हन्यते","hanyate","is slain","हन्","han","लट्, प्रथम, एक, कर्मणि","laṭ, prathama, eka, karmaṇi","present 3rd sg. passive",["han"]]],"t":"“If the slayer thinks that he slays, and if the slain thinks himself slain, neither of the two knows. This Self does not slay, nor is it slain.”","notes":["Śaṅkara: both take the body alone to be the Self. The cycle of birth and death, with its merit and demerit, belongs only to one who does not know the Self."],"by":null,"var":[],"x":false},{"n":"1.2.20","label":null,"d":"अणोरणीयान्महतो महीयानात्मास्य जन्तोर्निहितो गुहायाम् ।\nतमक्रतुः पश्यति वीतशोको धातुप्रसादान्महिमानमात्मनः ॥ २० ॥","i":"aṇor aṇīyān mahato mahīyān ātmāsya jantor nihito guhāyām |\ntam akratuḥ paśyati vītaśoko dhātuprasādān mahimānam ātmanaḥ || 20 ||","pd":"अणोः अणीयान् महतः महीयान् आत्मा अस्य जन्तोः निहितः गुहायाम् तम् अक्रतुः पश्यति वीत-शोकः धातु-प्रसादात् महिमानम् आत्मनः","pi":"aṇoḥ aṇīyān mahataḥ mahīyān ātmā asya jantoḥ nihitaḥ guhāyām tam akratuḥ paśyati vīta-śokaḥ dhātu-prasādāt mahimānam ātmanaḥ","w":[["अणोः","aṇoḥ","than the subtle","अणु","aṇu","पञ्चमी, पुं, एक","pañcamī, puṃ, eka","m. abl. sg.",["aṇu"]],["अणीयान्","aṇīyān","subtler","अणीयस्","aṇīyas","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["aṇīyas"]],["महतः","mahataḥ","than the great","महत्","mahat","पञ्चमी, पुं, एक","pañcamī, puṃ, eka","m. abl. sg.",["mahat"]],["महीयान्","mahīyān","greater","महीयस्","mahīyas","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["mahīyas"]],["आत्मा","ātmā","the Self","आत्मन्","ātman","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["ātman"]],["अस्य","asya","of this","इदम्","idam","सर्वनाम, षष्ठी, पुं, एक","sarvanāma, ṣaṣṭhī, puṃ, eka","pronoun m. gen. sg.",["idam"]],["जन्तोः","jantoḥ","creature","जन्तु","jantu","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["jantu"]],["निहितः","nihitaḥ","is set","नि-धा","ni-dhā","क्त, प्रथमा, पुं, एक","kta, prathamā, puṃ, eka","past passive participle m. nom. sg.",["nidhā"]],["गुहायाम्","guhāyām","in the cave","गुहा","guhā","सप्तमी, स्त्री, एक","saptamī, strī, eka","f. loc. sg.",["guhā"]],["तम्","tam","that","तद्","tad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["tad"]],["अक्रतुः","akratuḥ","one free from desire","अक्रतु","akratu","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["akratu"]],["पश्यति","paśyati","sees","दृश्","dṛś","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["dṛś"]],["वीत-शोकः","vīta-śokaḥ","free from sorrow","वीतशोक","vītaśoka","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["vītaśoka"]],["धातु-प्रसादात्","dhātu-prasādāt","through the serenity of the organs","धातुप्रसाद","dhātuprasāda","पञ्चमी, पुं, एक","pañcamī, puṃ, eka","m. abl. sg.",["dhātu","prasāda"]],["महिमानम्","mahimānam","the greatness","महिमन्","mahiman","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["mahiman"]],["आत्मनः","ātmanaḥ","of the Self","आत्मन्","ātman","षष्ठी, पुं, एक","ṣaṣṭhī, puṃ, eka","m. gen. sg.",["ātman"]]],"t":"“Subtler than the subtle, greater than the great, the Self is set in the cave of the heart of this creature. One who is free from desire sees that greatness of the Self through the serenity of the mind and senses, and becomes free from sorrow.”","notes":["Śaṅkara: the cave is the heart, of every creature from Brahmā down to a tuft of grass. akratu: without desire, the mind withdrawn from outer objects, seen and unseen. The dhātus are the mind and the other organs, so called because they sustain the body. The greatness of the Self neither grows nor declines through action; he sees it directly, as ‘I am this’."],"by":null,"var":[],"x":false},{"n":"1.2.21","label":null,"d":"आसीनो दूरं व्रजति शयानो याति सर्वतः ।\nकस्तं मदामदं देवं मदन्यो ज्ञातुमर्हति ॥ २१ ॥","i":"āsīno dūraṃ vrajati śayāno yāti sarvataḥ |\nkas taṃ madāmadaṃ devaṃ mad anyo jñātum arhati || 21 ||","pd":"आसीनः दूरम् व्रजति शयानः याति सर्वतः कः तम् मदामदम् देवम् मत् अन्यः ज्ञातुम् अर्हति","pi":"āsīnaḥ dūram vrajati śayānaḥ yāti sarvataḥ kaḥ tam madāmadam devam mat anyaḥ jñātum arhati","w":[["आसीनः","āsīnaḥ","sitting","आस्","ās","शतृ।शानच्, प्रथमा, पुं, एक","śatṛ/śānac, prathamā, puṃ, eka","present participle m. nom. sg.",["ās"]],["दूरम्","dūram","far","दूरम्","dūram","अव्यय","avyaya","indeclinable",["dūram"]],["व्रजति","vrajati","travels","व्रज्","vraj","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vraj"]],["शयानः","śayānaḥ","lying down","शी","śī","शतृ।शानच्, प्रथमा, पुं, एक","śatṛ/śānac, prathamā, puṃ, eka","present participle m. nom. sg.",["śī"]],["याति","yāti","goes","या","yā","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["yā"]],["सर्वतः","sarvataḥ","everywhere","सर्वतस्","sarvatas","अव्यय","avyaya","indeclinable",["sarvatas"]],["कः","kaḥ","who","किम्","kim","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["kim"]],["तम्","tam","that","तद्","tad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["tad"]],["मदामदम्","madāmadam","who rejoices and does not rejoice","मदामद","madāmada","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["madāmada"]],["देवम्","devam","shining one","देव","deva","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["deva"]],["मत्","mat","than I","अस्मद्","asmad","सर्वनाम, पञ्चमी, एक","sarvanāma, pañcamī, eka","pronoun abl. sg.",["asmad"]],["अन्यः","anyaḥ","other","अन्य","anya","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["anya"]],["ज्ञातुम्","jñātum","to know","ज्ञा","jñā","तुमुन्","tumun","infinitive",["jñā"]],["अर्हति","arhati","is able","अर्ह्","arh","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["arh"]]],"t":"“Sitting, it travels far; lying down, it goes everywhere. Who other than I can know that shining one, who both rejoices and does not rejoice?”","notes":["Śaṅkara: because of its limiting adjuncts the Self seems to have opposed qualities, rest and movement, joy and its absence, as a jewel shows many colours. So it is hard to know, except for one of subtle understanding such as Yama. ‘Lying down’: when the organs are at rest and particular cognition has ceased."],"by":null,"var":[],"x":false},{"n":"1.2.22","label":null,"d":"अशरीरं शरीरेषु अनवस्थेष्ववस्थितम् ।\nमहान्तं विभुमात्मानं मत्वा धीरो न शोचति ॥ २२ ॥","i":"aśarīraṃ śarīreṣu anavastheṣv avasthitam |\nmahāntaṃ vibhum ātmānaṃ matvā dhīro na śocati || 22 ||","pd":"अशरीरम् शरीरेषु अनवस्थेषु अवस्थितम् महान्तम् विभुम् आत्मानम् मत्वा धीरः न शोचति","pi":"aśarīram śarīreṣu anavastheṣu avasthitam mahāntam vibhum ātmānam matvā dhīraḥ na śocati","w":[["अशरीरम्","aśarīram","bodiless","अशरीर","aśarīra","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["aśarīra"]],["शरीरेषु","śarīreṣu","in bodies","शरीर","śarīra","सप्तमी, नपुं, बहु","saptamī, napuṃ, bahu","n. loc. pl.",["śarīra"]],["अनवस्थेषु","anavastheṣu","that do not abide","अनवस्थ","anavastha","सप्तमी, नपुं, बहु","saptamī, napuṃ, bahu","n. loc. pl.",["anavastha"]],["अवस्थितम्","avasthitam","abiding","अव-स्था","ava-sthā","क्त, द्वितीया, पुं, एक","kta, dvitīyā, puṃ, eka","past passive participle m. acc. sg.",["avasthā"]],["महान्तम्","mahāntam","great","महत्","mahat","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["mahat"]],["विभुम्","vibhum","all-pervading","विभु","vibhu","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["vibhu"]],["आत्मानम्","ātmānam","the Self","आत्मन्","ātman","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["ātman"]],["मत्वा","matvā","having known","मन्","man","क्त्वा","ktvā","absolutive",["man"]],["धीरः","dhīraḥ","the wise one","धीर","dhīra","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["dhīra"]],["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["शोचति","śocati","grieves","शुच्","śuc","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["śuc"]]],"t":"“Knowing the Self as bodiless within bodies, abiding within what does not abide, great and all-pervading, the wise man does not grieve.”","notes":["Śaṅkara: the bodies are those of gods, ancestors, men and the rest, all impermanent. The word ātman shows that it is not other than oneself: he knows it as ‘I am this’."],"by":null,"var":[],"x":false},{"n":"1.2.23","label":null,"d":"नायमात्मा प्रवचनेन लभ्यो न मेधया न बहुना श्रुतेन ।\nयमेवैष वृणुते तेन लभ्यस्तस्यैष आत्मा विवृणुते तनूं स्वाम् ॥ २३ ॥","i":"nāyam ātmā pravacanena labhyo na medhayā na bahunā śrutena |\nyam evaiṣa vṛṇute tena labhyas tasyaiṣa ātmā vivṛṇute tanūṃ svām || 23 ||","pd":"न अयम् आत्मा प्रवचनेन लभ्यः न मेधया न बहुना श्रुतेन यम् एव एषः वृणुते तेन लभ्यः तस्य एषः आत्मा विवृणुते तनूम् स्वाम्","pi":"na ayam ātmā pravacanena labhyaḥ na medhayā na bahunā śrutena yam eva eṣaḥ vṛṇute tena labhyaḥ tasya eṣaḥ ātmā vivṛṇute tanūm svām","w":[["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["अयम्","ayam","this","इदम्","idam","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["idam"]],["आत्मा","ātmā","Self","आत्मन्","ātman","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["ātman"]],["प्रवचनेन","pravacanena","by study of the Vedas","प्रवचन","pravacana","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["pravacana"]],["लभ्यः","labhyaḥ","to be attained","लभ्","labh","कृत्य, प्रथमा, पुं, एक","kṛtya, prathamā, puṃ, eka","gerundive m. nom. sg.",["labh"]],["न","na","nor","न","na","अव्यय","avyaya","indeclinable",["na"]],["मेधया","medhayā","by intellect","मेधा","medhā","तृतीया, स्त्री, एक","tṛtīyā, strī, eka","f. ins. sg.",["medhā"]],["न","na","nor","न","na","अव्यय","avyaya","indeclinable",["na"]],["बहुना","bahunā","by much","बहु","bahu","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["bahu"]],["श्रुतेन","śrutena","learning","श्रुत","śruta","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["śruta"]],["यम्","yam","which","यद्","yad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",["yad"]],["एव","eva","very","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["एषः","eṣaḥ","this (seeker)","एतद्","etad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["etad"]],["वृणुते","vṛṇute","longs for","वृ","vṛ","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vṛ"]],["तेन","tena","by that","तद्","tad","सर्वनाम, तृतीया, पुं, एक","sarvanāma, tṛtīyā, puṃ, eka","pronoun m. ins. sg.",["tad"]],["लभ्यः","labhyaḥ","it is to be attained","लभ्","labh","कृत्य, प्रथमा, पुं, एक","kṛtya, prathamā, puṃ, eka","gerundive m. nom. sg.",["labh"]],["तस्य","tasya","to him","तद्","tad","सर्वनाम, षष्ठी, पुं, एक","sarvanāma, ṣaṣṭhī, puṃ, eka","pronoun m. gen. sg.",["tad"]],["एषः","eṣaḥ","this","एतद्","etad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["etad"]],["आत्मा","ātmā","Self","आत्मन्","ātman","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["ātman"]],["विवृणुते","vivṛṇute","reveals","वि-वृ","vi-vṛ","लट्, प्रथम, एक","laṭ, prathama, eka","present 3rd sg.",["vivṛ"]],["तनूम्","tanūm","form, nature","तनू","tanū","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["tanū"]],["स्वाम्","svām","its own","स्व","sva","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["sva"]]],"t":"“This Self is not attained by study of the Vedas, nor by intellect, nor by much learning. It is attained through the very Self that the seeker longs for; to him this Self reveals its own nature.”","notes":["Śaṅkara: pravacana: mastering many Vedas; medhā: the power to retain the meaning of texts. The Self that this seeker prays for is attained through that same Self: one who, free from desire, seeks the Self alone, gains the Self by the Self. tanū: its true nature."],"by":null,"var":[],"x":false},{"n":"1.2.24","label":null,"d":"नाविरतो दुश्चरितान्नाशान्तो नासमाहितः ।\nनाशान्तमानसो वापि प्रज्ञानेनैनमाप्नुयात् ॥ २४ ॥","i":"nāvirato duścaritān nāśānto nāsamāhitaḥ |\nnāśāntamānaso vāpi prajñānenainam āpnuyāt || 24 ||","pd":"न अ-विरतः दुश्चरितात् न अ-शान्तः न अ-समाहितः न अ-शान्त-मानसः वा अपि प्रज्ञानेन एनम् आप्नुयात्","pi":"na a-virataḥ duścaritāt na a-śāntaḥ na a-samāhitaḥ na a-śānta-mānasaḥ vā api prajñānena enam āpnuyāt","w":[["न","na","not","न","na","अव्यय","avyaya","indeclinable",["na"]],["अ-विरतः","a-virataḥ","one who has not turned away","अविरत","avirata","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["avirata"]],["दुश्चरितात्","duścaritāt","from bad conduct","दुश्चरित","duścarita","पञ्चमी, नपुं, एक","pañcamī, napuṃ, eka","n. abl. sg.",["duścarita"]],["न","na","nor","न","na","अव्यय","avyaya","indeclinable",["na"]],["अ-शान्तः","a-śāntaḥ","one who is not calm","अशान्त","aśānta","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["aśānta"]],["न","na","nor","न","na","अव्यय","avyaya","indeclinable",["na"]],["अ-समाहितः","a-samāhitaḥ","one who is not concentrated","असमाहित","asamāhita","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["a","samāhita"]],["न","na","nor","न","na","अव्यय","avyaya","indeclinable",["na"]],["अ-शान्त-मानसः","a-śānta-mānasaḥ","one whose mind is not at peace","अशान्तमानस","aśāntamānasa","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["a","śānta","mānasa"]],["वा","vā","or","वा","vā","अव्यय","avyaya","indeclinable",["vā"]],["अपि","api","even","अपि","api","अव्यय","avyaya","indeclinable",["api"]],["प्रज्ञानेन","prajñānena","by knowledge","प्रज्ञान","prajñāna","तृतीया, नपुं, एक","tṛtīyā, napuṃ, eka","n. ins. sg.",["prajñāna"]],["एनम्","enam","this (Self)","एनद्","enad","सर्वनाम, द्वितीया, पुं, एक","sarvanāma, dvitīyā, puṃ, eka","pronoun m. acc. sg.",[]],["आप्नुयात्","āpnuyāt","can attain","आप्","āp","विधिलिङ्, प्रथम, एक","vidhiliṅ, prathama, eka","optative 3rd sg.",["āp"]]],"t":"“One who has not turned away from bad conduct, who is not calm, who is not concentrated, or whose mind is not at peace, cannot attain this Self by knowledge.”","notes":["Śaṅkara: aśānta: not withdrawn from the restlessness of the senses; asamāhita: with a scattered mind; aśāntamānasa: one whose mind, though concentrated, is still busy seeking the fruits of concentration. One free of these, who has a teacher, attains the Self through the knowledge of Brahman."],"by":null,"var":[],"x":false},{"n":"1.2.25","label":null,"d":"यस्य ब्रह्म च क्षत्रं च उभे भवत ओदनः ।\nमृत्युर्यस्योपसेचनं क इत्था वेद यत्र सः ॥ २५ ॥","i":"yasya brahma ca kṣatraṃ ca ubhe bhavata odanaḥ |\nmṛtyur yasyopasecanaṃ ka itthā veda yatra saḥ || 25 ||","pd":"यस्य ब्रह्म च क्षत्रम् च उभे भवतः ओदनः मृत्युः यस्य उपसेचनम् कः इत्था वेद यत्र सः","pi":"yasya brahma ca kṣatram ca ubhe bhavataḥ odanaḥ mṛtyuḥ yasya upasecanam kaḥ itthā veda yatra saḥ","w":[["यस्य","yasya","for whom","यद्","yad","सर्वनाम, षष्ठी, पुं, एक","sarvanāma, ṣaṣṭhī, puṃ, eka","pronoun m. gen. sg.",["yad"]],["ब्रह्म","brahma","the brahmin order","ब्रह्मन्","brahman","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["brahman"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["क्षत्रम्","kṣatram","the warrior order","क्षत्र","kṣatra","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["kṣatra"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["उभे","ubhe","both","उभ","ubha","प्रथमा, नपुं, द्वि","prathamā, napuṃ, dvi","n. nom. du.",["ubha"]],["भवतः","bhavataḥ","are","भू","bhū","लट्, प्रथम, द्वि","laṭ, prathama, dvi","present 3rd du.",["bhū"]],["ओदनः","odanaḥ","food","ओदन","odana","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["odana"]],["मृत्युः","mṛtyuḥ","death","मृत्यु","mṛtyu","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["mṛtyu"]],["यस्य","yasya","for whom","यद्","yad","सर्वनाम, षष्ठी, पुं, एक","sarvanāma, ṣaṣṭhī, puṃ, eka","pronoun m. gen. sg.",["yad"]],["उपसेचनम्","upasecanam","the sauce","उपसेचन","upasecana","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["upasecana"]],["कः","kaḥ","who","किम्","kim","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["kim"]],["इत्था","itthā","thus","इत्था","itthā","अव्यय","avyaya","indeclinable",["itthā"]],["वेद","veda","knows","विद्","vid","लिट्, प्रथम, एक","liṭ, prathama, eka","perfect 3rd sg.",["vid"]],["यत्र","yatra","where","यत्र","yatra","अव्यय","avyaya","indeclinable",["yatra"]],["सः","saḥ","he","तद्","tad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["tad"]]],"t":"“He for whom the brahmin and the warrior orders are both food, and death the sauce upon it: who thus knows where he is?”","notes":["Śaṅkara: a man of ordinary understanding, without the means just described, cannot know the Self as one who has them does. Brahmin and warrior, upholders of all order and protectors of all, are mere food to it, and Death, who carries off everything, does not even suffice as its sauce."],"by":null,"var":[],"x":false},{"n":"1.3.1","label":null,"d":"ऋतं पिबन्तौ सुकृतस्य लोके गुहां प्रविष्टौ परमे परार्धे ।\nछायातपौ ब्रह्मविदो वदन्ति पञ्चाग्नयो ये च त्रिणाचिकेताः ॥ १ ॥","i":"ṛtaṃ pibantau sukṛtasya loke guhāṃ praviṣṭau parame parārdhe |\nchāyātapau brahmavido vadanti pañcāgnayo ye ca triṇāciketāḥ || 1 ||","pd":"ऋतम् पिबन्तौ सुकृतस्य लोके गुहाम् प्रविष्टौ परमे परार्धे छाया-आतपौ ब्रह्म-विदः वदन्ति पञ्च-अग्नयः ये च त्रिणाचिकेताः","pi":"ṛtam pibantau sukṛtasya loke guhām praviṣṭau parame parārdhe chāyā-ātapau brahma-vidaḥ vadanti pañca-agnayaḥ ye ca triṇāciketāḥ","w":[["ऋतम्","ṛtam","the sure fruit (of action)","ऋत","ṛta","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["ṛta"]],["पिबन्तौ","pibantau","the two who drink","पा","pā","शतृ।शानच्, द्वितीया, पुं, द्वि","śatṛ/śānac, dvitīyā, puṃ, dvi","present participle m. acc. du.",["pā"]],["सुकृतस्य","sukṛtasya","of what one has oneself done","सुकृत","sukṛta","षष्ठी, नपुं, एक","ṣaṣṭhī, napuṃ, eka","n. gen. sg.",["sukṛta"]],["लोके","loke","in the world","लोक","loka","सप्तमी, पुं, एक","saptamī, puṃ, eka","m. loc. sg.",["loka"]],["गुहाम्","guhām","the cave","गुहा","guhā","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["guhā"]],["प्रविष्टौ","praviṣṭau","who have entered","प्र-विश्","pra-viś","क्त, द्वितीया, पुं, द्वि","kta, dvitīyā, puṃ, dvi","past passive participle m. acc. du.",["praviś"]],["परमे","parame","in the supreme","परम","parama","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg.",["parama"]],["परार्धे","parārdhe","abode of the highest","परार्ध","parārdha","सप्तमी, नपुं, एक","saptamī, napuṃ, eka","n. loc. sg.",["parārdha"]],["छाया-आतपौ","chāyā-ātapau","shade and light","छायातप","chāyātapa","द्वितीया, पुं, द्वि","dvitīyā, puṃ, dvi","m. acc. du.",["chāyā","ātapa"]],["ब्रह्म-विदः","brahma-vidaḥ","the knowers of Brahman","ब्रह्मविद्","brahmavid","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["brahmavid"]],["वदन्ति","vadanti","call","वद्","vad","लट्, प्रथम, बहु","laṭ, prathama, bahu","present 3rd pl.",["vad"]],["पञ्च-अग्नयः","pañca-agnayaḥ","those who keep the five fires","पञ्चाग्नि","pañcāgni","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["pañcāgni"]],["ये","ye","who","यद्","yad","सर्वनाम, प्रथमा, पुं, बहु","sarvanāma, prathamā, puṃ, bahu","pronoun m. nom. pl.",["yad"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]],["त्रिणाचिकेताः","triṇāciketāḥ","those who have thrice built the Nāciketa fire","त्रिणाचिकेत","triṇāciketa","प्रथमा, पुं, बहु","prathamā, puṃ, bahu","m. nom. pl.",["triṇāciketa"]]],"t":"“There are two who drink the sure fruit of their own deeds in this world, who have entered the cave, in the supreme abode of the highest. The knowers of Brahman call them shade and light; so do those who keep the five fires and those who have thrice built the Nāciketa fire.”","notes":["Śaṅkara: the two are the individual self and the supreme Self. Only one of them tastes the fruit of action, but both are said to ‘drink’, as a whole company is called ‘the people with umbrellas’ when only some carry them. ṛta is ‘truth’, the fruit of action, because it is certain to come. loke: in this body. The cave is the intellect; parārdha, ‘the place of the highest Brahman’, is the space within the heart, where Brahman is perceived. Shade and light: unlike each other, as one is bound to the cycle of birth and death and the other is not. Those of the five fires are householders."],"by":null,"var":[],"x":false},{"n":"1.3.2","label":null,"d":"यः सेतुरीजानानामक्षरं ब्रह्म यत्परम् ।\nअभयं तितीर्षतां पारं नाचिकेतं शकेमहि ॥ २ ॥","i":"yaḥ setur ījānānām akṣaraṃ brahma yat param |\nabhayaṃ titīrṣatāṃ pāraṃ nāciketaṃ śakemahi || 2 ||","pd":"यः सेतुः ईजानानाम् अक्षरम् ब्रह्म यत् परम् अभयम् तितीर्षताम् पारम् नाचिकेतम् शकेमहि","pi":"yaḥ setuḥ ījānānām akṣaram brahma yat param abhayam titīrṣatām pāram nāciketam śakemahi","w":[["यः","yaḥ","which","यद्","yad","सर्वनाम, प्रथमा, पुं, एक","sarvanāma, prathamā, puṃ, eka","pronoun m. nom. sg.",["yad"]],["सेतुः","setuḥ","bridge","सेतु","setu","प्रथमा, पुं, एक","prathamā, puṃ, eka","m. nom. sg.",["setu"]],["ईजानानाम्","ījānānām","for those who sacrifice","यज्","yaj","क्वसु।कानच्, षष्ठी, पुं, बहु","kvasu/kānac, ṣaṣṭhī, puṃ, bahu","perfect participle m. gen. pl.",["yaj"]],["अक्षरम्","akṣaram","imperishable","अक्षर","akṣara","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["akṣara"]],["ब्रह्म","brahma","Brahman","ब्रह्मन्","brahman","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["brahman"]],["यत्","yat","which","यद्","yad","सर्वनाम, प्रथमा, नपुं, एक","sarvanāma, prathamā, napuṃ, eka","pronoun n. nom. sg.",["yad"]],["परम्","param","supreme","पर","para","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["para"]],["अभयम्","abhayam","fearless","अभय","abhaya","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["abhaya"]],["तितीर्षताम्","titīrṣatām","of those who wish to cross","तॄ","tṝ","शतृ।शानच्, षष्ठी, पुं, बहु","śatṛ/śānac, ṣaṣṭhī, puṃ, bahu","present participle m. gen. pl.",["tṝ"]],["पारम्","pāram","the farther shore","पार","pāra","प्रथमा, नपुं, एक","prathamā, napuṃ, eka","n. nom. sg.",["pāra"]],["नाचिकेतम्","nāciketam","the Nāciketa fire","नाचिकेत","nāciketa","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["nāciketa"]],["शकेमहि","śakemahi","may we be able (to know)","शक्","śak","विधिलिङ्, उत्तम, बहु","vidhiliṅ, uttama, bahu","optative 1st pl.",["śak"]]],"t":"“May we be able to know the Nāciketa fire, which is the bridge for those who sacrifice; and also the imperishable, supreme Brahman, fearless, the farther shore for those who wish to cross.”","notes":["Śaṅkara: the fire is a bridge because it carries those devoted to rites across sorrow; ‘may we be able’ to know it and to build it. The supreme Brahman, called the Self, is the refuge of the knowers of Brahman who wish to cross the cycle of birth and death. Both the lower and the higher Brahman are to be known: these are the two spoken of in the first verse.","titīrṣatām is a desiderative participle; it is labelled here as a present participle."],"by":null,"var":[],"x":false},{"n":"1.3.3","label":null,"d":"आत्मानं रथिनं विद्धि शरीरं रथमेव तु ।\nबुद्धिं तु सारथिं विद्धि मनः प्रग्रहमेव च ॥ ३ ॥","i":"ātmānaṃ rathinaṃ viddhi śarīraṃ ratham eva tu |\nbuddhiṃ tu sārathiṃ viddhi manaḥ pragraham eva ca || 3 ||","pd":"आत्मानम् रथिनम् विद्धि शरीरम् रथम् एव तु बुद्धिम् तु सारथिम् विद्धि मनः प्रग्रहम् एव च","pi":"ātmānam rathinam viddhi śarīram ratham eva tu buddhim tu sārathim viddhi manaḥ pragraham eva ca","w":[["आत्मानम्","ātmānam","the self","आत्मन्","ātman","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["ātman"]],["रथिनम्","rathinam","the master of the chariot","रथिन्","rathin","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["rathin"]],["विद्धि","viddhi","know","विद्","vid","लोट्, मध्यम, एक","loṭ, madhyama, eka","imperative 2nd sg.",["vid"]],["शरीरम्","śarīram","the body","शरीर","śarīra","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["śarīra"]],["रथम्","ratham","the chariot","रथ","ratha","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["ratha"]],["एव","eva","indeed","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["तु","tu","and","तु","tu","अव्यय","avyaya","indeclinable",["tu"]],["बुद्धिम्","buddhim","the intellect","बुद्धि","buddhi","द्वितीया, स्त्री, एक","dvitīyā, strī, eka","f. acc. sg.",["buddhi"]],["तु","tu","and","तु","tu","अव्यय","avyaya","indeclinable",["tu"]],["सारथिम्","sārathim","the charioteer","सारथि","sārathi","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["sārathi"]],["विद्धि","viddhi","know","विद्","vid","लोट्, मध्यम, एक","loṭ, madhyama, eka","imperative 2nd sg.",["vid"]],["मनः","manaḥ","the mind","मनस्","manas","द्वितीया, नपुं, एक","dvitīyā, napuṃ, eka","n. acc. sg.",["manas"]],["प्रग्रहम्","pragraham","the reins","प्रग्रह","pragraha","द्वितीया, पुं, एक","dvitīyā, puṃ, eka","m. acc. sg.",["pragraha"]],["एव","eva","indeed","एव","eva","अव्यय","avyaya","indeclinable",["eva"]],["च","ca","and","च","ca","अव्यय","avyaya","indeclinable",["ca"]]],"t":"“Know the self as the master of the chariot, and the body as the chariot. Know the intellect as the charioteer, and the mind as the reins.”","notes":["Śaṅkara: the self meant here is the one bound to the cycle of birth and death, the ‘drinker’ of the first verse, who may travel either to liberation or onward in that cycle. The intellect is what determines; the mind is what forms intentions and doubts, and it holds the senses as reins hold horses."],"by":null,"var":[],"x":false},{"n":"1.3.4","label":null,"d":"इन्द्रियाणि हयानाहुर्विषयांस्तेषु गोचरान् ।\nआत्मेन्द्रियमनोयुक्तं भोक्तेत्याहुर्मनीषिणः ॥ ४ ॥","i":"indriyāṇi hayān āhur viṣayāṃsteṣu gocarān |\nātmendriyamanoyuktaṃ bhoktety āhur manīṣiṇaḥ || 4 ||","pd":"इन्द्रियाणि हयान् आहुः विषयान् तेषु गोचरान् आत्म-इन्द्रिय-मनः-युक्तम् भोक्ता इति आहुः मनीषिणः","pi":"indriyāṇi hayān āhuḥ viṣayān teṣu gocarān ātma-indriya-manaḥ-yuktam bhoktā iti āhuḥ manīṣiṇaḥ","w":[["इन्द्रियाणि","indriyāṇi","the senses","इन्द्रिय","indriya","द्वितीया, नपुं, बहु","dvitīyā, napuṃ, bahu","n. acc. pl.",["indriya"]],["हयान्","hayān","the horses","हय","haya","द्वितीया, पुं, बहु","dvi
